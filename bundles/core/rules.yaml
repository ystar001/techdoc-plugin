  edition: 플러그인 판 문구
- id: Q7-001
  title: 캡션은 제목만 — 짧은 명사구 하나
  rule: '표·그림 캡션은 간결한 명사구 하나로 값: tok.caption_max_chars 이하로 쓴다. 서술형·연결어미 종결·물음·설명·줄표 덧붙임·셋 이상 나열·개수·출처 표기를 쓰지 않는다.'
  core:
  - 품질
  - 일관성
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V17
    level: 막음
  - gate: V52
    level: 막음
- id: Q7-005
  title: 저작 문법을 독자에게 설명하지 않음
  rule: 「선언이 flowchart TD라」·「P1→P2」처럼 독자에게 보이지 않는 소스를 설명하지 않는다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-006
  title: 본문이 도표를 번호로 부름
  rule: 모든 도표는 본문이 번호로 부른다. 없는 문장을 짓기보다 있는 문장이 부르게 한다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V6
    level: 막음
- id: Q7-008
  title: 표의 줄을 이름으로 부름·행 나열 서두 허용
  rule: 표의 줄을 번호로 세지 말고 그 줄의 이름을 불러라(「「언제 드러나나」 줄이 ~이다」). 판독이 따라붙는 행 나열 서두는 위반이 아니다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q7-009
  title: 핵심은 표·그림, 곁가지는 산문
  rule: 판정 기준·값·산출물·비교·분기는 표·그림에, 근거·배경·주의는 산문·목록에 두어 표만 훑어도 절의 결론이 나오게 한다. 강등해 생긴 결번은 다시 매긴다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V12
    level: 막음
- id: Q7-010
  title: 캡션 번호 뒤 마침표
  rule: 캡션 정의줄은 「표 N.N-n.」처럼 번호 뒤에 마침표를 찍는다. 이 마침표는 검사기가 도표를 찾는 표지이므로 떼지 않고, 고칠 것은 캡션 글이다.
  core:
  - 일관성
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V17
    level: 막음
- id: Q7-014
  title: 그림 화살표는 작용하는 쪽에서 받는 쪽으로
  rule: 그림의 화살표는 작용하는 쪽에서 작용을 받는 쪽으로 긋는다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 일부
  enforce: []
- id: Q7-015
  title: 도형은 줄어들지 않게 그림
  rule: '도형의 원래 폭은 값: tok.diagram_max_width_px, 높이는 값: tok.diagram_max_height_px 안에 들게 그린다. 넣을 수 없는 지도·판정 나무만 줄어들 수 있고, 웹북 본문 폭에서 가로 스크롤을 두지 않는다.'
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: AT-pdf-mermaid
    level: 경고
- id: Q7-016
  title: 넘치는 도형을 다시 그리는 법
  rule: 넘치는 flowchart LR 은 TB 로 바꾸거나 subgraph 로 접고, 상자 글은 짧게(긴 설명은 아래 문단), 담을 것이 많으면 둘로 나눈다. 뜻·차례·화살표는 바꾸지 않는다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q7-018
  title: 그림이 어떻게 그려졌는지 설명하지 않음
  rule: 도표 아래 설명 문단은 필수가 아니다. 배치·상자·선을 옮겨 적는 문장은 지우고, 그림에 없는 것(뜻, 판단이 갈리는 곳, 두드러지는 값과 까닭)만 남기며 없으면 문단째 지운다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V53
    level: 막음
  - gate: V36
    level: 막음
- id: Q7-019
  title: 제목을 되풀이하는 호출 금지
  rule: 「X는 표 N과 같다」처럼 도표 제목을 되풀이하기만 하는 문장으로 부르지 않고, 내용을 말하는 문장이 괄호로 부른다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V54
    level: 막음
- id: Q7-020
  title: 표에 다른 절을 가리키는 열을 두지 않음
  rule: 「관련 절」·「규정 위치」·「다루는 장」처럼 행마다 절·장 번호만 적는 열은 지우고 호출은 본문 문장이 한다. 번호와 내용이 섞인 열은 번호만 뗀다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V62
    level: 막음
- id: Q7-021
  title: 비교 표는 비교 대상을 열로 나란히
  rule: 현재·목표, 관행·과학적 방법, 전·후처럼 견주는 표는 「영역 | 현재 | 목표 | 격차와 원인」 꼴로 각 상태를 따로 열에 세운다. 양쪽 상태는 본문 내용으로만 채우고 없으면 표를 두고 보고한다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q7-022
  title: 표 열 이름은 명사, 한 열 한 속성
  rule: 열 이름은 명사(내용·주 사용자·사용 시점·판정 기준)로 짓고 물음꼴·서술 꼴·비유를 쓰지 않는다. 한 열에는 한 속성, 같은 열의 칸은 같은 꼴로 맞추며 값·수치·출처는 바꾸지 않는다.
  core:
  - 일관성
  - 쉬운 말
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V63
    level: 막음
- id: Q7-023
  title: 점검표의 열
  rule: 점검표 열은 번호 · 영역 · (등급) · 점검 항목 · 충족 기준 · 확인 방법·증빙 · 근거 · 필수 | 판정 · 근거 한 줄 · 조치·담당·기한이다. 왼쪽은 서식에 채워져 있고 오른쪽 셋은 쓰는 사람이 채운다.
  core:
  - 일관성
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V65
    level: 막음
- id: Q7-024
  title: 도표는 번호로 — 자리말 금지
  rule: 인쇄하면 그림이 떠서 놓이므로 「아래 그림처럼」·「위 표」·「다음 표는」·「앞의 표 6.1-5」나 「N.N의 표」·「N장의 그림」처럼 자리로 부르지 않고 「그림 3.1-1처럼」 번호로 부른다. 상자 안·표 주석 안도 같다.
  core:
  - 일관성
  - 품질
  area: Q7
  layer: 본체
  status: 일부
  enforce:
  - gate: V66
    level: 막음
  - gate: V83
    level: 기록만
  edition: 플러그인 판 문구
- id: Q7-025
  title: 그림 바로 앞 「다음과 같다」 금지
  rule: 그림 바로 앞 문장을 「~은 다음과 같다.」로 끝내지 않고 「~은 그림 N과 같다」로 쓴다. 이때 주어는 그림 제목을 되풀이하지 않는 내용이다.
  core:
  - 일관성
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V66
    level: 막음
- id: Q7-027
  title: 표 읽는 법 상자를 지움
  rule: '「표 N은 순위표가 아니다」·「정성적 개관이지 정량 등급이 아니다」 같은 읽는 법 상자는 지우고, 안에 내용 문장이 있으면 그 한 문장만 표 아래 판독 문장으로 옮긴다. 표 칸이 순서형 표기면 「주: 순서 표기」 한 줄로 한다.'
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V67
    level: 막음
- id: Q7-028
  title: 쪽을 넘는 묶음 표는 첫 칸을 행마다 채움
  rule: 약어표 「군」처럼 첫 행에만 묶음 이름을 쓰고 아래 행을 비우지 않는다 — 인쇄할 때 표가 쪽을 넘으면 묶음이 보이지 않는다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 일부
  enforce: []
  edition: 플러그인 판 문구
- id: Q7-029
  title: 본문은 표를 읽어 주지 않음
  rule: 표의 열·행·칸 이름과 칸 값을 낫표·따옴표로 옮기거나, 줄을 세거나(「셋째 줄이」), 읽는 방향을 안내하는(「가로로 읽으면」·「왼쪽 열에는」) 문장을 쓰지 않는다. 표가 말하는 사실과 그 뜻을 평서문으로 쓰고 표는 괄호로 부르며, 표에 없는 해석을 덧붙이지 않는다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 일부
  enforce:
  - gate: V25
    level: 막음
  - gate: V36
    level: 막음
  - gate: V69
    level: 막음
- id: Q7-030b
  title: 도표 하나의 설명 차례
  rule: 도표 하나를 두면 설명은 「무엇을 보이나 → 읽는 법 → 결론」 차례로 한 번만 한다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 대기
  enforce: []
- id: Q7-031
  title: 그래프 축 이름과 단위
  rule: 축이 있는 그래프는 명세에 xlabel(항목 축)·ylabel(값 축, 단위는 괄호)을 두고 렌더러는 둘 다 그린다. 막대를 가로로 눕혀도 이 뜻은 바뀌지 않으며 unit 만 있는 옛 꼴도 고친다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V75
    level: 막음
- id: Q7-032
  title: 축 이름은 쉬운 말로
  rule: 축 이름은 그림 제목·캡션·항목·단위에서 가져온 쉬운 말로 쓰고 새 사실을 만들지 않는다. 한 축에 단위가 다른 값을 세운 그래프는 「값(항목마다 단위 다름)」으로 두고 그래프 꼴을 다시 본다.
  core:
  - 쉬운 말
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V80
    level: 기록만
- id: Q7-034
  title: 산문 속 형태별 재배치
  rule: 공식은 수식 상자, 속성을 견주는 병렬 항목은 표, 열거는 목록, 정량 비교는 차트, 개념 관계·흐름은 mermaid, 용어 규정은 정의 상자, 함정은 주의 상자, 워크드 예제는 예시 상자로 옮긴다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-036
  title: 정량 가독성 지표
  rule: '최장 무시각 글 런은 값: tok.max_textrun_chars 이하, 시각 밀도는 값: tok.visual_density_min 이상, 표 결함 0 을 잰다.'
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-037
  title: 내용 성격별 그림 꼴
  rule: 내용 성격별 그림 꼴(유형 비교 레이더, 성장 곡선 선 그래프, 단계 타임라인, 적합성 매트릭스 히트맵, 개선 전후 짝 막대, 순환·흐름 mermaid, 제품 비교 표)을 미리 정하고 중심 명제에 시각화를 몰아 둔다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-038
  title: 코드블록 속 구조 데이터는 표·목록으로
  rule: text 코드블록에 든 규약·매핑·비교는 표로, 글자로 그린 나무·분류는 목록으로 옮기고 진짜 의사코드·함수 시그니처·JSON 만 코드블록으로 둔다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-039
  title: 모든 도표에 번호 캡션
  rule: 모든 도표에 번호 캡션을 단다. 본문의 표에 굵은 이름표만 달지 않고, 부르지 않는 짧은 표는 목록·문장으로 바꾼다.
  core:
  - 품질
  - 일관성
  area: Q7
  layer: 본체
  status: 일부
  enforce:
  - gate: V6
    level: 막음
  - gate: V83
    level: 기록만
- id: Q7-041
  title: 캡션 자리 — 표는 위, 그림은 아래
  rule: 표 캡션은 표 위에, 그림·차트 캡션은 그림 아래에 단다. 표는 캡션 → 표 → 설명 차례를 지키고 캡션과 표 사이에 문단을 끼우지 않는다.
  core:
  - 일관성
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-043
  title: 데이터–형식 정합
  rule: 형식을 고르기 전에 그 형식이 요구하는 데이터가 원고에 있는지 묻는다. 낱말을 눈금에 올리지 않고, 숫자 없는 표로 좌표계를 만들지 않으며, 점 두 개를 곡선으로 잇지 않고, 조건이 다른 사례에 공유 축을 세우지 않으며, 단위·분모를 섞지 않고, 합계를 부분과 같은 계열에 두지 않으며, 결측을 0으로 그리지 않고, 논리 순서를 값 크기순으로 바꾸지 않는다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q7-044
  title: 판독 진술은 두 요소 비교로 확인
  rule: 그림에 대한 판독 진술은 그림 안 두 요소를 견줘 확인할 수 있어야 하고(「빈칸이 없다」·「중요하다」류는 안 됨), 형식이 판독을 배신하지 않게 한다(우열이 아니면 사다리 꼴 금지).
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q7-050
  title: 부호를 색으로 굳히지 않음
  rule: 개선이 음수로 나오는 일이 흔하므로 양수=좋음 색칠을 하지 않고, 축은 「관행 대비 개선폭」, 원값은 막대 끝 라벨, 부호는 위치(0선 좌우)·기호로 먼저 나타낸다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q8-001
  title: 인용과 괄호 덧말 사이 한 칸
  rule: 인용 뒤 괄호 덧말은 한 칸 띄운다 — 「[REF-262] (표 13.3-2)」. 붙여 쓰면 마크다운 링크가 되어 죽은 링크가 된다(괄호가 다음 줄에서 닫혀도 같다).
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V45
    level: 막음
- id: Q8-002
  title: 표 마지막 행 뒤 빈 줄
  rule: 표 마지막 행 뒤에 빈 줄을 둔다. 없으면 설명 문단이 표의 마지막 행으로 삼켜진다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V15
    level: 막음
- id: Q8-003
  title: 그림 글자도 본문 글꼴로 지정
  rule: mermaid 초기화와 차트 SVG 글자(ch-*)에 본문 글꼴(값 tok.font.body)을 직접 준다. 지정이 없으면 mermaid 는 trebuchet·verdana 로 그려지고, 떼어 낸 SVG·PDF 에서 글꼴이 갈린다.
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-qc_capture
    level: 기록만
  edition: 플러그인 판 문구
- id: Q8-005
  title: 인라인 코드는 영문 식별자에만
  rule: 인라인 코드는 필드 이름·코드값·파일 이름·명령 같은 영문 식별자에만 쓰고 한글이 든 인라인 코드는 쓰지 않는다. 짧은 한글 값 이름은 「」, 꼬리표·상태 표시는 보통 글자로 쓴다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V46
    level: 막음
- id: Q8-006
  title: 한글은 기울이지 않음
  rule: 한글 글꼴에는 기울임꼴이 없어 브라우저가 가짜 기울임을 만들므로 원고·웹북·PDF 어디서도 한글을 기울이지 않는다. 기울임은 학명·외국어 제목에만 쓴다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V47
    level: 막음
  - gate: DECK-style-ussa
    level: 막음
  edition: 플러그인 판 문구
- id: Q8-007
  title: 수식 안 한글은 text 로, 첨자에 두지 않음
  rule: 수식 안 한글은 text 명령으로 감싸고 첨자·underbrace 설명에 두지 않는다. 기호는 영문으로 두고 뜻은 수식 아래 「여기서 …」 문장으로 푼다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V48
    level: 막음
- id: Q8-008
  title: 숫자가 뒤따르지 않는 통화 기호는 이스케이프
  rule: 「US$는」·「21.50 $/m³」처럼 숫자가 뒤따르지 않는 통화 $ 는 역슬래시로 이스케이프한다. 코드 펜스 안은 이스케이프하지 않는다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V49
    level: 막음
- id: Q8-009
  title: 도형·차트 글자는 한 크기, 본문보다 작게
  rule: '도형·차트 글자는 표 글자와 같은 층위로 본문보다 작게 한 크기(웹북 값: tok.web.size.small · PDF 값: tok.print.size.small)로 쓰고 제목·눈금·각주를 크기로 가르지 않는다(굵기·색으로 가름). 불가피할 때만 줄이되 하한은 웹북 tok.web.size.diagram_min · PDF tok.print.size.min 이다.'
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-check_diagram_text
    level: 막음
  - gate: REV-measure_mermaid
    level: 막음
  - gate: AT-pdf-mermaid
    level: 경고
  - gate: AT-check_charts
    level: 기록만
- id: Q8-010
  title: 웹북 글자 단계 — 본문 > 표 = 그림 글 = 캡션
  rule: '웹북은 모든 화면 폭에서 본문(값: tok.web.size.body) > 표 = 그림 안 글 = 캡션(값: tok.web.size.small)의 단계를 한 값으로 지킨다. 좁은 화면에서 그림은 줄이지 않고 그림 상자 안 가로 이동으로 보이며, 표는 최소 폭(값: tok.web.table.min_width)을 두어 쪽이 넓어지지 않게 한다.'
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: REV-qc_capture
    level: 기록만
- id: Q8-014
  title: 참고문헌은 APA 7판 순서 유지
  rule: 참고문헌은 APA 7판 순서를 지키고 번호 순 배열로 바꾸지 않는다(번호가 뛰는 것은 그대로).
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: V68
    level: 막음
- id: Q8-015
  title: 참고문헌 묶음·정렬 기준
  rule: 참고문헌의 영문·국문 묶음은 항목이 실제로 시작하는 말(첫 지은이, 없으면 제목)로 가르고, 정렬은 대소문자를 가리지 않으며 지은이가 없으면 제목으로 한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: V68
    level: 막음
- id: Q8-017
  title: 본문 인용은 APA 저자-연도로 렌더
  rule: 본문 인용은 원고를 고치지 않고 렌더러가 [REF-n] 을 reference_list.json 의 지은이·연도로 바꿔 찍는다(같은 해 같은 지은이 2022a·2022b, 영문 둘 「A & B」·셋 이상 「A et al.」, 국문 「홍길동 외」). REF 번호는 문서별로 독립 유지하며 독자에게 보이지 않는다. 2차 서지 대조 뒤에 한다.
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 일부
  enforce: []
  edition: 플러그인 판 문구
- id: Q8-018
  title: mermaid 마디 글의 물결표
  rule: mermaid 마디 글 안에 「~」가 둘 있으면 지움줄로 읽히므로 홑 물결표를 그대로 두지 않는다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V73
    level: 막음
- id: Q8-019
  title: 그림 글자는 웹북·PDF 둘 다 실측
  rule: 그래프·흐름도 글자의 글꼴·크기는 원고 명세가 아니라 그려진 결과물에서 웹북과 인쇄 PDF 둘 다 실측해 확인한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-qc_capture
    level: 기록만
  - gate: REV-check_diagram_text
    level: 막음
  - gate: AT-pdf-mermaid
    level: 경고
  edition: 플러그인 판 문구
- id: Q8-022
  title: 표 행 사이에 빈 줄 금지
  rule: 표 행 사이에 빈 줄을 두지 않는다(파싱 실패).
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q8-023
  title: 렌더 순서 — 코드 펜스·mermaid·수식 보호
  rule: md2html 에 fenced_code 확장을 넣고 mermaid 보호 → 수식 보호 → 변환 → 수식 복원 → mermaid 복원 순서로 처리한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q8-024
  title: 수식 무결성 — 제어문자 복원·부등호
  rule: 카드 LaTeX 의 제어문자 오염을 스캔·복원하고 $$ 안 리터럴 부등호는 lt·gt 명령으로 바꾸며 mjx-merror 0 을 확인한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V37
    level: 막음
- id: Q8-025
  title: mermaid 전 블록 parse 검증과 라벨 인용
  rule: 웹북 번들 mermaid 로 모든 블록을 parse 하고, subgraph 제목·엣지 라벨의 공백·괄호·특수문자는 따옴표로 감싸며 줄바꿈은 br 태그로 쓴다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: REV-check_mermaid
    level: 막음
  - gate: PLG-FG-mermaid_label_risk
    level: 경고
- id: Q8-026
  title: 콜아웃 본문은 4칸 들여쓰기
  rule: '!!! 다음 첫 줄은 4칸 들여쓰기여야 하며 1~3칸이면 본문이 상자 밖으로 떨어진다.'
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V22
    level: 막음
- id: Q8-029
  title: 표 칸 굵게는 원고에 쓰지 않음
  rule: 표 칸 굵게는 첫 열을 포함해 원고에 쓰지 않는다. 행 머리를 돋보이게 해야 하면 웹북·PDF 표 꼴(CSS) 한 규칙으로 문서 전체를 같게 한다.
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: V81
    level: 기록만
  edition: 플러그인 판 문구
- id: Q8-030
  title: 결과물 실측 결함은 문서마다 0, 캡처는 커밋하지 않음
  rule: 한 글자만 다음 줄·그림 글 겹침·표 넘침 같은 결과물 실측 결함은 문서마다 0 으로 만든다. 캡처 폴더는 저장소에 넣지 않고 결함 목록 파일만 커밋한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: REV-qc_capture
    level: 기록만
  - gate: REV-qc_ledger
    level: 막음
  edition: 플러그인 판 문구
- id: Q8-037
  title: 인쇄 글자 크기 — 본문과 작은 글 한 단
  rule: 인쇄 본문은 tok.print.size.body, 표·도형·차트·캡션·상자는 한 단 아래 tok.print.size.small 로 찍고 상자 글자는 본문보다 크지 않게 한다.
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-pdf-bodypt
    level: 경고
  - gate: AT-pdf-mermaid
    level: 경고
- id: Q8-038
  title: 쪽 폭 넘침 0 — 한 요소가 문서 전체를 축소
  rule: 쪽 폭을 넘는 요소가 하나라도 있으면 Chromium 이 문서 전체를 줄여 찍으므로 「쪽 폭 초과」「축소 의심」이 0 이어야 한다. 넘침 허용값은 tok.print.check.width_tolerance.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-pdf-width
    level: 경고
  - gate: AT-pdf-bodypt
    level: 경고
  edition: 플러그인 판 문구
- id: Q8-058
  title: 인쇄 본문 — 양끝 맞춤 + 글자 단위 줄바꿈
  rule: 인쇄 본문은 tok.print.size.body·행간 tok.print.leading.body·먹(tok.color.ink.print)으로, 양끝 맞춤에 글자(음절) 단위 줄바꿈 + 금칙 strict 로 짠다. 표 칸·캡션·제목·이름표 같은 짧은 글은 어절 단위로 꺾는다. 단락은 들여쓰기 대신 아래 간격을 둔다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-pdf-bodypt
    level: 경고
- id: Q8-060
  title: 표 쪽 나눔 — 짧은 표는 통째, 나뉘면 앞뒤 최소 행
  rule: tok.print.break.table_whole_rows 이하 표는 통째로 넘기고, 나뉘면 앞 쪽·뒤 쪽에 각각 tok.print.break.table_split_min 행 이상 남기며 머리행을 반복한다. 「머리행 + 1행」만 쪽 끝에 남기지 않는다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
  edition: 플러그인 판 문구
- id: Q8-061
  title: 쪽 끝 외톨이·한 줄만 넘어간 쪽 없애기
  rule: 절 끝 묶음(결론 끝 두 항목 → 인용 목록 → 용어 풀이)을 붙여 판면 tok.print.check.fill_min 미만만 채운 쪽을 0 으로 하고, 쪽 끝에 외톨이 제목·캡션을 남기지 않는다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-pdf-gaps
    level: 기록만
- id: Q8-063
  title: 인용 번호·용어 풀이는 배경으로
  rule: 인용 번호와 절 끝 용어 풀이는 tok.print.size.note 회색으로 낮추고, 본문 용어의 웹 점선 밑줄은 없애며, 용어 풀이 위에 짧은 각주선을 둔다. 인용 번호는 줄 끝에서 쪼개지지 않게 한 덩어리로 둔다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-064
  title: 도형 글자 하한 미달은 경고로 보고
  rule: 인쇄 PDF 의 도형·차트 글자가 tok.print.size.small 미만이면 목록을, tok.print.size.min 미만이면 「하한 미만」을 경고로 보고한다. 빌드는 막지 않고 경고 목록을 배포 보고서에 싣는다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: AT-pdf-mermaid
    level: 경고
  edition: 플러그인 판 문구
- id: Q8-068
  title: 참고문헌 — 번호를 왼쪽에 매달고 원고 순서 유지
  rule: 인쇄 참고문헌은 [029] 번호를 왼쪽 매단 칸으로 옮기고 목록 순번은 지우며, 글은 tok.print.size.small 왼끝 맞춤, 순서는 원고(APA 7) 그대로 둔다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-075
  title: PDF 서체는 로컬 글꼴
  rule: 인쇄 시 인터넷이 필요한 CDN 글꼴 대신 로컬 글꼴(웹북 assets 또는 설치 글꼴)을 쓴다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
  edition: 플러그인 판 문구
- id: Q8-077
  title: PDF 검증 항목
  rule: 쪽 폭 넘침 0 · 전 쪽 글자 크기 축소 없음(PyMuPDF 표본) · mermaid 렌더 실패 0 · 차례→절 내부 링크 동작 · 무작위 10쪽 육안.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-pdf-width
    level: 경고
  - gate: AT-pdf-bodypt
    level: 경고
  - gate: AT-pdf-mermaid
    level: 경고
  - gate: AT-pdf-toc
    level: 경고
  edition: 플러그인 판 문구
- id: Q8-084
  title: PDF 는 웹북 HTML 을 그대로 읽는다
  rule: PDF 는 웹북 HTML 을 그대로 읽고 변환기를 다시 돌리지 않아 화면판과 인쇄판이 갈리지 않게 하며, 본문 글자 크기를 실측해 값 tok.print.size.body 가 아니면 경고한다.
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-release-moved
    level: 막음
  - gate: AT-pdf-bodypt
    level: 경고
  edition: 플러그인 판 문구
- id: Q8-090
  title: 카드 완결성 검증 시점과 판정
  rule: '본문 호출 한 건이 끝난 직후·세션 시작 때·카테고리 검토 직전에 verify_cards.py 로 카드 완결성을 재고, 사이즈별 본문 글자 하한(값: tok.plugin.card_min_chars)과 종결부로 판정한다. WARN 은 위양성이 많아 의심 카드 상세를 보고 정한다.'
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-001
  title: 글꼴은 산출물 사이 한 벌
  rule: 웹북·PDF 같은 산출물은 같은 글꼴 한 벌을 쓴다 — 본문·한글 tok.font.body, 라틴 장식 tok.font.latin_display, 고정폭은 코드에만. 정본은 디자인 원본이고 문서에서 덮어쓰지 않으며 크기 체계도 원본을 따른다.
  core:
  - 품질
  - 일관성
  area: Q9
  layer: 본체
  status: 전 편 완료
  enforce: []
  edition: 플러그인 판 문구
- id: Q9-022
  title: 의미색은 강조색과 함께 바꾸지 않음
  rule: 의미색(위험 tok.color.semantic.risk · 주의 tok.color.semantic.caution · 보조 회색 tok.color.semantic.sub)은 문서 강조색과 함께 바꾸지 않는 고정값이고, 적색은 위험에만 쓴다.
  core:
  - 품질
  - 일관성
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
  edition: 플러그인 판 문구
- id: Q9-026
  title: 구분용 색 나눔은 허용
  rule: 층마다 다른 색·계단 단계색·위험색처럼 항목마다 색이 다른 구분용 색은 괜찮다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-032
  title: 글자 색·면 색 2층과 대비 기준
  rule: 글자 전용 색(-ink)은 실제 바탕과 tok.contrast.text_deck 이상, 면·선 전용 색(-mark)은 tok.contrast.graphic_min 이상으로 하고, -mark 색은 글자에 쓰지 않으며 -ink 색으로 범주를 나누지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 일부
  enforce: []
- id: Q9-033
  title: 색 쌍 게이트 ΔE_ok ≥0.20·ΔL ≥0.10
  rule: 같은 화면에 다른 뜻으로 함께 놓이는 두 색은 tok.color.deltaE.semantic_pair 와 tok.color.deltaL.min 을 넘어야 하며, 범주 3개 이하는 의미색 / 4~6개는 한 색 명도 계단 / 7개 이상은 색으로 나누지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q9-038
  title: 하지 않는 것 목록
  rule: 클립아트·사진 배경 위 글자·3D 차트·원형 차트·이탤릭·말풍선·손글씨체·그림자·이모지·장마다 다른 배경색·애니메이션 전제 레이아웃·도형으로 그린 가짜 막대를 쓰지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q9-039
  title: 색만으로 나누지 않음 — 흑백에서도 남게
  rule: 범주·위계는 색만으로 나누지 않고 위치·형태·기호·명도를 먼저 쓴다. 흑백으로 찍어도 갈리게(명도 차 tok.color.deltaL.min) 하고 글자 대비는 작은 글 tok.contrast.text_min · 제목급 tok.contrast.large_min 이상으로 한다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q9-061
  title: 반복 요소는 바코드·막대그래프로 읽힌다
  rule: 같은 요소를 여럿 늘어놓을 때 요소마다 흰 테를 두르거나 높이를 뜻 없이 다르게 하지 않는다 — 덩어리 바깥 테 하나로.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-063
  title: 그래픽 대비 3:1 — 정보 칸·면의 모든 변
  rule: 정보를 담은 칸·면과 그림 속 정보 요소(빗금·영역)는 정보 그래픽이므로 모든 변에서 바탕과 tok.contrast.graphic_min 을 넘게 한다. 판을 나누는 바탕끼리의 경계에는 걸지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-002
  title: 완료 판정 — 렌더 먼저, 그 뒤 게이트 전부 0
  rule: '렌더를 먼저 돌린 뒤 게이트(값: tok.gate_range)를 돌려 전부 0 이어야 끝이다. 착수 전 규모는 옛 판을 기준선으로 잰다.'
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-003
  title: 옛 판 동결, 개정은 새 출력 폴더에서
  rule: 개정 시작 전에 옛 판을 태그로 동결하고 개정은 새 출력 폴더에서만 한다. 렌더·웹북 스크립트는 대상이 동결본이면 실행을 거부한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-004
  title: 생성물은 손으로 고치지 않는다 — 원천을 고쳐 다시 만든다
  rule: 카드·spec·팔레트 원본 같은 원천이 정본이다. 렌더·웹북·PDF·팔레트 파일 같은 생성물은 직접 고치지 않고 원천을 고쳐 다시 만든다(손으로 고친 것은 다음 빌드에서 사라진다).
  core:
  - 일관성
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
  edition: 플러그인 판 문구
- id: W-005
  title: REF ID 를 다시 매기지 않는다
  rule: REF ID 를 다시 매기지 않으며(인용이 깨진다), 줄일 때는 인용 기반으로 걷는다. 문서를 나눠도 REF 번호는 물려받는다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
  edition: 플러그인 판 문구
- id: W-006
  title: 규칙이 안 맞으면 문서가 아니라 규칙을 고친다
  rule: 모든 문서에 같은 기준과 임계를 쓴다. 규칙이 어느 문서에 맞지 않으면 그 문서에서 바꾸지 말고 규칙(과 절차서·프롬프트)을 고친다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
  edition: 플러그인 판 문구
- id: W-008
  title: 조사·어미 판단은 기계로 고치지 않음
  rule: 조사와 어미를 갈라야 하는 교정은 정규식으로 하지 않는다. 문체 리포트는 밀도만 재고 고치는 것은 사람이다.
  core:
  - 쉬운 말
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-018
  title: 역할 설명 게이트(V67)는 사람 판정
  rule: V67 은 꼴을 잡아 사람이 판정하며 0 이 목표가 아니다. 남긴 곳은 까닭을 문서 기록에 적고, 지운 자리 앞뒤 연결과 번호 목록을 다시 본다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V67
    level: 막음
  edition: 플러그인 판 문구
- id: W-021
  title: 표현 다듬기는 값·출처·뜻 불변, 문장 대장
  rule: 표현을 다듬을 때 값·단위·출처 표시·도표 번호·뜻은 바꾸지 않고 기계로 전후 대조하며, 문장마다 전→후 대장을 남긴다. 서브에이전트에 맡길 때는 「값·근거 보존」과 「새 내용 문장 금지」를 함께 준다.
  core:
  - 품질
  - 쉬운 말
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-028
  title: 절 번호 대응표와 문서 사이 호출
  rule: 절이 합쳐지거나 나뉘면 절 번호를 다시 매기고 옛→새 대응표를 남기며, 문서 안 호출과 다른 문서가 부르는 곳을 함께 고친다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 일부
  enforce:
  - gate: V2
    level: 막음
  - gate: V12
    level: 막음
  edition: 플러그인 판 문구
- id: W-030
  title: 문체를 되돌릴 때의 차례
  rule: 문체를 되돌릴 때는 바꾸기 전 문장을 먼저 되살리고, 그 뒤 손질된 문장의 끝맺음만 고치며 뜻·값·문장 수는 바꾸지 않는다.
  core:
  - 쉬운 말
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-033
  title: 이 절만 읽고 판단할 수 있는가
  rule: 절마다 그 절만 읽고 그 판단을 내릴 수 있는지 보고, 모자라면 그 자리에서 보강한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 대기
  enforce: []
- id: W-033b
  title: 전문가 검토는 두 관점 — 지우면 안 되는 것·설명이 끊긴 곳
  rule: 줄이는 작업의 전문가 검토는 분야 전문가(지우면 안 되는 것)와 독자(설명이 끊긴 곳) 두 관점으로 한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 대기
  enforce: []
- id: W-034
  title: 옮길 때는 받는 자리에서 쓰는 것만
  rule: 내용을 옮길 때는 받는 자리에서 독자가 쓰는 것만 옮기고, 쓰이지 않는 것은 되살림 자료에만 남긴다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-035
  title: AI 전문가 검토는 실제 검토를 대신하지 않음
  rule: Claude 작업자의 전문가 관점 검토는 실제 전문가 검토를 대신하지 않으며, 그렇다고 작업을 멈추지 않고 실제 전문가·현장 검증은 발간 뒤 과제로 문서 한계에 밝힌다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 대기
  enforce: []
- id: W-041
  title: 게이트가 실제로 대상을 보았는지 확인
  rule: 게이트는 대상 판을 환경변수로 고르고, 실제로 대상 파일을 읽었는지 확인한다. 대상을 하나도 읽지 못한 0건은 통과가 아니다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-042
  title: --apply 도구는 dry-run 먼저
  rule: 고치는 도구는 인자 없이 돌리면 dry-run 이며, 항상 dry-run 으로 범위를 본 뒤 적용한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-043
  title: 정규식·패치는 파일로 쓰고 자기검사
  rule: 일괄 치환 정규식과 소스 패치는 셸 히어독에 쓰지 않고 스크립트 파일로 저장해 돌리며, 채택 전에 잡을 것·잡지 않을 것을 넣어 자기검사한다. 한글 뒤에 단어 경계를 두지 않고, 소스를 고친 뒤에는 구문 검사를 한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-044
  title: 게이트 0 이 다 된 것이 아님
  rule: 게이트는 금지어가 있는지를, 리뷰는 그 말이 맞는지를 본다. 게이트가 0 이어도 전문가 리뷰를 거친다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-045
  title: 사람 눈으로 잡은 결함 유형은 게이트로 승격
  rule: 사람 눈으로 잡은 결함 유형은 게이트 정본에 기계 검사로 승격해야 닫히고, 검사를 못 만들면 절차 규정으로 남기며 둘 다 못 하면 「미해결」로 둔다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-046
  title: 지적은 원문·실측으로 다시 확인한 뒤 반영·보류·기각
  rule: 검토 보고를 그대로 받아 적지 않는다. 지적받은 자리를 하나씩 원문·실측으로 다시 확인한 뒤 반영하고, 범위 밖은 보류, 틀렸으면 기각하며 무엇을 어떻게 확인했는지 적는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-048
  title: 브리프·검토 기준에 판단 기준을 늘 넣음
  rule: 서브에이전트 브리프와 검토 기준에는 핵심 규칙 셋(네 원칙)·세 물음·한계 명시를 늘 넣는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-052
  title: 이미 규칙이 된 판단은 묻지 않고, 맞지 않는 경우는 묻는다
  rule: 이미 규칙이 된 판단은 사용자에게 다시 묻지 않는다. 규칙이 그 문서에 맞지 않으면 문서에서 바꾸지 말고 사용자에게 물어 규칙을 고친다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
  edition: 플러그인 판 문구
- id: W-062
  title: 뜻이 달라질 수 있는 자리는 사용자가 봄
  rule: 다듬기로 뜻이 미세하게 달라질 수 있는 자리는 분야 관점으로 표시해 사용자가 본다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-067
  title: 결함 수정이 먼저, 가독성 보강은 뒤
  rule: 표·수식·도해가 깨져 있으면 결함 수정 절차를 먼저 하고, 내용은 멀쩡한데 읽기 어려우면 가독성 보강(구조 재배치)을 뒤에 한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-068
  title: 면제는 의례문만, 면제해도 무시각런은 지킴
  rule: 시각요소가 부자연스러운 의례문(발간사 등)만 시각요소 기준에서 면제하고 사유를 남기며, 면제해도 무시각런 상한은 지킨다. 본문 절·별첨은 면제하지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-069
  title: 정리 착수 전 스냅샷과 기준 검증
  rule: 정리 작업 착수 전에 커밋으로 스냅샷을 만들고 카드 검증 FAIL 0 을 확인하며 대상 현황을 파악한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-071
  title: 정리 검증 묶음과 로컬 서버 정리
  rule: 정리 뒤 카드 검증 FAIL 0·mermaid 파싱 실패 0·제어문자 0·판본 잔재 0·브라우저 실측을 통과하고, 띄운 로컬 서버는 끝나면 반드시 정리한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-073
  title: 개정 검증은 네 가지, 서로 대체되지 않음
  rule: 개정 검증은 ① 명세 일치 ② 규약 준수 ③ 무결성 ④ 회귀 없음을 보며, 넷은 서로 대체되지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-075
  title: 게이트 설정 규율 — 임계는 공통, 면제는 항목별
  rule: 통과시키려고 임계를 낮추지 않는다. 임계는 공통으로 두고, 사전(잔재·폐기어·누출 등)과 면제는 프로젝트 설정 파일에 항목별로 사유와 함께 적으며, 게이트를 끄는 것도 그 파일로만 한다.
  core:
  - 일관성
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V1
    level: 막음
  - gate: V5
    level: 막음
  edition: 플러그인 판 문구
- id: W-076
  title: 검증 4계층 — 카드 1건 검사를 건너뛰지 않음
  rule: 저장 직후·카드 1건 완료 직후·장 묶음·릴리스 전의 네 계층으로 검증하고, 가장 싼 카드 1건 검사를 건너뛰지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-077
  title: 공용 수정기를 검사기로 게이트에 물림
  rule: 공용 수정 스크립트는 기본 dry-run 이라 그대로 검사기로 쓰며, 표·링크·디자인 드리프트·mermaid 파싱 검사(T1~T8)를 게이트로 돌리고 「건너뜀」도 실패로 센다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-080
  title: 개정 명세서는 살아 있는 계약
  rule: 실제 카드 상태가 개정 명세서의 처분과 일치해야 하며, 옮길 것을 스크립트에 다시 적지 않고 명세서를 읽게 한다. 명세서가 틀렸으면 명세서를 고친다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V9
    level: 막음
- id: W-081
  title: 새 게이트는 위반 사례를 넣어 확인
  rule: 새 게이트를 만들면 일부러 위반 사례를 넣어 실제로 잡히는지 확인하고, 판정이 어려운 것은 실제로 고친 표현의 확정 목록으로 만든다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-082
  title: 카드 생성 호출 동시성 상한
  rule: '카드 생성·재작성 호출은 동시성 상한(값: tok.card_call_concurrency_max)을 넘지 않는다.'
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-085
  title: 검증용 임시 복사본은 저장소에 남기지 않음
  rule: 검증용 임시 복사본은 확인 뒤 지우고 무시 목록으로 막는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-087
  title: 구조를 지우는 치환은 매치 목록·불변량 확인
  rule: 캡션·표·펜스처럼 문서 뼈대를 지우는 치환은 적용 전에 매치 목록을 출력하고, 전후로 불변량(캡션 수 등)을 세어 달라지면 그 파일을 건너뛴다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-088
  title: 치환기는 mermaid 노드를 건드리지 않음
  rule: 식별자를 서술 참조로 바꾸는 치환기는 mermaid 노드 ID 를 건드리지 않게 가드를 두고, 도해 라벨에는 약칭만 쓴다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-091
  title: 캡션 표기는 통일부터 하고 센다
  rule: 캡션 표기가 갈려 있으면 한 꼴로 통일부터 하고 게이트로 센다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V6
    level: 막음
- id: W-117
  title: 디자인 검토 세 관점을 따로
  rule: 디자인 시스템·정보시각화·제작 실행성 세 관점을 각각 따로 돌린다 — 한 검토자가 겸하면 형식에 눈이 가 내용을 놓친다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-120
  title: 같은 경고가 여러 문서에서 되풀이되면 막음 또는 규칙 수정
  rule: 경고는 배포를 막지 않되 기록에 남기고, 같은 경고가 여러 문서(값 tok.warning_promote_repeat)에서 되풀이되면 막음으로 올리거나 규칙을 고친다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
  edition: 플러그인 판 문구
- id: W-128
  title: YAML 흐름 목록 글의 쉼표·쌍점은 큰따옴표
  rule: 흐름 목록 안 글에 쉼표·쌍점·물음표나 숫자 쉼표가 있으면 큰따옴표로 감싼다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-134
  title: 다른 프로젝트 고유 규칙은 공통 도구로 옮기지 않는다
  rule: 공통 도구로 범용화할 때 원 프로젝트 고유 협의 규칙은 빼고 인자로 바꾼다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-135
  title: 프로젝트 문체·기밀 규칙이 스킬보다 앞섬
  rule: 프로젝트의 문체·기밀 규칙이 범용 스킬보다 앞서고, 원고가 기밀이면 외부 서비스에 올리지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-143
  title: 검토자는 만든 사람이 아니고, 설명보다 결과물을 먼저 본다
  rule: 디자인 검토자는 만든 사람이 아니며, 작성자 설명(concept)을 읽기 전에 결과물(렌더·실제 크기 펼침면)·원고·브리프만 보고 먼저 채점한 뒤 설명과 실제가 맞는지 덧붙인다. 축소 접촉 시트만으로 판정하지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-144
  title: 디자인 검토 통과 기준
  rule: '평균이 기준(값: tok.review_pass_mean) 이상이고 하한(값: tok.review_item_floor) 이하 항목이 없으면 통과, 그 밖은 수정 필요이며 고칠 것을 무엇을·어디서·어떻게 우선순위 순으로 적는다. 내용·사실 오류는 점수와 무관하게 수정 필요다.'
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-145
  title: 디자인 검토 결과 기록 꼴
  rule: 검토 결과는 회차마다 점수표·평균·판정·수정 목록·「설명과 실제」 한 단락·잘된 점 둘로 남긴다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-152
  title: 원고 확정을 기다리지 않는다
  rule: 산출 단계의 끝은 내용 확정이 아니라 파이프라인 완성이며, 언제든 그 시점 원고로 다시 만든다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-186
  title: 점검 방법 A·B·C 의 통과 기준
  rule: 자동 게이트(A)는 0 이어야 다음 단계로 가고, 전문가 검토(B)는 통과·실패를 가르지 않고 제안마다 결정하며, 결과물 실측(C)은 설정값을 믿지 않고 렌더를 캡처해 결함 0 을 본다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-189
  title: 결함 분류·재점검·승격
  rule: 결함을 등급(지금 막음·고침·제안)으로 나누고, 고친 뒤 같은 방법으로 다시 점검하며, 기계로 잡히면 게이트로 올리고 다른 문서에도 쓰일 유형이면 도구 발견 대장에 한 줄 올린다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
  edition: 플러그인 판 문구
- id: W-192
  title: 규칙 항목의 꼴
  rule: 규칙 항목은 번호·제목·내용·범위·게이트·근거·날짜를 갖는 꼴로, 일반 규칙 묶음과 프로젝트 규칙 묶음으로 나눠 둔다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: Q1-078
  title: 문서가 스스로 내놓는 제안은 싣지 않는다
  rule: 공공 설계 제안·로드맵·기간 전망·미정 협력 후보·정책 권고처럼 문서가 스스로 내놓는 제안은 지운다. 회사·기관·지자체가 공식 발표한 목표·계획은 「발표 주체·연도」를 붙여 남긴다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 보류
  enforce: []
