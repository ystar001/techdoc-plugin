  - 일관성
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V60
    level: 막음
- id: Q6-023
  title: 별첨 문자는 건너뛰지 않음
  rule: 별첨 문자는 A 부터 건너뛰지 않고 이어 매기며, 바꿀 때 호출·표 번호·폴더를 함께 고치고 건너뛴 까닭을 설명하지 않는다.
  core:
  - 일관성
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V59
    level: 막음
- id: Q6-026
  title: 결론은 내용 작업이 끝난 뒤 마지막에 씀
  rule: 절 결론은 그 절의 내용을 고치는 작업이 끝난 뒤 마지막에 쓴다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q6-028
  title: 약어표에 두 번 이상 나오는 약어를 모두
  rule: 뒷붙이 「용어와 약어」 표에는 본문에 두 번 이상 나오는 약어를 모두 싣는다.
  core:
  - 일관성
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q6-029
  title: 별첨은 본문 흐름을 끊는 현장 도구만
  rule: 별첨에는 현장에서 손에 쥐고 쓰지만 본문에 넣으면 흐름을 끊는 실용 도구(점검표·기록 서식·빈 계산표·판정표·찾아보기 목록)만 둔다. 도구의 정본은 별첨이고 본문은 판단과 근거를 설명한 뒤 안내한다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q6-030
  title: 별첨 수에 목표를 두지 않음
  rule: 별첨은 도구가 있는 문서만 두고, 별첨 수에 목표를 두거나 문서마다 같은 별첨을 갖추지 않는다. 일관성은 같은 별첨을 두는 것이 아니라 같은 기준으로 고르는 것이다.
  core:
  - 품질
  - 일관성
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce: []
  edition: 플러그인 판 문구
- id: Q6-033
  title: 별첨 카드의 짜임
  rule: 별첨 카드는 쓰임과 대상(누가·언제·무엇을, 내려받기, 앞뒤 도구, 머리 기입란, 준비물) → 서식 구성과 판정 기호 → 점검 항목(영역마다 안내 문장이 표를 부름) → 결과 읽기와 다음 단계(작성 예 한 벌) 차례로 짠다.
  core:
  - 품질
  - 일관성
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V65
    level: 막음
- id: Q6-037
  title: 번호 체계
  rule: 「제N장」은 책 전체에서 이어지고, 절은 「장.절」(덧번호 없음), 항은 절 안 「1.」, 표·그림은 「표 장.절-n」(절 번호를 물려받음), 별첨은 「표 A-n」이며 카드 분할 ID 를 쓰지 않는다. 앞부분은 번호가 없고 본문 소제목은 절보다 아래 층위다.
  core:
  - 일관성
  - 품질
  area: Q6
  layer: 본체
  status: 일부
  enforce:
  - gate: V12
    level: 막음
  - gate: V72
    level: 막음
  - gate: V79
    level: 기록만
- id: Q6-040
  title: 항 「1.」, 소항 「1)」
  rule: 절 안 항 번호는 「1.」, 그 아래 소항은 「1)」로 매긴다. 「2.1」 꼴은 절 번호로 읽히므로 쓰지 않는다.
  core:
  - 일관성
  area: Q6
  layer: 본체
  status: 일부
  enforce:
  - gate: V78
    level: 기록만
- id: Q6-042
  title: 절 제목의 핵심어를 그 말로 정의
  rule: 제목이 「A와 B」를 약속하면 본문은 첫 항에서 「A는 …이다」, 이어 「B는 …이다」를 그 말 그대로 쓰고, A·B 가 왜 짝인지 잇는 문장을 둔다.
  core:
  - 품질
  - 일관성
  area: Q6
  layer: 본체
  status: 일부
  enforce: []
- id: Q6-056
  title: 항 안 소항은 같은 층위·같은 갈래
  rule: 한 항 아래 소항 1)·2)…는 같은 갈래(경로들, 실증들)여야 하고, 원리·실증·규제·국내 동향처럼 갈래가 다르면 항을 나누거나 갈래별로 묶는다.
  core:
  - 품질
  - 일관성
  area: Q6
  layer: 본체
  status: 대기
  enforce:
  - gate: V78
    level: 기록만
- id: Q6-057
  title: 소항이 많으면 묶을 갈래를 찾음
  rule: '한 항의 소항이 값: tok.subitems_soft_max 를 넘으면 묶을 갈래가 있는지 본다.'
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 대기
  enforce:
  - gate: V78
    level: 기록만
- id: Q6-068
  title: 별첨 하나가 절 하나면 표제를 겹치지 않음
  rule: 별첨 하나가 절 하나뿐이면 별첨 표제와 절 표제를 겹쳐 달지 않는다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 일부
  enforce: []
- id: Q6-074
  title: 가독성 보강은 재배치이지 증량이 아님
  rule: 가독성 보강은 산문에 묻힌 구조를 꺼내 알맞은 형식으로 옮기는 것이며 새 내용을 짓지 않는다. 분량 증가는 목표가 아니다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-079b
  title: 그림 안 글 길이 상한
  rule: mermaid 마디·연결선 글은 값 tok.fig_node_text_max, 그래프 축 이름·눈금 글은 값 tok.chart_axis_text_max 를 넘지 않게 쓰고 임계는 설정 파일에 둔다.
  core:
  - 쉬운 말
  - 품질
  area: Q7
  layer: 본체
  status: 대기
  enforce:
  - gate: V80
