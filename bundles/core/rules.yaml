# 본체 규칙 묶음(공개판) — 생성물, 손으로 고치지 않는다 (v1.11-c, E15).
# 시리즈 규칙 대장의 본체 규칙에서 문서 종류·분야·시리즈 관례를 아래 층으로 옮기고
# 분야 낱말을 걷은 플러그인 판 문구(edition)로 냈다. 생성: scripts.bundle_split --public-map
- id: P-002
  title: 중복성 배제 — 품질의 한 갈래
  rule: 같은 내용은 정의 자리 한 곳에만 두고 나머지는 부른다. 절 안에서 같은 말을 하는 문단·상자·표·그림과 대상·편마다 되풀이되는 틀을 걷는다.
  core:
  - 품질
  area: P
  layer: 본체
  status: 알 수 없음
  enforce: []
  edition: 플러그인 판 문구
- id: P-003
  title: 일관성 유지 — 한 말 한 뜻, 같은 것은 같은 이름·꼴·값
  rule: 한 말에는 한 뜻을, 같은 것에는 같은 이름·꼴·값을 문서 안·문서 사이·출력물 사이에서 맞춘다.
  core:
  - 일관성
  area: P
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: P-004
  title: 품질 우선 — 판단에 필요한 설명은 쪽수보다 앞섬
  rule: 판단에 필요한 설명과 근거는 그 자리에서 완결되게 남기고, 쪽수 목표를 넘더라도 지킨다. 줄이는 것은 되풀이뿐이며 다른 편 안내로 설명을 대신하지 않는다.
  core:
  - 품질
  area: P
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: P-005
  title: 쉬운 말 — 흔한 말로 뜻이 분명하게
  rule: 일반적으로 쓰는 말로 뜻이 분명하고 읽기 쉽게 쓴다. 번역투·외국식 표현을 쓰지 않고, 전문 용어는 분야에서 실제로 쓰는 말을 첫 자리에서 풀이한다.
  core:
  - 쉬운 말
  area: P
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V35
    level: 막음
- id: P-006
  title: 필요한 것만 넣는다
  rule: 독자가 그 자리에서 쓰지 않는 내용(형식을 채우는 규범 설명·일반론·나열)은 부족해 보여도 넣지 않고 되살림 자료에만 남긴다. 「값·REF 손실 0」은 쓰는 값이 사라지지 않게 하라는 뜻이다.
  core:
  - 품질
  area: P
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: P-010
  title: 핵심 규칙 셋과 순위 — 부딪히면 품질
  rule: 모든 문서는 품질(중복성 배제 포함)·일관성·쉬운 말 셋을 지킨다. 셋이 부딪히면 품질이 앞서고, 되풀이를 걷어 설명이 끊기거나 이름을 맞춰 뜻이 틀어지면 하지 않고 사용자에게 묻는다.
  core:
  - 품질
  - 일관성
  - 쉬운 말
  area: P
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: P-014
  title: 확산은 글이 아니라 코드로
  rule: 규칙·값을 여러 곳에 퍼뜨릴 때는 문서 안내가 아니라 생성·동기화 스크립트로 한다.
  core:
  - 일관성
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-015
  title: 검사는 산출물의 마지막 형태에서 한다
  rule: 검사는 조립 전 중간물이 아니라 표지까지 붙인 최종 산출물에서 다시 잰다.
  core:
  - 품질
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-016
  title: 품질점검은 영역 × 방법 × 시점, 한 항목 한 자리
  rule: 품질점검은 무엇을(영역 Q1~Q9) × 어떻게(방법 A·B·C) × 언제(시점) 세 축으로 짜고, 한 항목은 세 축 위에 한 자리만 갖는다.
  core:
  - 품질
  - 일관성
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-017b
  title: 한계는 밝히고 나아간다
  rule: 근거·검증이 모자란 자리는 감추지 않고 문서의 「한계」에 밝힌 채 나아가며, 검증은 판을 거듭하며 쌓는다.
  core:
  - 품질
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-018
  title: 기계로 잡을 것은 게이트, 판단은 검토, 화면 전용은 실측
  rule: 기계로 잡을 수 있는 것은 게이트로, 사람의 판단이 필요한 것은 전문가 검토로, 화면·PDF 에서만 보이는 것은 결과물 실측으로 잡는다.
  core:
  - 품질
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-019
  title: 자산은 네 층 — 본체·문서 종류·분야·시리즈
  rule: 규칙·도구 자산을 본체 / 문서 종류 / 분야 / 시리즈의 네 층으로 나눈다.
  core:
  - 일관성
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-020
  title: 일반과 특수를 가르고 본체가 묶음을 읽는다
  rule: 모든 기술 문서에 맞는 것은 본체로, 특정 시리즈에만 맞는 값(대표 사례·편 코드·표지 값)은 프로젝트 묶음으로 두고 본체가 그 묶음을 읽어 쓴다.
  core:
  - 일관성
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
  edition: 플러그인 판 문구
- id: P-021
  title: 규칙은 데이터로, 검사는 규칙 번호를 단다
  rule: 규칙은 사람이 읽는 문서이면서 기계가 읽는 목록(번호·적용 범위·게이트·근거)이어야 하고, 게이트는 규칙 번호를 단다.
  core:
  - 일관성
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-022
  title: 한 자산, 한 자리
  rule: 같은 기준이 문서·스크립트·프롬프트에 따로 쓰여 있으면 하나를 정본으로 하고 나머지는 거기서 만든다.
  core:
  - 일관성
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-023
  title: 확정된 판단을 회귀 시험 자료로
  rule: 원고·게이트 결과·사용자 결정을 시험 자료로 삼아, 도구를 고쳐도 이미 확정된 판단이 깨지지 않게 한다.
  core:
  - 품질
  - 일관성
  area: P
  layer: 본체
  status: 대기
  enforce: []
- id: Q1-001
  title: 개정 때 쓰는 값·출처는 잃지 않음
  rule: 고칠 때 쓰는 근거·수치·출처는 하나도 잃지 않는다(값·REF 손실 0). 지우는 것은 되풀이와 쓰지 않는 내용뿐이며, 그때도 값·REF 가 문서 어딘가에 남는지 대조한다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: REV-preserve_baseline
    level: 기록만
- id: Q1-002
  title: 요약은 본문에 없는 것을 말하지 않음
  rule: 요약·결론은 본문에 없는 이름·수치를 말하지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V14
    level: 막음
  - gate: V57
    level: 막음
- id: Q1-003
  title: 죽은 참조·고아 REF 0
  rule: 죽은 상호참조 0, 고아 REF 0, 인용됐는데 목록에 없는 REF 0.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V2
    level: 막음
  - gate: V8
    level: 막음
  - gate: V30
    level: 막음
- id: Q1-004
  title: 백과사전을 원전 자리에 두지 않음
  rule: 백과사전·위키는 원전 자리에 두지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V13
    level: 막음
- id: Q1-005
  title: 같은 문헌의 중복 등록은 병합
  rule: 같은 문헌을 두 ID 로 등록했으면 하나로 합친다.
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V13
    level: 막음
- id: Q1-006
  title: 출처를 지어내지 않음
  rule: 참고문헌 항목(REF)과 서지를 지어내지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q1-007
  title: 순서형 척도는 평균 내지 않음
  rule: 순서형 척도(BBCH 등)는 등간이 아니므로 평균 내지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q1-008
  title: R²·정확도에는 조건 라벨
  rule: R²·정확도 같은 성능 값은 대상·시기·모형에 따라 달라지므로 조건 라벨을 붙인다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce: []
  edition: 플러그인 판 문구
- id: Q1-009
  title: 계통오차는 융합으로 줄지 않음
  rule: 여러 자료를 융합해 줄어드는 것은 우연오차이며 계통오차(편의)는 줄지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q1-010
  title: 등급·수준은 우열이 아니라 목적별 적정
  rule: 적합성 등급·도입 수준처럼 높을수록 좋다고 읽히기 쉬운 척도는 우열이 아니라 목적에 맞는 수준으로 쓴다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q1-011
  title: 절에는 사례가 하나 이상
  rule: 절마다 수치·조건값·판정 결과 가운데 하나 이상의 사례를 둔다.
  core: &id001
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V32
    level: 막음
- id: Q1-011b
  title: 사례가 없는 절은 「(자료 보완 필요)」
  rule: 사례(수치·조건값·판정 결과)를 구하지 못한 절은 「(자료 보완 필요)」로 적는다.
  core: *id001
  area: Q1
  layer: 본체
  status: 일부
  enforce: []
- id: Q1-020
  title: 성과는 같은 해 대조와의 차이
  rule: 성과는 같은 해 대조와의 차이로 보고, 도입 전후 단순 비교는 해 효과가 섞인다는 표지 없이 쓰지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-022
  title: 근거가 없는 내용은 싣지 않음
  rule: 수치·성과·사실 주장은 달린 출처가 실제로 뒷받침할 때만 싣고, 그렇지 않은 값·일반론 수치·근거 없는 전망은 지운다. 「확인되지 않았다」로 바꿔 남기거나 새 사실로 메우지 않는다(교과서로 검증되는 절차·원리는 둔다).
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-claim_screen
    level: 기록만
- id: Q1-023
  title: 원 자료를 찾지 못한 값은 뺀다
  rule: 원문·1차 자료를 찾지 못하고 2차 인용에서만 확인되는 값·주장은 지운다. 웹이 막혀 확인 못 한 것도 찾지 못한 것으로 보되, 대조하지 않은 범위는 지우지 않고 대장에 밝힌다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-claim_screen
    level: 기록만
- id: Q1-024
  title: 언론 기사에만 있는 값은 지움
  rule: 1차 자료는 기관·기업이 직접 낸 원문이며(보도자료 전문 재게재본 포함), 언론 기사에만 있는 값은 1차 자료로 바꾸거나 지운다. 본문에 「보도 기준」 표기를 남기지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-025
  title: 초록만으로 대조한 값
  rule: 초록에 값이 그대로 있으면 인정하고 근거 상자에 「초록 확인」이라 적으며, 초록에 없으면 원문 미확인으로 보아 지운다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-028
  title: 값에는 산출 근거(계산·인용·가정)를 붙임
  rule: 값에는 어떻게 얻었는지를 본문과 구분해 붙인다 — 계산값은 수식(계산 차례·단위 환산·반올림), 인용값은 근거(출처·기준 연도·대상·분모·방법), 정한 값은 가정(값과 까닭).
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-029
  title: 상자에는 확인한 것만
  rule: 상자에는 확인한 것만 쓴다. 확인 못 한 분모·연도는 「○○」로 두지 않고 빼며, 출처와 어긋난 값은 고치고 검산이 어긋나면 출처 정의를 확인하거나 계산값을 수식 상자로 보이고 본문 값을 뺀다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-claim_screen
    level: 기록만
- id: Q1-030
  title: 원문 대조는 반드시
  rule: 근거 상자는 원문(보고서·논문·통계·법령 또는 출판사·DOI·기관 저장소 공식 사본)을 열어 확인한 값에만 달고 KeyRef 요약·2차 기사·검색 요약만으로 달지 않는다. 막히면 DOI·출판사·PMC·저장소·웹 보관본·저자 사본을 차례로 찾고, 끝내 못 열면 Q1-031 을 따른다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-claim_screen
    level: 기록만
- id: Q1-031
  title: 원문 미확인 남기는 값은 「작업 가정」
  rule: 원문을 확인하지 못했지만 남기는 값은 시리즈가 판단·계산을 위해 정한 값으로 쓰고(「~로 둔다」), 첫 등장에 가정 상자(값·단위, 까닭, 미확인 사실과 찾은 범위, 바뀌면 달라지는 것, 바꾸는 절차)를 둔다. 인용 번호는 뒷받침 출처로 달지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-claim_screen
    level: 기록만
- id: Q1-032
  title: 가정이 판단 기준에 들면 표에도 표시
  rule: 가정이 표준표·규칙·임계값에 들어가면 그 표·규칙에도 「작업 가정」 표시를 달고, 까닭을 하나도 댈 수 없는 값은 지운다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-033
  title: 작업 가정은 판단·계산 값만
  rule: 작업 가정은 판단·계산에 쓰는 값만 둔다. 원문을 못 연 남의 연구·실험·통계 결과값은 가정으로 돌리지 않고 지우며 그 칸은 확인한 다른 값으로 채우거나 비운다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-034
  title: 건강하지 않은 출처의 값은 지움
  rule: 주제가 다른 자료, 원 연구를 밝히지 않은 2차 수치, 실체를 확인할 수 없는 출처, 원문과 다른 뜻으로 옮긴 출처에만 기댄 값·주장·그림은 지운다(건강한 다른 출처가 있으면 옮김). 끊긴 KeyRef 는 _pruned_keyref/ 로, 까닭은 대장에 남기고 작업 가정으로 돌리지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-claim_screen
    level: 기록만
- id: Q1-035
  title: 별첨 도구 값은 본문 근거만
  rule: 도구의 값과 항목은 본문에 근거가 있는 것만 쓰고 별첨에서 새 값을 만들지 않으며, 근거 값이 없는 칸은 「현장 기입」으로 비우고 「본문 보강 필요」로 넘긴다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-036
  title: 내부 작업 파일을 인용하지 않음
  rule: 시리즈 기획·레지스트리·목차·다른 편 작업 파일을 참고문헌으로 인용하지 않는다. 고칠 때 KeyRef 는 _pruned_keyref/ 로 옮기고 인용 표시만 지우며 문장은 남긴다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 일부
  enforce:
  - gate: V68
    level: 막음
- id: Q1-037
  title: 지은이 자리표시 금지, 서지는 원문대로
  rule: 지은이 자리표시(「et al.」만·지어낸 지은이·「Various」·빈칸)를 쓰지 않고 원문(DOI·출판사·Crossref)에서 지은이 전원과 실제 학술지·출판사를 확인해 참고문헌 양식(tok.ref.style)대로 적는다. 자리표시가 있던 항목은 다른 서지 값도 원문으로 대조한다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 일부
  enforce:
  - gate: V68
    level: 막음
- id: Q1-039
  title: 다시 쓰기에서 새 사실·새 수치 금지
  rule: 원고를 다시 짜거나 다듬을 때(3층 원고·표현 다듬기·검토 반영) 새 사실·새 수치를 넣지 않고 앞 판과 같은 값·REF 로만 엮는다. 바뀐 절의 목표·결론은 다시 쓴다.
  core: &id002
  - 품질
  area: Q1
  layer: 본체
  status: 일부
  enforce:
  - gate: REV-check_expert_sugg
    level: 막음
- id: Q1-040
  title: 국내 근거가 없으면 국외 값을 밝혀 씀
  rule: 국내 근거가 없는 값은 출처가 확인된 국외 값을 쓰고 그 사실을 그 자리에 밝힌다. 가정한 값은 가정이라 밝히고 근거를 달며, 지어내거나 자리표시를 두지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 대기
  enforce: []
- id: Q1-047
  title: 이미지는 라이선스 대장에 행이 있어야
  rule: 모든 이미지는 라이선스 대장에 행이 있어야 하며, 새 이미지는 자체 제작 SVG 를 기본으로 허용 라이선스 유형(값 tok.license.kogl_types)만 쓴다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V7
    level: 막음
  edition: 플러그인 판 문구
- id: Q1-049
  title: 연계 문장은 원문장의 내용을 옮겨 담음
  rule: 도표를 번호로 부르는 연계 문장을 쓸 때 앞 문장을 갈아 끼우지 말고 원문장의 내용을 옮겨 담는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q1-050
  title: 제사는 출처가 확인되는 글만
  rule: 명언은 지은이가 잘못 붙은 것이 많으므로 원전(책·연설·편지, 연도, 쪽)을 확인해 대장에 남기고 확인 못 한 글은 쓰지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 일부
  enforce: []
- id: Q1-051
  title: 제사의 저작권과 번역자 표시
  rule: 제사는 지은이 사후 공유 저작물(tok.copyright.public_domain_years)을 먼저 쓰고 현대 저자의 짧은 인용은 출판 단계에서 허락을 본다. 기존 번역본은 번역자를 밝히고 직접 옮기면 「(엮은이 옮김)」.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 일부
  enforce: []
- id: Q1-053
  title: 덱의 숫자·이름은 원고에 있는 것만
  rule: 덱(화면·도판 데이터·손 SVG)의 수치·단위·고유명은 원고에 글자로 있는 것만 옮기고, 새 숫자를 계산해 만들거나 원고에 없는 주장·평가어를 더하지 않는다. 대조에서 못 찾은 숫자는 0 이거나 사유를 적는다.
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-fignums
    level: 막음
  - gate: DECK-numcheck
    level: 경고
- id: Q1-053b
  title: 덱 도표와 차례는 원고를 따름
  rule: 덱 도표는 원고(웹북 차트·mermaid)의 것을 먼저 다시 쓰고, 목차 순서는 원고와 1:1 로 맞추며, 싣지 않는 도표는 excluded_figures 에 까닭을 적는다.
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-units
    level: 막음
- id: Q1-055
  title: 덱 수치에는 조건을 함께 — 정밀함을 깎지 않음
  rule: 덱의 수치에는 단위·기준 연도·대상·조건(표본·근거 등급·비교 가능성)을 함께 싣고, 원고의 한정어(약·최대·이상·국내 검증 필요)와 주의 문장을 지우거나 줄이지 않으며, 읽는 데 필요한 주석(단위·기준·범례·계산식)을 단다.
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-fignums
    level: 막음
- id: Q1-057
  title: 근거 상자는 원고에서 끌어오고 덱에서 새로 셈하지 않는다
  rule: 발표자 노트에는 원고의 수식·근거·가정 상자 내용을 그대로 옮기고, 덱에서 새로 셈하거나 출처를 만들지 않는다(빠졌으면 원고 확인 사항으로 넘김).
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-fignums
    level: 막음
- id: Q1-059
  title: 교육 장치 장만 새로 허용, 문장은 원고에서
  rule: 교육용 덱에서 전체본에 없는 장은 교육 장치(과정 안내·학습목표·여는 질문·용어·사례·확인 문항·정리·더 읽기)만 허용하고, 모든 문장은 원고 문장·근거 항에서 온다. 확인 문항 basis·용어 def 는 원고에 글자 그대로 있어야 한다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-edu-E3
    level: 막음
  - gate: DECK-edu-E4
    level: 막음
- id: Q1-062
  title: 노트에 덱 장 번호를 쓰지 않는다
  rule: 노트에 「9-05」 같은 덱 장 번호를 쓰지 않는다 — 수치 대조가 숫자로 잡는다. 노트에는 원고 위치 「원고 x.y.z · 표 x.y-z」를 쓴다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-numcheck
    level: 경고
- id: Q1-063
  title: 원고에서 지워진 값은 덱에서도 지운다
  rule: 원고에서 값이 지워지면 덱에서도 지우고 다른 값으로 바꿔치지 않으며, 메시지가 그 값에 기대던 장은 헤드라인·결론 띠·도판을 다시 짠다.
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-fignums
    level: 막음
- id: Q1-065
  title: 수치 대조는 붙은 꼴로 통과시키지 않는다
  rule: 수치 대조는 원고의 공백을 지우지 않고(천 단위 쉼표만 걷음) 숫자로 끝나는 말 바로 뒤 숫자도 찾되 붙은 꼴(「0.595」)로는 통과시키지 않는다. 「12 %」와 「12%」는 같은 값이다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-fignums
    level: 막음
- id: Q1-068
  title: 모든 본문 슬라이드 아래 원고 위치(전역 기본)
  rule: 모든 본문 슬라이드 아래에 원고 위치(출처 줄)를 적는다(전역 기본).
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 일부
  enforce: []
- id: Q1-069
  title: 확정되지 않은 수치는 badge 로 표시
  rule: 확정되지 않은 수치는 badge:(예 「비용 보류」)로 표시한다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q1-070
  title: 숨김 장·노트는 numcheck 대상에서 뺀다
  rule: '발표자 노트(notes:)와 숨김 장(hidden: true), 다른 검사가 원고와 대조하는 장(numcheck_skip_types)은 numcheck 대상에서 뺀다.'
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-numcheck
    level: 경고
- id: Q1-072
  title: 그림의 비례는 원고 수치에 맞춘다
  rule: 그림 면적·폭·길이가 원고 예시와 다르면 원고의 우선순위가 그림에서 뒤집히므로 원고 수치에 비례를 맞춘다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q1-074
  title: 표지·인쇄본에 싣는 글은 원고 원문 그대로
  rule: 표지·앞붙이·뒷붙이·간지에 싣는 글은 원고·편 웹북 원문을 글자 그대로 쓰고, 여러 절을 섞거나 정본이 없는 글(부 개요 등)을 지어내지 않는다.
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q1-074b
  title: 웹 전용 문구는 인쇄 처리에서만 바꿈
  rule: 웹 전용 문구(클릭·내려받기·검색)는 원고·웹북을 고치지 않고 인쇄 처리(build_pdf)에서 화면 동사만 바꾼다.
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q1-077
  title: 점검 주체의 한계를 문서에 밝힌다
  rule: 점검은 모두 Claude 작업자가 하며, 실제 전문가·현장 검증은 발간 뒤 과제로 「이 문서의 한계」 항에 밝힌다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q1-076
  title: 원고가 바뀌면 틀리는 제작 통계를 싣지 않는다
  rule: 뒷표지의 통계 칸(장 수·별첨·쪽·완료)처럼 독자에게 쓸모없고 원고가 바뀔 때마다 틀리는 제작 기록은 싣지 않는다.
  core:
  - 품질
  area: Q2
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q2-002
  title: 뺀 자리는 구체 내용으로 채움
  rule: 관계 문장을 뺀 자리는 비워 두지 말고 내용으로 채운다(「앞의 결정이 뒤를 제약한다」에서 멈추지 말고 구체 조건과 결과까지).
  core:
  - 품질
  area: Q2
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q2-009
  title: 별첨의 필요성 판정
  rule: 별첨마다 「누가, 언제, 무엇을 하려고 펼치는가」를 한 줄로 댈 수 있어야 하며, 댈 수 없으면 두지 않고 남기는 별첨은 머리 첫 문장에 그 쓰임을 적는다.
  core:
  - 품질
  area: Q2
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q2-012
  title: 점검 항목은 섬세하게
  rule: 한 줄에 한 가지만 묻고, 충족 기준은 「○」로 적을 조건을 문장(값이 있으면 값)으로, 확인 방법은 무엇을 보고 확인하는지로, 근거는 본문 절·표와 REF 로 쓴다. 본문이 확인하지 못한 값은 확인 방법과 「이월」로 다룬다.
  core:
  - 품질
  area: Q2
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V65
    level: 막음
- id: Q2-016
  title: 설명은 그 자리에서 완결
  rule: 설명이 필요한 자리는 그 자리에서 완결하며 다른 편·다른 절 안내는 덧붙임이지 설명을 대신하지 않는다.
  core:
  - 품질
  area: Q2
  layer: 본체
  status: 대기
  enforce: []
  edition: 플러그인 판 문구
- id: Q3-002
  title: 확정 용어·정식 명칭은 바꾸지 않음
  rule: 프로젝트 설정이 정한 확정 용어, 정식 명칭·식별자·인용 원문은 흔한 말로 바꾸지 않는다. 「자리」·「몫」처럼 평범한 쓰임이 많은 말은 사람이 문맥으로 본다.
  core:
  - 일관성
  - 쉬운 말
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce: []
  edition: 플러그인 판 문구
- id: Q3-003
  title: 정식 이름은 지키고 첫 등장에 풀이
  rule: 여러 편·여러 문서가 같이 쓰는 정식 이름은 편마다 바꾸지 않고, 처음 나오는 곳에서 한 문장으로 푼다(단위 값 tok.first_use_unit).
  core:
  - 일관성
  - 쉬운 말
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce: []
  edition: 플러그인 판 문구
- id: Q3-004
  title: 표제를 바꾸면 부르는 곳도 바꿈
  rule: 표제를 바꾸면 차례 파일·렌더 설정의 장 제목·본문의 「…」 항 참조·장 구성 표를 함께 바꾼다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V2
    level: 막음
  edition: 플러그인 판 문구
- id: Q3-005
  title: 구조 변경 뒤 번호·수 전수 확인
  rule: 구조를 바꾼 뒤에는 남은 부·장 번호, 「다섯 행」 같은 수, 옛 장 번호를 단 표를 전수 확인한다. 수식에 역참조가 박혀 있으면 치환 사고다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V2
    level: 막음
  - gate: V37
    level: 막음
- id: Q3-008
  title: 어려운 용어는 웹북 각주로 풀이
  rule: 정본은 공통 용어집 한 벌이고 카드 본문에 쓰지 않는다. 웹북이 각 절 첫 등장에 번호를 달아 풀이를 띄우고 쪽 끝 「용어 풀이」로 모으며, 제목·표·그림·요약·결론·인용·수식에는 달지 않고 절당 값 tok.footnote_terms_per_section 까지, 풀이는 출처가 뒷받침한다.
  core:
  - 쉬운 말
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V61
    level: 막음
  edition: 플러그인 판 문구
- id: Q3-009
  title: 약어는 장마다 첫 등장에 한 번 풀이(원고·덱)
  rule: '독자는 장 단위로 읽으므로 약어는 장마다 처음 나오는 곳에서 한 번 풀고 그 뒤로는 약어만 쓴다. 덱은 장 안 첫 등장 화면에 풀이를 두고 노트 첫 줄에 「약어: …」를 둔다.'
  core:
  - 일관성
  - 쉬운 말
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V64
    level: 막음
  - gate: DECK-quality-Q5
    level: 막음
- id: Q3-010
  title: 약어 풀이에 영문 원어까지
  rule: '꼴은 「한글 풀이(약어, 영문 원어)」 한 번, 「주:」 줄은 「주: SOP(Standard Operating Procedure): 표준 운영 절차.」이다. 원어는 낱말 첫 글자 대문자(기관·표준은 공식 표기), 원천은 문서 약어표 → 영문 원어 사전, 고유 이름(제품·규격 이름 등)에는 원어를 달지 않으며 원어는 문장 길이에 세지 않는다.'
  core:
  - 일관성
  - 쉬운 말
  area: Q3
  layer: 본체
  status: 일부
  enforce:
  - gate: V64
    level: 막음
  - gate: V27
    level: 막음
  - gate: V18
    level: 막음
  edition: 플러그인 판 문구
- id: Q3-011
  title: 표·괄호 속 약어는 「주:」 줄로
  rule: '표 안 첫 등장 약어와 괄호 속 나열 약어는 풀이를 겹쳐 넣지 않고 표나 문단 바로 아래 「주: 약어: 풀이 · 약어: 풀이.」 한 줄로 푼다(줄표 없이).'
  core:
  - 일관성
  - 쉬운 말
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V64
    level: 막음
  - gate: V28
    level: 막음
- id: Q3-012
  title: 풀지 않는 약어, 마우스 올림 풀이 없음
  rule: 서지(학술지·출판사·보고서 번호·DOI), 출처 표기 괄호, 편 영문 이름, 표준 번호의 일부(ISO 11783)는 풀지 않는다. 웹북·덱에 마우스 올림 풀이는 두지 않는다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q3-013
  title: 편마다 뜻이 다른 약어는 편 약어표
  rule: 같은 약어가 편마다 다른 뜻이면(GAP·SI·CAP) 그 편 약어표 풀이를 따르고 시리즈 공통 사전으로 일괄 풀지 않는다. 기계로 못 짝짓는 풀이는 수동 짝 목록에 적는다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce: []
  edition: 플러그인 판 문구
- id: Q3-015
  title: 어려운 전문 용어도 장 첫 등장에 풀이·원어
  rule: 약어뿐 아니라 어려운 전문 용어도 장마다 첫 등장에 우리말 풀이와 원어를 단다(광 차단(light interception)). 지표 약어(POD·FAR·CSI·HSS)를 풀이 없이 나열하지 않는다.
  core:
  - 쉬운 말
  - 일관성
  area: Q3
  layer: 본체
  status: 대기
  enforce: []
- id: Q3-019
  title: 판정 기호 여섯과 적는 규율
  rule: 판정 기호는 ○ / △ / ✕ / 해당 없음 / 이월(확인할 곳·때가 정해진 미확인) / 빈칸(미확인)의 여섯이다. 기호만 적지 않고 근거 한 줄, △ 를 ○ 로 올리지 않음, 해당 없음과 빈칸을 섞지 않음, 이월의 기한, 한 장의 단위를 사용법에 둔다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q3-023
  title: 한 표기에 두 뜻을 두지 않음
  rule: 한 표기(낱말·약어·기호)에 두 뜻을 두지 않고 「문맥으로 구분한다」는 문장도 쓰지 않는다. 두 뜻이 보이면 한쪽 이름을 바꾼다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 일부
  enforce:
  - gate: V70
    level: 막음
- id: Q3-025
  title: 외부 표준 이름은 그 이름과 함께
  rule: 외부 표준의 고유 이름(SMAP L3, GNSS L1 대역, SAE 기준 3단계, LCIM 수준)은 바꾸지 않되 늘 그 이름과 함께 쓴다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 일부
  enforce:
  - gate: V70
    level: 막음
- id: Q3-026
  title: 외부 과제 이름은 낫표로 원형대로
  rule: 외부 과제·사업의 고유 이름은 낫표로 원형대로 적는다(「레벨 4 자율주행 기술 개발」) — V70 은 이것을 식별자 검사에서 뺀다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 일부
  enforce:
  - gate: V70
    level: 막음
  edition: 플러그인 판 문구
- id: Q3-028
  title: 한 뜻에는 한 말 — 같은 것을 여러 이름으로 부르지 않음
  rule: 같은 뜻은 문서 안팎·표제·표·그림 어디서나 한 낱말로 부르고, 문맥에 따라 다른 말로 갈라 쓰지 않는다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 일부
  enforce:
  - gate: V5
    level: 막음
  - gate: REV-series_metrics
    level: 기록만
- id: Q3-057
  title: 「아니요」로 씀
  rule: 결정 트리의 갈림·판정 칸·진단 물음의 대답말은 표준어 「아니요」로 쓴다(「아니오」 아님).
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 일부
  enforce: []
- id: Q3-067
  title: 번호 다시 매기면 참조도 함께
  rule: 표 번호를 다시 매기면 같은 카드·다른 카드의 참조 문구도 함께 고치고 grep 으로 확인한다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V2
    level: 막음
  - gate: V12
    level: 막음
- id: Q3-068
  title: 도메인 표기 통일
  rule: 핵심 표기가 엇갈리면 최초 정의부에 정본 규약 1문장을 두고 나머지를 전역 치환한 뒤 잔존 0 을 확인한다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V5
    level: 막음
- id: Q3-070
  title: 되풀이 사례는 같은 그림으로 이어 그린다
  rule: 원고가 되풀이하는 사례(포장 A 등)는 같은 장면·지도로 그려 따라가게 하고, 숫자 없는 개념 그림은 노트에 「개념도」라고 밝힌다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q3-074
  title: 약어 사전이 원고와 다르면 원고 말로 사전을 고친다
  rule: 약어 사전 풀이가 원고 약어표와 다르면 원고 말로 사전을 고친다. 서지는 그 문서의 reference_list.json 에서 가져온다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 적용됨
  enforce: []
  edition: 플러그인 판 문구
- id: Q5-035
  title: 절 번호·약호를 문장 성분으로 쓰지 않음
  rule: 「2부 G4는」·「차선 ①은」처럼 번호를 주어·목적어로 세우지 않고 대상은 이름으로 부르며 번호는 문장 끝 괄호에 한 번만 단다.
  core:
  - 쉬운 말
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-report_plain
    level: 기록만
- id: Q5-079
  title: 자주 틀리는 띄어쓰기 꼴은 목록으로 잡음
  rule: 국립국어원 기준으로 확실히 틀린 띄어쓰기 꼴은 목록에 두고 게이트로 잡으며, 목록은 코드가 아니라 설정 파일에 둔다.
  core:
  - 일관성
  - 쉬운 말
  area: Q3
  layer: 본체
  status: 대기
  enforce:
  - gate: V76
    level: 기록만
  edition: 플러그인 판 문구
- id: Q1-039b
  title: 재구성 때 설명 문단은 지우지 않고 옮김
  rule: 절을 다시 짤 때 설명 문단은 지우지 않고 옮기며, 지울 수 있는 것은 같은 내용의 되풀이뿐이다.
  core: *id002
  area: Q4
  layer: 본체
  status: 일부
  enforce:
  - gate: REV-preserve_baseline
    level: 기록만
- id: Q4-002
  title: 같은 데이터를 두 번 그리지 않음
  rule: 같은 데이터를 두 번 그리지 않는다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 알 수 없음
  enforce: []
  edition: 플러그인 판 문구
- id: Q4-004
  title: 지워도 판단이 안 바뀌는 문단은 없앰
  rule: 같은 말의 반복과 군더더기는 덜어낸다. 한 문단을 지웠을 때 독자의 판단이 달라지지 않으면 그 문단은 없어야 한다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q4-005
  title: 같은 말을 두 번 하지 않음
  rule: 한 주장은 한 자리에서만 편다. 인용구·도입 문단·표·표 해설이 같은 말을 되풀이하지 않게 하고, 정의는 한 곳에 두고 나머지는 번호로 부른다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q4-008
  title: 본문·별첨에 같은 표를 두 번 싣지 않음
  rule: 현장 도구(서식·점검표·계산표)는 별첨이 정본이고 본문은 그 도구로 무엇을 판단하는지와 근거를 설명한 뒤 안내한다. 계산 예제 풀이는 본문에 한 벌, 빈 서식은 별첨에 둔다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-dup_tables
    level: 기록만
- id: Q4-009
  title: 다루지 않는 내용은 한 문단
  rule: 범위는 무엇을 다루는가 + 다루지 않는 것의 한 문단이면 되고, 제외 근거를 항목마다 대거나 넘기는 일을 표로 만들거나 다른 편 내용을 소개하지 않는다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q4-010
  title: 장 사이 중복은 검토한 뒤 지움
  rule: 중복 대장(같은 내용 자리·남길 자리·지울 것)을 먼저 만들고 정의는 정의 자리 한 곳에 두고 나머지는 그 절을 부르는 한 구절로 줄인다. 되풀이한 문장만 지우고 그 자리만의 설명·예·값은 남기거나 옮기며, 지운 값·REF 가 남는지 대조한다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 대기
  enforce: []
- id: Q4-012
  title: 같은 계산은 한 곳에 상자
  rule: 같은 계산을 여러 절이 쓰면 한 곳에 상자를 두고 나머지는 그 절을 가리킨다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q4-016
  title: 한 도구는 한 묶음의 한 일
  rule: 한 도구는 한 독자 묶음의 한 일에 쓰며 다른 편 도구와 하는 일이 겹치면 단계를 나눠 넘긴다(예 1차 선별 도구 → 정밀 진단 도구).
  core:
  - 품질
  - 일관성
  area: Q4
  layer: 본체
  status: 전 편 완료
  enforce: []
  edition: 플러그인 판 문구
- id: Q4-020
  title: 구성 문장은 한 곳에만
  rule: 「이 문서는 N부와 결론으로 이루어진다」 같은 구성 문장은 개요 「문서의 구성」 한 곳에만 두고 일러두기에서 되풀이하지 않는다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 일부
  enforce: []
- id: Q4-021
  title: 절 안의 되풀이를 걷음
  rule: 절마다 다시 기획해(목표·핵심 질문 → 항이 답하는 차례인가 → 같은 말을 하는 문단·상자·표·그림을 하나로) 절 안의 되풀이를 걷는다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 대기
  enforce: []
- id: Q4-022
  title: 상자는 본문을 되풀이하지 않음
  rule: 상자에는 정의·주의·수식처럼 상자에만 있는 것을 담고 본문을 되풀이하지 않는다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 대기
  enforce: []
- id: Q4-023
  title: 「종합」·「정리」 소항을 두지 않음
  rule: 종합은 절 결론의 몫이므로 「종합」·「정리」 소항을 두지 않는다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 대기
  enforce:
  - gate: V78
    level: 기록만
- id: Q4-026
  title: 달라지지 않으면 한 줄, 억지로 채우지 않음
  rule: 대상에 따라 달라지지 않는 편·단계는 「대상에 따라 달라지지 않음」 한 줄로 두고 억지로 채우지 않으며, 국내 값이 없으면 없다고 밝힌다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 대기
  enforce: []
  edition: 플러그인 판 문구
- id: Q5-001
  title: 독자는 가장 낯선 사람 기준, 공식 문장으로 밝힘
  rule: 함께 읽는 독자 가운데 가장 낯선 사람이 따라올 수 있는 말과 구성으로 쓴다. 독자는 정해진 공식 문장 한 번으로 밝힌다(「이 문서는 … 을 대상으로 작성되었다」).
  core:
  - 쉬운 말
  - 품질
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q5-002
  title: 기획 언어를 본문에 두지 않음
  rule: REQ 번호, 과정1·2 같은 기획 구분, 판본명, 「본 편(코드)은」 같은 자칭, 편 코드 약칭, 저작 도구 용어(카드·SSOT·KeyRef·writer·sec4)를 본문에 두지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V3
    level: 막음
  - gate: V51
    level: 막음
  edition: 플러그인 판 문구
- id: Q5-003
  title: 한자를 쓰지 않음
  rule: 본문에 한자를 쓰지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-004
  title: 문장·문단 길이 상한
  rule: '한 문장은 값: tok.sentence_max, 한 문단은 값: tok.paragraph_max 를 넘지 않는다.'
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V27
    level: 막음
  - gate: V18
    level: 막음
- id: Q5-007
  title: 문서가 자기 이야기를 하지 않음
  rule: 「이 장은 ~에 답한다」·「다시 정의하지 않는다」·집필 규율·개정 이력·인용 건수 같은 편집 사정을 본문에 두지 않는다. 부·장 분업은 개요에 한 번만, 펼 자리를 짚는 한 줄 지시는 허용한다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V24
    level: 막음
- id: Q5-008
  title: 한 문단은 결론 하나, 앞머리에 결론
  rule: 한 문단은 결론 하나로 서며 앞머리에 결론, 뒤에 근거를 둔다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-009
  title: 자기 교정 과정을 남기지 않음
  rule: 「그런데 한 겹 더 갈라야 한다 … 정확한 결론은」 같은 자기 교정 과정은 결론만 남기고, 「곧 ~이다」·「그것이 이 장의 역할이다」로 문단을 닫지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-010
  title: 줄표는 한 문장에 한 번, 줄표로 이은 선언은 나눔
  rule: 한 문장에 줄표(—)는 한 번까지다(짝 이룬 삽입구는 한 번으로 센다). 줄표로 이은 선언·이유와 긴 삽입구는 문장을 나누거나 괄호로 내린다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V28
    level: 막음
- id: Q5-011
  title: 대구 수사를 골격으로 쓰지 않음
  rule: 「A는 ~를 묻고 B는 ~를 답한다」 같은 대구 수사를 문서의 골격으로 쓰지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-012
  title: 굵게 쓰기 밀도 상한
  rule: 굵게는 한 문단에 값 tok.bold_per_paragraph, 본문 만자당 값 tok.bold_per_10k 이하로 쓴다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V29
    level: 막음
  edition: 플러그인 판 문구
- id: Q5-013
  title: 관계가 아니라 내용을 적음
  rule: 부·편 사이의 지위·분업·역할을 설명하는 문장을 본문에 두지 않는다. 허용은 독자가 그 자리에서 펼 곳을 짚는 한 줄 지시뿐이다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V33
    level: 막음
- id: Q5-014
  title: 분열문을 쓰지 않음
  rule: 「~하는 것은 ~이다」 분열문 대신 주어를 실질명사로 세운 평서문으로 쓴다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: REV-report_style
    level: 기록만
- id: Q5-015
  title: 고유어 수사를 홀로 세우지 않음
  rule: 「셋이 들어간다」·「넷이다」 대신 「세 요소로 구성한다」·「네 가지다」로 쓰고, 자(者)로 기준·조건을 받지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: REV-report_style
    level: 기록만
- id: Q5-016
  title: 낫표는 절·표 표제를 부를 때만
  rule: 홑낫표는 이 문서의 절·표 표제를 부를 때만 쓴다. 사람의 말은 큰따옴표, 용어 지칭은 작은따옴표, 예문은 인용 블록이나 표 칸에 두며 문장을 통째로 감싸지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-017
  title: 줄표를 쓰는 자리
  rule: 줄표는 짝 이룬 삽입구와 목록 항목 머리말 뒤에만 쓴다. 정의·열거는 쌍점, 바꿔 말하기는 「곧,」·「즉,」으로 쓰고, 행 끝 줄표·주어와 서술어를 가르는 이중 줄표·캡션의 줄표는 쓰지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V28
    level: 막음
  - gate: V52
    level: 막음
- id: Q5-019
  title: 소표제는 명사형 러닝헤드, 마침표 없음
  rule: 문장을 굵게 감싸 표제를 대신하지 않는다. 문단 앞 짧은 명사형 러닝헤드는 마침표 없이 쓰고, 절 제목 바로 뒤 굵은 한 줄(절의 선언)은 문장이라 마침표를 단다.
  core: &id003
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V44
    level: 막음
- id: Q5-019b
  title: 표 머리글은 명사구, 한 표 안에서 섞지 않음
  rule: 표의 머리글은 명사구로 쓰고 한 표 안에서 명사구와 의문형을 섞지 않는다.
  core: *id003
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V63
    level: 막음
- id: Q5-020
  title: 개조식과 서술식을 가름
  rule: 절차·요건·산출물·점검 항목은 번호 목록이나 표로, 원리·근거·해석·한계는 서술 문단으로 쓴다. 서술 문단 안에 ①②③을 늘어놓지 않는다.
  core: &id004
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-020b
  title: 문장 길이 목표
  rule: '문장은 값: tok.sentence_target 을 기준으로 쓰고 값: tok.sentence_soft_max 를 넘기지 않는다.'
  core: *id004
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-021
  title: 흔한 말로 쓴다
  rule: 일반 독자에게 낯선 비유·문어투(딛고 선·걷어 내다·손에 쥐다·~의 몫이다·물음·층위·갈래 등)를 쓰지 않고 표의 쓰는 말(바탕이 되는·없애다·실제로 쓰다·~가 맡는다·질문·수준·유형 등)로 바꾼다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V35
    level: 막음
- id: Q5-022
  title: 길 안내·구성 설명 문장을 쓰지 않음
  rule: 「이 절은 먼저 A를 보고…」·「다음 절에서 …를 본다」·「이 표에서 찾을 수 있다」 같은 길 안내와 절 끝 자기 요약 문단을 본문과 목표 상자 어디에도 쓰지 않는다. 허용은 펼 자리를 짚는 한 줄 지시뿐이다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V36
    level: 막음
- id: Q5-024
  title: 발간사를 덕담으로 닫지 않음
  rule: 발간사를 「모쪼록 … 길잡이가 되기를 바란다」 같은 덕담이나 판 이력 해설로 닫지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q5-025
  title: 문서 구조를 이야기처럼 들려주지 않음
  rule: 장·부·개수를 주어로 세워 대구로 엮는 구성 설명을 쓰지 않는다. 부·장 구성은 표로 한 번 보이고 문장은 각 부가 다루는 대상을 직접 적는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q5-026
  title: 서술 순서를 알리는 말 금지
  rule: 「정의가 앞서고 판정이 뒤따르는 순서다」·「먼저 …하고, 이어 …한 뒤」를 쓰지 않는다. 순서를 바꾸면 결과가 달라지는 작업 절차·폐루프 단계·시기는 남긴다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q5-027
  title: 서수 셋 이상 나열은 번호 목록
  rule: 「첫째, … 둘째, … 셋째」를 한 문단에 잇지 않고 번호 목록으로 쓰며 항목마다 굵은 머리 + 「 — 」 + 풀이로 쓴다. 목록 끝 안내 문장은 목록 밖 문단으로.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V41
    level: 막음
- id: Q5-028
  title: 흩어진 서수 나열도 목록, 나열은 한 꼴
  rule: 문단마다 흩어진 서수 나열과 한 문단 안 쟁점 나열도 목록으로 쓰고, 같은 종류의 나열은 문서 전체에서 같은 꼴(목록이면 모두 목록, 머리말은 모두 굵게)로 한다.
  core:
  - 쉬운 말
  - 품질
  area: Q5
  layer: 본체
  status: 대기
  enforce:
  - gate: V41넓힘
    level: 기록만
  - gate: V76~V84
    level: 기록만
- id: Q5-029
  title: 일반적인 설명문으로 쓴다
  rule: 본문은 대상을 주어로 세우고 「무엇이 어떠한가 → 근거 → 독자가 볼 것」을 평서문으로 적으며 칼럼·강의·작업 메모 말투를 쓰지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V42
    level: 막음
  - gate: V43
    level: 막음
  - gate: V44
    level: 막음
  - gate: REV-report_plain
    level: 기록만
- id: Q5-030
  title: 사적 기호를 본문에 쓰지 않음
  rule: 【분기】 같은 꺾쇠 태그와 문장 속 ★·⚠ 를 쓰지 않는다. 태그는 명사형 러닝헤드나 문장으로, ⚠ 는 주의 상자나 「다만」 문장으로 풀고 표 칸 ★ 등급은 범례가 있을 때만 둔다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V42
    level: 막음
- id: Q5-031
  title: 문서를 주어로 자료 결손을 말하지 않음
  rule: 「이 문서는 국내 기준을 확보하지 못했다」가 아니라 「국내 기준은 아직 확인되지 않았다」로 쓴다. 없는 것은 근거의 상태다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V43
    level: 막음
- id: Q5-032
  title: 물음으로 소표제를 대신하지 않음
  rule: 「**왜 이 다섯인가.**」 같은 물음 볼드 소표제와 혼자 선 수사 의문을 쓰지 않고 명사형 러닝헤드나 문장으로 바꾼다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V44
    level: 막음
- id: Q5-033
  title: 집필자에게 하는 지시를 독자에게 하지 않음
  rule: 「~로 쓰면 안 된다」 같은 자기 메모 대신 독자에게는 해석의 범위로 적는다. 안전·법규의 금지는 금지로 둔다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-report_plain
    level: 기록만
- id: Q5-034
  title: 저작 과정을 해설하지 않음
  rule: 「취소선으로 남긴 것은」·「★★로 세운 이유다」처럼 문서를 어떻게 지었는지 말하지 않고 판단의 근거를 말한다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V51
    level: 막음
  - gate: REV-report_plain
    level: 기록만
- id: Q5-036
  title: 비유·과장 동사로 사실을 말하지 않음
  rule: 「시스템을 죽인다」·「무너진다」·「척추」·「지렛대」 같은 비유·과장 동사를 표의 쓰는 말로 바꾸고 근거보다 센 단정(「…하나뿐이다」)도 걷는다. 그림 안 글(마디·연결선·캡션)도 같다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 일부
  enforce:
  - gate: V77
    level: 기록만
  - gate: V84
    level: 기록만
- id: Q5-037
  title: 「A = B」 등식을 산문에 쓰지 않음
  rule: 「높은 임계 = 예민」 같은 등식 꼴을 산문에 쓰지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q5-038
  title: 볼드는 절의 선언과 짧은 러닝헤드에만
  rule: 문단 중간의 문장을 통째로 볼드로 감싸 경구처럼 세우지 않는다. 볼드는 절의 선언과 짧은 러닝헤드에만 쓴다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-report_plain
    level: 기록만
- id: Q5-039
  title: 뜻이 분명하고 읽기 쉬운 문장
  rule: 일반적이지 않은 동사·압축 표현과 앞뒤 설명 없이 결론만 압축한 문장을 풀어 쓰고, 여러 독자·자리를 한 문단에 몰아 쓴 긴 안내는 목록이나 표로 나눈다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 대기
  enforce: []
- id: Q5-040
  title: 같은 말을 두 번 잇대지 않음
  rule: 일괄 치환이 남긴 「다른 다른 연구」 같은 겹친 말을 지운다. 뜻으로 되풀이한 수사는 둔다. 도형 상자의 겹침은 V50 이 못 보니 다시 그릴 때 본다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V50
    level: 막음
  - gate: V11
    level: 막음
- id: Q5-042
  title: 문서가 자기 기여를 선언하지 않음
  rule: 「…이 이 문서의 정식화다」처럼 문서가 자기 기여를 선언하는 문장을 쓰지 않고 내용 자체를 말한다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V56
    level: 막음
- id: Q5-043
  title: 기획서·논문 말투 평가 문장 금지
  rule: 「X의 위상은 분명하다」·「공통 언어」·「병목을 푸는 계층」 같은 평가 문장을 내용 문장으로 바꾼다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q5-044
  title: 당위를 상투어로 말하지 않음
  rule: 「더 이상 미룰 수 없는 과제가 되었다」처럼 시급함만 말하는 문장 대신 무엇을 무엇으로 바꿔야 하는지 쓰고, 긴 「~가운데, ~는 과제가 되었다」는 배경과 요구 두 문장으로 나눈다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q5-045
  title: 풀이로 문장이 길어지면 「주:」로
  rule: '약어·용어 풀이를 넣어 한 문장이 값: tok.sentence_max 를 넘으면 문단 아래 「주:」로 풀고, 「주:」 한 줄이 길면 여러 줄로 나눈다.'
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V27
    level: 막음
- id: Q5-046
  title: 문서·장·절 자기 해설을 지움
  rule: 「이 절은 ~에 집중한다」·「~은 범위 밖이다」 같은 자기 해설은 지우고 범위 문장은 개요 0.2 한 곳에 둔다. 그 절만의 범위 차이(시설 전용 기술 등)는 내용이라 남긴다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V67
    level: 막음
- id: Q5-048
  title: 「답한다」는 물음에 답할 때만
  rule: 「답한다」는 앞에 물음이 있고 그 물음에 답하는 문장에만 쓰고 그 밖은 「설명한다·다룬다·대응한다」로 쓴다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 일부
  enforce: []
- id: Q5-049
  title: 「정한다」는 주어로 고름
  rule: 문서·편·장이 주어면 「다룬다·설명한다」, 사람·판단이면 「결정한다·판단한다」, 처방이면 「처방을 낸다」, 표준·정책이면 「세운다·제시한다」, 원인이면 「좌우한다」, 수동이 자연스러우면 「정해진다」로 고른다. 약속·순서·이름을 정하는 자리는 둔다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 일부
  enforce: []
- id: Q5-050
  title: 결론에서 「다룬다」 금지
  rule: 절 끝 결론에서는 「다룬다」를 쓰지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 일부
  enforce:
  - gate: V57
    level: 막음
- id: Q5-051
  title: 의인화·은유를 쓰지 않음(원고·덱)
  rule: 무생물·개념·조건을 사람처럼 움직이게 쓰지 않고, 무대·좌표·지도·문턱·관성 같은 은유와 은유적 아이콘은 뜻을 그대로 풀어 쓴다. 대상을 그대로 가리키는 형상·관용 도해와 은유에서 온 정식 용어(폐루프)는 둔다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 일부
  enforce:
  - gate: V77
    level: 기록만
  - gate: V84
    level: 기록만
  - gate: DECK-style-ussa
    level: 막음
- id: Q5-052
  title: 뜻을 설명 — 압축 결론만 두지 않음
  rule: 지시어·수사(「이 42mm」·「나머지 셋」)는 무엇인지 다시 말하고, 경구식 짝 나열은 같은 절의 예로 풀며, 표·그림을 봐야 아는 문장은 무엇을 보라는지 말하고, 「~라는 뜻이다」로 결론만 내리지 않고 왜 그런지 붙인다. 새 사실·새 수치는 쓰지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 일부
  enforce: []
- id: Q5-054
  title: 압축된 연쇄 논리와 몰아넣은 인과는 풀어 씀
  rule: 「A가 있어야 B가 생기고, B가 있어야 C…」처럼 한 문장에 원인·결과를 여럿 몰아넣지 않고 짧은 문장 여럿으로 나누며, 그림이 있으면 그림의 번호를 짚어 준다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 일부
  enforce: []
- id: Q5-055
  title: 문체는 한다체 한 꼴
  rule: 문체는 한다체 한 꼴로 통일하고 편·절마다 합니다체 예외를 두지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 일부
  enforce: []
  edition: 플러그인 판 문구
- id: Q5-056
  title: 목표 문장은 정확히 이해되게
  rule: 목표 문장은 낯선 말 없이, 이 절을 읽고 무엇을 알게 되고 그것이 왜 필요한지 밝힌다. 핵심 질문은 목표를 나눈 것이다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 대기
  enforce: []
- id: Q5-058
  title: 굵은 글씨는 세 경우만
  rule: 굵게 쓰는 것은 ① 정의되는 핵심어(정의 자리에서 한 번, 나란히 정의되는 개념은 모두) ② 목록 항목의 머리말(모두) ③ 독자가 판단에 바로 쓰는 핵심 문장(절마다 값 tok.key_sentence_bold_per_section, 결론·목표 상자 안은 제외)뿐이다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 대기
  enforce:
  - gate: V81
    level: 기록만
  - gate: V29
    level: 막음
  edition: 플러그인 판 문구
- id: Q5-059
  title: 굵게 쓰지 않는 곳
  rule: 표제, 표 칸(머리행 제외), 캡션, 숫자만, 낱말 강조를 위한 문장 중간 굵게, 한 문단에 둘 이상은 굵게 쓰지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 대기
  enforce:
  - gate: V81
    level: 기록만
  - gate: V29
    level: 막음
- id: Q5-060
  title: 문단 강조는 상자로
  rule: 문단 단위 강조가 필요하면 굵게 하지 않고 핵심·주의 상자를 쓴다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 대기
  enforce: []
- id: Q5-063
  title: 자칭은 「이 문서」
  rule: 자칭은 「이 문서」로 통일하고 「본 보고서」·「본 카드」·「본 백과」를 쓰지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V3
    level: 막음
- id: Q5-064
  title: 명사를 가운뎃점으로 이어 붙이지 않음
  rule: 「공간 불균질·대면적·기상 의존…의 다섯 조건」처럼 명사를 가운뎃점으로 이어 붙인 문장은 풀어서 쓰고 용어는 괄호에 남긴다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 일부
  enforce: []
- id: Q5-068
  title: 번역투·문어를 쓰지 않음
  rule: 「~을 가능하게 한다」·「~에 의해」·「규정하는 특성」·「양면적」·「개념화」·「논자」·「원시 데이터」 같은 번역투·문어 대신 우리말 평서문으로 쓴다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 일부
  enforce:
  - gate: REV-report_style
    level: 기록만
- id: Q5-069
  title: 따옴표로 감싼 구호·대조를 풀어 씀
  rule: 「‘지금 이 순간’이 아니라 ‘…’」처럼 따옴표로 감싼 구호·대조는 따옴표를 풀고 평서문으로 쓴다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 일부
  enforce: []
- id: Q5-075
  title: 긴 문단은 나눔
  rule: '문단 쪼개기를 먼저 하며, 값: tok.paragraph_split 을 넘는 문단은 나눈다.'
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-077
  title: 치환 뒤 조사 정합
  rule: 치환으로 들여놓은 말 뒤의 은·는, 이·가, 을·를, 로·으로, 와·과가 받침과 맞는지 기계로 보며 ㄹ 받침(숫자 1·7·8 포함)은 「로」를 쓴다. 이 판이 새로 들여놓은 말을 목록으로 둔다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V10
    level: 막음
  - gate: V58
    level: 막음
- id: Q5-086
  title: 도판 글의 경구식 대조는 확인
  rule: 도판 띠·칸 글의 「A가 아니라 B」도 확인으로 뜨며, 원고 핵심 상자를 옮긴 대비면 두고 경구로 멋을 낸 것이면 평서로 고친다(「~만이 아니라」 첨가는 제외).
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-style-ussa
    level: 경고
- id: Q6-001
  title: 표제는 대상의 이름인 명사구
  rule: 장·절·항 표제는 대상의 이름인 명사구로 쓴다. 물음꼴·「~때」 꼴·연결어미 꼴·주장 서술형·메타 표제(「들어가며」·「이 장이 답하는 것」)를 쓰지 않는다.
  core:
  - 품질
  - 일관성
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V4
    level: 막음
  - gate: V31
    level: 막음
  - gate: V39
    level: 막음
- id: Q6-001b
  title: 표제에 장식을 붙이지 않음
  rule: 표제에 숫자 접두·개수(「세 가지 축」·「여덟 항목」)·은유(사다리·골격 등)·수식·임의 [ ] 라벨·추상 대구를 쓰지 않는다.
  core:
  - 쉬운 말
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V4
    level: 막음
- id: Q6-004
  title: 앞부분·별첨에는 목표 상자와 결론을 두지 않음
  rule: 앞부분(개요)과 별첨에는 「이 절의 목표」 상자(옛 요약 상자)와 절 결론을 두지 않는다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V21
    level: 막음
- id: Q6-006
  title: 절은 정의 → 설명 → 사례
  rule: 절의 본문(「이 절의 목표」 상자 뒤)은 정의·선언 → 설명(근거와 조건) → 사례(수치·조건값·판정 결과)로 쓴다. 정의는 예고가 아니라 대상이 무엇이고 무엇으로 판정하는지이며, 「왜 필요한가」를 먼저 설득하지 않는다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V32
    level: 막음
- id: Q6-007
  title: 표제 길이와 부제
  rule: '표제는 짧을수록 좋다. 줄표 부제 없이 공백 제외 값: tok.heading_max_chars 이하로 쓴다.'
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V31
    level: 막음
- id: Q6-008
  title: 설명에 별도 절을 주지 않음
  rule: 「왜 필요한가」·「이 장의 지위」는 절이 아니라 문장이다. 개요 절에 부 사이 분업·읽는 순서를 절로 두지 않되, 제 대상을 가진 하위 절은 둔다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V26
    level: 막음
- id: Q6-009
  title: 항과 표 앞은 결론 문장부터
  rule: 항의 첫 문장은 그 항의 결론이고, 표를 놓을 때도 표 앞에 한 문장을 세운다. 배경·필요성·연혁으로 열지 않는다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q6-010
  title: 길 안내만 하던 항은 앞 항에 합침
  rule: 「다음 절로」·「정리」처럼 길 안내만 하던 항은 내용이 빠지면 앞 항에 합친다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q6-011
  title: 장은 독자가 묻는 차례로
  rule: 장 이름과 순서는 독자의 질문을 따르고 설계 차례(정의 → 형식 → 연결 → 명세)를 따르지 않는다. 설명은 현장에서 벌어지는 일에서 시작해 관행과 견주고 규칙은 그 뒤에 둔다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q6-015
  title: 절과 항이 같은 표제를 갖지 않음
  rule: 절과 그 바로 아래 항이 같은 표제를 갖지 않는다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V39
    level: 막음
- id: Q6-016
  title: 장 이름이 그 안의 절을 모두 덮음
  rule: 장 이름은 그 안의 절을 모두 덮어야 하며, 덮지 못하는 절은 맞는 장으로 옮기고 장마다 절 수를 고르게 한다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q6-017
  title: 표제는 흔히 쓰는 말로
  rule: 표제에 시리즈 안에서만 통하는 말(「이웃 편」)이나 낯선 조어를 쓰지 않고 흔히 쓰는 말로 짓는다.
  core:
  - 쉬운 말
  area: Q6
  layer: 본체
  status: 대기
  enforce: []
- id: Q6-019
  title: 앞부분은 번호 없이
  rule: 앞부분(개요)에 「0.1」·「표 0.2-1」 같은 번호를 쓰지 않고 본문이 앞부분을 번호로 부르지 않는다. 앞부분 표는 번호 없는 제목을 달고, 앞부분을 가리켜야 하면 그 자리에서 내용을 한 문장으로 말한다.
  core:
  - 일관성
  - 품질
  area: Q6
  layer: 본체
  status: 일부
  enforce:
  - gate: V55
    level: 막음
  - gate: V83
    level: 기록만
- id: Q6-021
  title: 앞부분에 쓰지 않는 것
  rule: 산출 형태와 찾기 도구, 시각자료 규약, 판본·문서 성격 설명, 항목 식별자 체계 해설, 다른 자리를 가리키기만 하는 안내 문장을 앞부분에 쓰지 않는다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V54
    level: 막음
  - gate: V60
    level: 막음
- id: Q6-022
  title: 저작권은 앞부분 한 곳
  rule: 저작권은 앞부분 한 곳(발간사의 이용 안내)에만 쓴다.
  core:
  - 일관성
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V60
    level: 막음
- id: Q6-023
  title: 별첨 문자는 건너뛰지 않음
  rule: 별첨 문자는 A 부터 건너뛰지 않고 이어 매기며, 바꿀 때 호출·표 번호·폴더를 함께 고치고 건너뛴 까닭을 설명하지 않는다.
  core:
  - 일관성
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V59
    level: 막음
- id: Q6-026
  title: 결론은 내용 작업이 끝난 뒤 마지막에 씀
  rule: 절 결론은 그 절의 내용을 고치는 작업이 끝난 뒤 마지막에 쓴다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q6-028
  title: 약어표에 두 번 이상 나오는 약어를 모두
  rule: 뒷붙이 「용어와 약어」 표에는 본문에 두 번 이상 나오는 약어를 모두 싣는다.
  core:
  - 일관성
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q6-029
  title: 별첨은 본문 흐름을 끊는 현장 도구만
  rule: 별첨에는 현장에서 손에 쥐고 쓰지만 본문에 넣으면 흐름을 끊는 실용 도구(점검표·기록 서식·빈 계산표·판정표·찾아보기 목록)만 둔다. 도구의 정본은 별첨이고 본문은 판단과 근거를 설명한 뒤 안내한다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q6-030
  title: 별첨 수에 목표를 두지 않음
  rule: 별첨은 도구가 있는 편만 두고, 별첨 수에 목표를 두거나 편마다 같은 별첨을 갖추지 않는다. 일관성은 같은 별첨을 두는 것이 아니라 같은 기준으로 고르는 것이다.
  core:
  - 품질
  - 일관성
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q6-033
  title: 별첨 카드의 짜임
  rule: 별첨 카드는 쓰임과 대상(누가·언제·무엇을, 내려받기, 앞뒤 도구, 머리 기입란, 준비물) → 서식 구성과 판정 기호 → 점검 항목(영역마다 안내 문장이 표를 부름) → 결과 읽기와 다음 단계(작성 예 한 벌) 차례로 짠다.
  core:
  - 품질
  - 일관성
  area: Q6
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V65
    level: 막음
- id: Q6-037
  title: 번호 체계
  rule: 「제N장」은 책 전체에서 이어지고, 절은 「장.절」(덧번호 없음), 항은 절 안 「1.」, 표·그림은 「표 장.절-n」(절 번호를 물려받음), 별첨은 「표 A-n」이며 카드 분할 ID 를 쓰지 않는다. 앞부분은 번호가 없고 본문 소제목은 절보다 아래 층위다.
  core:
  - 일관성
  - 품질
  area: Q6
  layer: 본체
  status: 일부
  enforce:
  - gate: V12
    level: 막음
  - gate: V72
    level: 막음
  - gate: V79
    level: 기록만
- id: Q6-040
  title: 항 「1.」, 소항 「1)」
  rule: 절 안 항 번호는 「1.」, 그 아래 소항은 「1)」로 매긴다. 「2.1」 꼴은 절 번호로 읽히므로 쓰지 않는다.
  core:
  - 일관성
  area: Q6
  layer: 본체
  status: 일부
  enforce:
  - gate: V78
    level: 기록만
- id: Q6-042
  title: 절 제목의 핵심어를 그 말로 정의
  rule: 제목이 「A와 B」를 약속하면 본문은 첫 항에서 「A는 …이다」, 이어 「B는 …이다」를 그 말 그대로 쓰고, A·B 가 왜 짝인지 잇는 문장을 둔다.
  core:
  - 품질
  - 일관성
  area: Q6
  layer: 본체
  status: 일부
  enforce: []
- id: Q6-043
  title: 절의 목표와 핵심 질문을 2층에서 정함
  rule: 절마다 2층 절 설계에서 목표(독자가 무엇을 알고 판단·실행하게 되는가)와 핵심 질문(항과 짝인 하위 물음)을 정한다. 목표를 한 문장으로 말할 수 없으면 그 절은 아직 서 있지 않다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 일부
  enforce: []
- id: Q6-050
  title: 결론은 핵심 질문에 차례로 답함
  rule: 결론은 핵심 질문의 차례대로 질문마다 단정적인 답을 한 항목 이상 두어, 결론만 읽어도 목표가 이뤄지게 한다. 문제의 재진술·곁가지만의 항목·「다룬다」를 쓰지 않는다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 일부
  enforce:
  - gate: V57
    level: 막음
- id: Q6-053
  title: 항은 핵심 질문 차례로 다시 짬
  rule: 질문 하나에 항 하나가 기본이며, 항의 순서를 바꾸고 합치거나 나누고 문단을 맞는 항으로 옮기며 항 제목을 답하는 것의 이름으로 고친다. 질문에 답하지 않는 문단은 맞는 절로 옮긴다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 일부
  enforce: []
- id: Q6-056
  title: 항 안 소항은 같은 층위·같은 갈래
  rule: 한 항 아래 소항 1)·2)…는 같은 갈래(경로들, 실증들)여야 하고, 원리·실증·규제·국내 동향처럼 갈래가 다르면 항을 나누거나 갈래별로 묶는다.
  core:
  - 품질
  - 일관성
  area: Q6
  layer: 본체
  status: 대기
  enforce:
  - gate: V78
    level: 기록만
- id: Q6-057
  title: 소항이 많으면 묶을 갈래를 찾음
  rule: '한 항의 소항이 값: tok.subitems_soft_max 를 넘으면 묶을 갈래가 있는지 본다.'
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 대기
  enforce:
  - gate: V78
    level: 기록만
- id: Q6-068
  title: 별첨 하나가 절 하나면 표제를 겹치지 않음
  rule: 별첨 하나가 절 하나뿐이면 별첨 표제와 절 표제를 겹쳐 달지 않는다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 일부
  enforce: []
- id: Q6-074
  title: 가독성 보강은 재배치이지 증량이 아님
  rule: 가독성 보강은 산문에 묻힌 구조를 꺼내 알맞은 형식으로 옮기는 것이며 새 내용을 짓지 않는다. 분량 증가는 목표가 아니다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q6-079
  title: 덱은 한 장 한 개념
  rule: 덱 한 장에는 개념 하나만 담고 본문은 그 개념을 보이는 시각화 하나로 한다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q6-080
  title: 덱에 계산 실습·워크시트 장을 넣지 않음
  rule: 전체본·교육용 모두 계산 실습·워크시트 장을 넣지 않는다. 교육용 교육 장치는 원고 문장·근거 항으로만 채운다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-edu-E5
    level: 막음
- id: Q6-081
  title: 덱은 원고 본문만 싣는다
  rule: 발표자료(전체본·교육용)는 원고 본문(부 아래 장·절·항)만 싣고 개요·별첨·부록은 싣지 않는다. 표지·덱 차례·간지·맺음 같은 덱 구조 장은 두되 내용을 개요에서 가져오지 않는다.
  core:
  - 품질
  - 일관성
  area: Q6
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-units
    level: 막음
- id: Q6-083
  title: 절 결론은 덱에서 장 대신 노트로
  rule: '원고 절 끝 결론 항은 덱 장을 만들지 않고 그 절 마지막 내용 장의 노트 끝에 「절 결론(원고 x.y.z): …」로 옮기며, 결론 띠가 어긋나면 원고 결론에 맞춘다.'
  core:
  - 일관성
  - 품질
  area: Q6
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-units
    level: 막음
- id: Q6-084
  title: 덱 명세 item 은 항 식별자로 시작
  rule: 덱 명세(spec)의 item 은 「1.2.3 제목」처럼 항 식별자로 시작한다(항 없는 절은 「1.2 제목」) — 원고 항과 덱 장을 잇는 열쇠다.
  core:
  - 일관성
  area: Q6
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-units
    level: 막음
- id: Q6-090
  title: 인쇄본 면 차례
  rule: 인쇄본은 앞표지 → 반표제지 → 시리즈면 → 속표지 → 판권면 → 추천사 → 발간사 → 이 책에 대하여 → 일러두기 → 차례 → 본문(부 간지·장 간지·절) → 별첨 → 용어와 약어 → 참고문헌 → 찾아보기 → 지은이·감수 소개 → 뒷표지 차례로 엮는다.
  core:
  - 일관성
  - 품질
  area: Q6
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-pdf-covers
    level: 경고
- id: Q6-091
  title: 인쇄본에서 앞붙이·뒷붙이는 부가 아님
  rule: 인쇄본은 발간사·일러두기를 「개요」 부로 넣어 부 간지를 세우지 않고, 용어와 약어·참고문헌을 「부록」 부로 묶지 않는다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q6-092
  title: 그림·표 목록은 넣지 않음
  rule: 도표가 많은 편은 목록이 수십 쪽이 되므로 인쇄본에 그림·표 목록을 넣지 않고 절까지 있는 차례로 찾아가게 한다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q6-093
  title: 판권면과 「이 책에 대하여」
  rule: 판권면은 속표지 뒷면에 둔다. 개요의 문서의 목적과 범위·문서의 구조와 읽는 법은 인쇄본에서 「이 책에 대하여」 한 면으로 묶고 번호 없이 표제만 둔다. 표지 뒤 판권·차례 쪽 번호·북마크·앞부분 쪽 번호는 PDF 를 만들 때 정한다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q6-094
  title: 용어와 약어는 1단 표
  rule: 인쇄본의 용어와 약어는 원고 표 그대로 1단 삼선표로 둔다.
  core:
  - 품질
  area: Q6
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q5-079b
  title: 그림 안 글 길이 상한
  rule: mermaid 마디·연결선 글은 값 tok.fig_node_text_max, 그래프 축 이름·눈금 글은 값 tok.chart_axis_text_max 를 넘지 않게 쓰고 임계는 설정 파일에 둔다.
  core:
  - 쉬운 말
  - 품질
  area: Q7
  layer: 본체
  status: 대기
  enforce:
  - gate: V80
    level: 기록만
  edition: 플러그인 판 문구
- id: Q7-001
  title: 캡션은 제목만 — 짧은 명사구 하나
  rule: '표·그림 캡션은 간결한 명사구 하나로 값: tok.caption_max_chars 이하로 쓴다. 서술형·연결어미 종결·물음·설명·줄표 덧붙임·셋 이상 나열·개수·출처 표기를 쓰지 않는다.'
  core:
  - 품질
  - 일관성
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V17
    level: 막음
  - gate: V52
    level: 막음
- id: Q7-005
  title: 저작 문법을 독자에게 설명하지 않음
  rule: 「선언이 flowchart TD라」·「P1→P2」처럼 독자에게 보이지 않는 소스를 설명하지 않는다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-006
  title: 본문이 도표를 번호로 부름
  rule: 모든 도표는 본문이 번호로 부른다. 없는 문장을 짓기보다 있는 문장이 부르게 한다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V6
    level: 막음
- id: Q7-008
  title: 표의 줄을 이름으로 부름·행 나열 서두 허용
  rule: 표의 줄을 번호로 세지 말고 그 줄의 이름을 불러라(「「언제 드러나나」 줄이 ~이다」). 판독이 따라붙는 행 나열 서두는 위반이 아니다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q7-009
  title: 핵심은 표·그림, 곁가지는 산문
  rule: 판정 기준·값·산출물·비교·분기는 표·그림에, 근거·배경·주의는 산문·목록에 두어 표만 훑어도 절의 결론이 나오게 한다. 강등해 생긴 결번은 다시 매긴다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V12
    level: 막음
- id: Q7-010
  title: 캡션 번호 뒤 마침표
  rule: 캡션 정의줄은 「표 N.N-n.」처럼 번호 뒤에 마침표를 찍는다. 이 마침표는 검사기가 도표를 찾는 표지이므로 떼지 않고, 고칠 것은 캡션 글이다.
  core:
  - 일관성
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V17
    level: 막음
- id: Q7-014
  title: 그림 화살표는 작용하는 쪽에서 받는 쪽으로
  rule: 그림의 화살표는 작용하는 쪽에서 작용을 받는 쪽으로 긋는다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 일부
  enforce: []
- id: Q7-015
  title: 도형은 줄어들지 않게 그림
  rule: '도형의 원래 폭은 값: tok.diagram_max_width_px, 높이는 값: tok.diagram_max_height_px 안에 들게 그린다. 넣을 수 없는 지도·판정 나무만 줄어들 수 있고, 웹북 본문 폭에서 가로 스크롤을 두지 않는다.'
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: AT-pdf-mermaid
    level: 경고
- id: Q7-016
  title: 넘치는 도형을 다시 그리는 법
  rule: 넘치는 flowchart LR 은 TB 로 바꾸거나 subgraph 로 접고, 상자 글은 짧게(긴 설명은 아래 문단), 담을 것이 많으면 둘로 나눈다. 뜻·차례·화살표는 바꾸지 않는다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q7-018
  title: 그림이 어떻게 그려졌는지 설명하지 않음
  rule: 도표 아래 설명 문단은 필수가 아니다. 배치·상자·선을 옮겨 적는 문장은 지우고, 그림에 없는 것(뜻, 판단이 갈리는 곳, 두드러지는 값과 까닭)만 남기며 없으면 문단째 지운다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V53
    level: 막음
  - gate: V36
    level: 막음
- id: Q7-019
  title: 제목을 되풀이하는 호출 금지
  rule: 「X는 표 N과 같다」처럼 도표 제목을 되풀이하기만 하는 문장으로 부르지 않고, 내용을 말하는 문장이 괄호로 부른다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V54
    level: 막음
- id: Q7-020
  title: 표에 다른 절을 가리키는 열을 두지 않음
  rule: 「관련 절」·「규정 위치」·「다루는 장」처럼 행마다 절·장 번호만 적는 열은 지우고 호출은 본문 문장이 한다. 번호와 내용이 섞인 열은 번호만 뗀다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V62
    level: 막음
- id: Q7-021
  title: 비교 표는 비교 대상을 열로 나란히
  rule: 현재·목표, 관행·과학적 방법, 전·후처럼 견주는 표는 「영역 | 현재 | 목표 | 격차와 원인」 꼴로 각 상태를 따로 열에 세운다. 양쪽 상태는 본문 내용으로만 채우고 없으면 표를 두고 보고한다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q7-022
  title: 표 열 이름은 명사, 한 열 한 속성
  rule: 열 이름은 명사(내용·주 사용자·사용 시점·판정 기준)로 짓고 물음꼴·서술 꼴·비유를 쓰지 않는다. 한 열에는 한 속성, 같은 열의 칸은 같은 꼴로 맞추며 값·수치·출처는 바꾸지 않는다.
  core:
  - 일관성
  - 쉬운 말
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V63
    level: 막음
- id: Q7-023
  title: 점검표의 열
  rule: 점검표 열은 번호 · 영역 · (등급) · 점검 항목 · 충족 기준 · 확인 방법·증빙 · 근거 · 필수 | 판정 · 근거 한 줄 · 조치·담당·기한이다. 왼쪽은 서식에 채워져 있고 오른쪽 셋은 쓰는 사람이 채운다.
  core:
  - 일관성
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V65
    level: 막음
- id: Q7-024
  title: 도표는 번호로 — 자리말 금지
  rule: 인쇄본은 그림이 떠서 놓이므로 「아래 그림처럼」·「위 표」·「다음 표는」·「앞의 표 6.1-5」나 「N.N의 표」·「N장의 그림」처럼 자리로 부르지 않고 「그림 3.1-1처럼」 번호로 부른다. 상자 안·표 주석 안도 같다.
  core:
  - 일관성
  - 품질
  area: Q7
  layer: 본체
  status: 일부
  enforce:
  - gate: V66
    level: 막음
  - gate: V83
    level: 기록만
- id: Q7-025
  title: 그림 바로 앞 「다음과 같다」 금지
  rule: 그림 바로 앞 문장을 「~은 다음과 같다.」로 끝내지 않고 「~은 그림 N과 같다」로 쓴다. 이때 주어는 그림 제목을 되풀이하지 않는 내용이다.
  core:
  - 일관성
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V66
    level: 막음
- id: Q7-027
  title: 표 읽는 법 상자를 지움
  rule: '「표 N은 순위표가 아니다」·「정성적 개관이지 정량 등급이 아니다」 같은 읽는 법 상자는 지우고, 안에 내용 문장이 있으면 그 한 문장만 표 아래 판독 문장으로 옮긴다. 표 칸이 순서형 표기면 「주: 순서 표기」 한 줄로 한다.'
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V67
    level: 막음
- id: Q7-028
  title: 쪽을 넘는 묶음 표는 첫 칸을 행마다 채움
  rule: 약어표 「군」처럼 첫 행에만 묶음 이름을 쓰고 아래 행을 비우지 않는다 — 인쇄본에서 표가 쪽을 넘으면 묶음이 보이지 않는다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 일부
  enforce: []
- id: Q7-029
  title: 본문은 표를 읽어 주지 않음
  rule: 표의 열·행·칸 이름과 칸 값을 낫표·따옴표로 옮기거나, 줄을 세거나(「셋째 줄이」), 읽는 방향을 안내하는(「가로로 읽으면」·「왼쪽 열에는」) 문장을 쓰지 않는다. 표가 말하는 사실과 그 뜻을 평서문으로 쓰고 표는 괄호로 부르며, 표에 없는 해석을 덧붙이지 않는다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 일부
  enforce:
  - gate: V25
    level: 막음
  - gate: V36
    level: 막음
  - gate: V69
    level: 막음
- id: Q7-030b
  title: 도표 하나의 설명 차례
  rule: 도표 하나를 두면 설명은 「무엇을 보이나 → 읽는 법 → 결론」 차례로 한 번만 한다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 대기
  enforce: []
- id: Q7-031
  title: 그래프 축 이름과 단위
  rule: 축이 있는 그래프는 명세에 xlabel(항목 축)·ylabel(값 축, 단위는 괄호)을 두고 렌더러는 둘 다 그린다. 막대를 가로로 눕혀도 이 뜻은 바뀌지 않으며 unit 만 있는 옛 꼴도 고친다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V75
    level: 막음
- id: Q7-032
  title: 축 이름은 쉬운 말로
  rule: 축 이름은 그림 제목·캡션·항목·단위에서 가져온 쉬운 말로 쓰고 새 사실을 만들지 않는다. 한 축에 단위가 다른 값을 세운 그래프는 「값(항목마다 단위 다름)」으로 두고 그래프 꼴을 다시 본다.
  core:
  - 쉬운 말
  - 품질
  area: Q7
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V80
    level: 기록만
- id: Q7-034
  title: 산문 속 형태별 재배치
  rule: 공식은 수식 상자, 속성을 견주는 병렬 항목은 표, 열거는 목록, 정량 비교는 차트, 개념 관계·흐름은 mermaid, 용어 규정은 정의 상자, 함정은 주의 상자, 워크드 예제는 예시 상자로 옮긴다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-036
  title: 정량 가독성 지표
  rule: '최장 무시각 글 런은 값: tok.max_textrun_chars 이하, 시각 밀도는 값: tok.visual_density_min 이상, 표 결함 0 을 잰다.'
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-037
  title: 내용 성격별 그림 꼴
  rule: 내용 성격별 그림 꼴(유형 비교 레이더, 성장 곡선 선 그래프, 단계 타임라인, 적합성 매트릭스 히트맵, 개선 전후 짝 막대, 순환·흐름 mermaid, 제품 비교 표)을 미리 정하고 중심 명제에 시각화를 몰아 둔다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-038
  title: 코드블록 속 구조 데이터는 표·목록으로
  rule: text 코드블록에 든 규약·매핑·비교는 표로, 글자로 그린 나무·분류는 목록으로 옮기고 진짜 의사코드·함수 시그니처·JSON 만 코드블록으로 둔다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-039
  title: 모든 도표에 번호 캡션
  rule: 모든 도표에 번호 캡션을 단다. 본문의 표에 굵은 이름표만 달지 않고, 부르지 않는 짧은 표는 목록·문장으로 바꾼다.
  core:
  - 품질
  - 일관성
  area: Q7
  layer: 본체
  status: 일부
  enforce:
  - gate: V6
    level: 막음
  - gate: V83
    level: 기록만
- id: Q7-041
  title: 캡션 자리 — 표는 위, 그림은 아래
  rule: 표 캡션은 표 위에, 그림·차트 캡션은 그림 아래에 단다. 표는 캡션 → 표 → 설명 차례를 지키고 캡션과 표 사이에 문단을 끼우지 않는다.
  core:
  - 일관성
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-043
  title: 데이터–형식 정합
  rule: 형식을 고르기 전에 그 형식이 요구하는 데이터가 원고에 있는지 묻는다. 낱말을 눈금에 올리지 않고, 숫자 없는 표로 좌표계를 만들지 않으며, 점 두 개를 곡선으로 잇지 않고, 조건이 다른 사례에 공유 축을 세우지 않으며, 단위·분모를 섞지 않고, 합계를 부분과 같은 계열에 두지 않으며, 결측을 0으로 그리지 않고, 논리 순서를 값 크기순으로 바꾸지 않는다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q7-044
  title: 판독 진술은 두 요소 비교로 확인
  rule: 그림에 대한 판독 진술은 그림 안 두 요소를 견줘 확인할 수 있어야 하고(「빈칸이 없다」·「중요하다」류는 안 됨), 형식이 판독을 배신하지 않게 한다(우열이 아니면 사다리 꼴 금지).
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q7-045
  title: 도판 칸은 정의 → 근거 → 예시의 층
  rule: 도판 칸은 한 줄 설명으로 끝내지 않고 정의 → 근거 → 예시의 층을 가지며 원고의 구체 사례·수치를 「예」 줄로 붙인다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q7-046
  title: 수치 장은 도판 틀 먼저
  rule: 지표·경제성 계산은 CALC, 개념과 근거 수치 한 쌍은 SPLIT 을 먼저 쓰고, 생성기 기본 차트는 범주가 많은 추세·분포에만 쓴다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q7-047
  title: 장마다 이해시킬 것 하나를 정하고 틀을 고름
  rule: 덱 장마다 교육생이 이해할 것 한 가지를 먼저 정하고 그것을 보이는 틀을 고른다(어디서·무엇 SCENE / 어디가 다른가 FIELDMAP / 비교 VERSUS / 셈 WATERFALL·PICTO·SPLIT·CALC / 순서 TIMELINE·FLOW / 순환 CYCLE / 나열 ICONCARDS). 표(GRID)는 찾아보는 자료일 때만 쓴다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q7-048
  title: 원고 표는 핵심 두세 줄만 그림으로
  rule: 덱에서 원고 표는 핵심 두세 줄만 그림으로 보이고 표 전체는 노트에 「원고 표 N」으로 옮긴다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-quality-Q3
    level: 막음
- id: Q7-050
  title: 부호를 색으로 굳히지 않음
  rule: 개선이 음수로 나오는 일이 흔하므로 양수=좋음 색칠을 하지 않고, 축은 「관행 대비 개선폭」, 원값은 막대 끝 라벨, 부호는 위치(0선 좌우)·기호로 먼저 나타낸다.
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q7-052
  title: 이어지지 않는 계산은 연결 점선을 끔
  rule: 'WATERFALL 에서 이어지는 계산이 아니면 점선이 오해를 부르므로 connectors: false 로 한다.'
  core:
  - 품질
  area: Q7
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-001
  title: 인용과 괄호 덧말 사이 한 칸
  rule: 인용 뒤 괄호 덧말은 한 칸 띄운다 — 「[REF-262] (표 13.3-2)」. 붙여 쓰면 마크다운 링크가 되어 죽은 링크가 된다(괄호가 다음 줄에서 닫혀도 같다).
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V45
    level: 막음
- id: Q8-002
  title: 표 마지막 행 뒤 빈 줄
  rule: 표 마지막 행 뒤에 빈 줄을 둔다. 없으면 설명 문단이 표의 마지막 행으로 삼켜진다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V15
    level: 막음
- id: Q8-003
  title: 그림 글자도 본문 글꼴로 지정
  rule: 'mermaid 초기화와 차트 SVG 글자(ch-*)에 본문 글꼴(값: tok.font.body)을 직접 준다. 지정이 없으면 mermaid 는 trebuchet·verdana 로 그려지고, 떼어 낸 SVG·PDF·덱에서 글꼴이 갈린다.'
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-qc_capture
    level: 기록만
- id: Q8-005
  title: 인라인 코드는 영문 식별자에만
  rule: 인라인 코드는 필드 이름·코드값·파일 이름·명령 같은 영문 식별자에만 쓰고 한글이 든 인라인 코드는 쓰지 않는다. 짧은 한글 값 이름은 「」, 꼬리표·상태 표시는 보통 글자로 쓴다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V46
    level: 막음
- id: Q8-006
  title: 한글은 기울이지 않음
  rule: 한글 글꼴에는 기울임꼴이 없어 브라우저·PowerPoint 가 가짜 기울임을 만들므로 원고·웹북·PDF·발표자료 어디서도 한글을 기울이지 않는다. 기울임은 학명·외국어 제목에만 쓴다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V47
    level: 막음
  - gate: DECK-style-ussa
    level: 막음
- id: Q8-007
  title: 수식 안 한글은 text 로, 첨자에 두지 않음
  rule: 수식 안 한글은 text 명령으로 감싸고 첨자·underbrace 설명에 두지 않는다. 기호는 영문으로 두고 뜻은 수식 아래 「여기서 …」 문장으로 푼다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V48
    level: 막음
- id: Q8-008
  title: 숫자가 뒤따르지 않는 통화 기호는 이스케이프
  rule: 「US$는」·「21.50 $/m³」처럼 숫자가 뒤따르지 않는 통화 $ 는 역슬래시로 이스케이프한다. 코드 펜스 안은 이스케이프하지 않는다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V49
    level: 막음
- id: Q8-009
  title: 도형·차트 글자는 한 크기, 본문보다 작게
  rule: '도형·차트 글자는 표 글자와 같은 층위로 본문보다 작게 한 크기(웹북 값: tok.web.size.small · PDF 값: tok.print.size.small)로 쓰고 제목·눈금·각주를 크기로 가르지 않는다(굵기·색으로 가름). 불가피할 때만 줄이되 하한은 웹북 tok.web.size.diagram_min · PDF tok.print.size.min 이다.'
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-check_diagram_text
    level: 막음
  - gate: REV-measure_mermaid
    level: 막음
  - gate: AT-pdf-mermaid
    level: 경고
  - gate: AT-check_charts
    level: 기록만
- id: Q8-010
  title: 웹북 글자 단계 — 본문 > 표 = 그림 글 = 캡션
  rule: '웹북은 모든 화면 폭에서 본문(값: tok.web.size.body) > 표 = 그림 안 글 = 캡션(값: tok.web.size.small)의 단계를 한 값으로 지킨다. 좁은 화면에서 그림은 줄이지 않고 그림 상자 안 가로 이동으로 보이며, 표는 최소 폭(값: tok.web.table.min_width)을 두어 쪽이 넓어지지 않게 한다.'
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: REV-qc_capture
    level: 기록만
- id: Q8-013
  title: 엑셀 서식은 시트 셋
  rule: 엑셀 서식은 시트 셋으로 만든다 — 사용법(대상·때·준비물·차례·규율·판정 기호·열의 뜻) / 점검표(머리 기입란·영역별 항목·판정은 고르기 목록) / 결과 요약(판정 수·미확인·필수 ✕ 와 등급을 수식으로 셈).
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V65
    level: 막음
- id: Q8-014
  title: 참고문헌은 APA 7판 순서 유지
  rule: 참고문헌은 APA 7판 순서를 지키고 번호 순 배열로 바꾸지 않는다(번호가 뛰는 것은 그대로).
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: V68
    level: 막음
- id: Q8-015
  title: 참고문헌 묶음·정렬 기준
  rule: 참고문헌의 영문·국문 묶음은 항목이 실제로 시작하는 말(첫 지은이, 없으면 제목)로 가르고, 정렬은 대소문자를 가리지 않으며 지은이가 없으면 제목으로 한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: V68
    level: 막음
- id: Q8-017
  title: 본문 인용은 APA 저자-연도로 렌더
  rule: 본문 인용은 원고를 고치지 않고 렌더러가 [REF-n] 을 reference_list.json 의 지은이·연도로 바꿔 찍는다(같은 해 같은 지은이 2022a·2022b, 영문 둘 「A & B」·셋 이상 「A et al.」, 국문 「홍길동 외」). REF 번호는 편별로 독립 유지하며 독자에게 보이지 않는다. 2차 서지 대조 뒤에 한다.
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 일부
  enforce: []
  edition: 플러그인 판 문구
- id: Q8-018
  title: mermaid 마디 글의 물결표
  rule: mermaid 마디 글 안에 「~」가 둘 있으면 지움줄로 읽히므로 홑 물결표를 그대로 두지 않는다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V73
    level: 막음
- id: Q8-019
  title: 그림 글자는 웹북·PDF 둘 다 실측
  rule: 그래프·흐름도 글자의 글꼴·크기는 원고 명세가 아니라 그려진 결과물에서 웹북과 인쇄본 PDF 둘 다 실측해 확인한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-qc_capture
    level: 기록만
  - gate: REV-check_diagram_text
    level: 막음
  - gate: AT-pdf-mermaid
    level: 경고
- id: Q8-022
  title: 표 행 사이에 빈 줄 금지
  rule: 표 행 사이에 빈 줄을 두지 않는다(파싱 실패).
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q8-023
  title: 렌더 순서 — 코드 펜스·mermaid·수식 보호
  rule: md2html 에 fenced_code 확장을 넣고 mermaid 보호 → 수식 보호 → 변환 → 수식 복원 → mermaid 복원 순서로 처리한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q8-024
  title: 수식 무결성 — 제어문자 복원·부등호
  rule: 카드 LaTeX 의 제어문자 오염을 스캔·복원하고 $$ 안 리터럴 부등호는 lt·gt 명령으로 바꾸며 mjx-merror 0 을 확인한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V37
    level: 막음
- id: Q8-025
  title: mermaid 전 블록 parse 검증과 라벨 인용
  rule: 웹북 번들 mermaid 로 모든 블록을 parse 하고, subgraph 제목·엣지 라벨의 공백·괄호·특수문자는 따옴표로 감싸며 줄바꿈은 br 태그로 쓴다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: REV-check_mermaid
    level: 막음
  - gate: PLG-FG-mermaid_label_risk
    level: 경고
- id: Q8-026
  title: 콜아웃 본문은 4칸 들여쓰기
  rule: '!!! 다음 첫 줄은 4칸 들여쓰기여야 하며 1~3칸이면 본문이 상자 밖으로 떨어진다.'
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V22
    level: 막음
- id: Q8-028
  title: 인쇄본은 절 끝 인용 목록을 없앰
  rule: 인쇄본은 절 끝 「인용 참고문헌」을 없애고 책 끝 참고문헌 하나만 두며 웹북은 「이 절에서 인용한 문헌」을 접은 목록으로 둔다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 일부
  enforce: []
- id: Q8-029
  title: 표 칸 굵게는 원고에 쓰지 않음
  rule: 표 칸 굵게는 첫 열을 포함해 원고에 쓰지 않는다. 행 머리를 돋보이게 해야 하면 웹북·PDF 표 꼴(CSS) 한 규칙으로 시리즈 전체를 같게 한다.
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: V81
    level: 기록만
- id: Q8-030
  title: 결과물 실측 결함은 편마다 0, 캡처는 커밋하지 않음
  rule: 한 글자만 다음 줄·그림 글 겹침·표 넘침 같은 결과물 실측 결함은 편마다 0 으로 만든다. 캡처 폴더는 저장소에 넣지 않고 결함 목록 파일만 커밋한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: REV-qc_capture
    level: 기록만
  - gate: REV-qc_ledger
    level: 막음
  edition: 플러그인 판 문구
- id: Q8-034
  title: 도판 검수 — 렌더 PNG 를 눈으로
  rule: 렌더 PNG 를 눈으로 열어 겹침·잘림·캔버스 밖 넘침을 확인하고 생성기 경고(줄 넘침·칩 잘림·카드 넘침)를 0 으로 한다. 내용이 짧으면 높이를 줄여 저장한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-037
  title: 인쇄 글자 크기 — 본문과 작은 글 한 단
  rule: 인쇄 본문은 tok.print.size.body, 표·도형·차트·캡션·상자는 한 단 아래 tok.print.size.small 로 찍고 상자 글자는 본문보다 크지 않게 한다.
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-pdf-bodypt
    level: 경고
  - gate: AT-pdf-mermaid
    level: 경고
- id: Q8-038
  title: 쪽 폭 넘침 0 — 한 요소가 문서 전체를 축소
  rule: 쪽 폭을 넘는 요소가 하나라도 있으면 Chromium 이 문서 전체를 줄여 찍으므로 「쪽 폭 초과」「축소 의심」이 0 이어야 한다. 넘침 허용값은 tok.print.check.width_tolerance.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-pdf-width
    level: 경고
  - gate: AT-pdf-bodypt
    level: 경고
  edition: 플러그인 판 문구
- id: Q8-045
  title: 쪽번호 체계
  rule: 반표제지~판권면은 쪽번호를 찍지 않고(셈에는 넣음), 추천사부터 앞붙이는 로마 숫자, 본문은 1부터 아라비아 숫자로 매긴다. 간지(부·장·별첨)·빈 면에는 쪽번호·머리글을 찍지 않으며, 쪽번호는 바깥쪽 아래 숫자만 둔다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-050
  title: 배포 번호는 판권면 한 곳
  rule: 배포·판 정보는 모든 쪽 꼬리말이 아니라 판권면 한 곳에만 싣는다.
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-051
  title: 여러 권 — 권마다 쪽번호·앞뒷붙이 나눔
  rule: 여러 권이면 권마다 쪽번호를 새로 매기고 권마다 앞표지·반표제지·속표지·판권면·그 권 차례(다른 권은 권 이름 한 줄)·뒷표지를 둔다. 추천사·발간사·이 책에 대하여·일러두기는 I권에만, 용어·참고문헌·찾아보기·지은이(감수) 소개는 마지막 권에만 두고, 낱권 ISBN 은 목록으로 둔다. 양면 규칙도 권마다 지킨다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-054
  title: 인쇄본만 인용 번호 [711] 꼴
  rule: 인쇄본의 인용 번호는 웹북의 [REF-711] 대신 [711](글자만, 링크 유지)로 찍고 참고문헌 목록·일러두기도 같게 한다.
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-055
  title: 찾아보기 없는 편은 자리만
  rule: 찾아보기가 없는 편은 자리만 두고 출판 전 자동 색인 생성을 따로 검토한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 대기
  enforce: []
- id: Q8-058
  title: 인쇄 본문 — 양끝 맞춤 + 글자 단위 줄바꿈
  rule: 인쇄 본문은 tok.print.size.body·행간 tok.print.leading.body·먹(tok.color.ink.print)으로, 양끝 맞춤에 글자(음절) 단위 줄바꿈 + 금칙 strict 로 짠다. 표 칸·캡션·제목·이름표 같은 짧은 글은 어절 단위로 꺾는다. 단락은 들여쓰기 대신 아래 간격을 둔다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-pdf-bodypt
    level: 경고
- id: Q8-060
  title: 표 쪽 나눔 — 짧은 표는 통째, 나뉘면 앞뒤 최소 행
  rule: tok.print.break.table_whole_rows 이하 표는 통째로 넘기고, 나뉘면 앞 쪽·뒤 쪽에 각각 tok.print.break.table_split_min 행 이상 남기며 머리행을 반복한다. 「머리행 + 1행」만 쪽 끝에 남기지 않는다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
  edition: 플러그인 판 문구
- id: Q8-061
  title: 쪽 끝 외톨이·한 줄만 넘어간 쪽 없애기
  rule: 절 끝 묶음(결론 끝 두 항목 → 인용 목록 → 용어 풀이)을 붙여 판면 tok.print.check.fill_min 미만만 채운 쪽을 0 으로 하고, 쪽 끝에 외톨이 제목·캡션을 남기지 않는다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-pdf-gaps
    level: 기록만
- id: Q8-063
  title: 인용 번호·용어 풀이는 배경으로
  rule: 인용 번호와 절 끝 용어 풀이는 tok.print.size.note 회색으로 낮추고, 본문 용어의 웹 점선 밑줄은 없애며, 용어 풀이 위에 짧은 각주선을 둔다. 인용 번호는 줄 끝에서 쪼개지지 않게 한 덩어리로 둔다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-064
  title: 도형 글자 하한 미달은 경고로 보고
  rule: 인쇄본 도형·차트 글자가 tok.print.size.small 미만이면 목록을, tok.print.size.min 미만이면 「하한 미만」을 경고로 보고한다. 빌드는 막지 않고(D3) 경고 목록을 통합검토 점검표·배포 보고서에 싣는다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: AT-pdf-mermaid
    level: 경고
- id: Q8-066
  title: 부 간지 뒷면은 빈 면, 간지 목록에 쪽번호 없음
  rule: 부 간지 뒷면은 비우고, 간지의 「이 부의/이 장의 차례」 목록에는 쪽번호를 싣지 않는다(차례와 두 곳이 되지 않게).
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-068
  title: 참고문헌 — 번호를 왼쪽에 매달고 원고 순서 유지
  rule: 인쇄 참고문헌은 [029] 번호를 왼쪽 매단 칸으로 옮기고 목록 순번은 지우며, 글은 tok.print.size.small 왼끝 맞춤, 순서는 원고(APA 7) 그대로 둔다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-070
  title: 자리 상자의 모양이 곧 채울 꼴
  rule: 찾아보기 자리는 2단 상자 둘, 지은이 소개 자리는 사람마다 이름·소속·약력 칸으로, 채울 사람이 누구를·무엇을·얼마나 넣을지 알게 한다. 상자 밖 개발 메모는 인쇄에서 뺀다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-071
  title: 별첨 엑셀 서식은 인쇄에서 「어디 있나」로 안내
  rule: 별첨 서식의 「내려받기」는 인쇄에서 「엑셀 서식 — 파일.xlsx(웹북 별첨 쪽에서 내려받는다)」로 바꾸고 D4 근거 상자 꼴로 본문과 가른다(새 상자 문법을 만들지 않는다).
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-075
  title: PDF 서체는 로컬 글꼴
  rule: 인쇄 시 인터넷이 필요한 CDN 글꼴 대신 로컬 글꼴(편 웹북 assets 또는 설치 글꼴)을 쓴다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q8-077
  title: PDF 검증 항목
  rule: 쪽 폭 넘침 0 · 전 쪽 글자 크기 축소 없음(PyMuPDF 표본) · mermaid 렌더 실패 0 · 차례→절 내부 링크 동작 · 장 표지 수 = 장 수 · 무작위 10쪽 육안.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-pdf-width
    level: 경고
  - gate: AT-pdf-bodypt
    level: 경고
  - gate: AT-pdf-mermaid
    level: 경고
  - gate: AT-pdf-toc
    level: 경고
- id: Q8-078
  title: 묶음 조립 뒤 링크 검사를 건너뛰지 않음
  rule: 웹북 묶음은 조립 뒤 상대 링크 검사(check_links·check_portal_links) 0 에 더해 JS 가 만드는 링크를 묶음 안에서 대조하고 무스타일 렌더를 눈으로 본다. 경로 치환 오류는 CSS 가 조용히 무시되어 링크 검사로만 잡히므로 이 검사를 건너뛰지 않는다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-bundle_links
    level: 막음
  - gate: AT-portal_links
    level: 막음
  - gate: AT-release-toclinks
    level: 막음
- id: Q8-080
  title: 공용 대용량 asset 중복 제거 + 링크 체커
  rule: 묶음 조립 때 공용 대용량 asset 을 _shared/ 에 한 벌만 올리고 정규식 1종으로 참조를 치환하며, 실패하면 --no-dedupe 로 물러나고 수집 뒤 링크 체커로 전체 상대 링크를 검사한다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 일부
  enforce:
  - gate: AT-bundle_links
    level: 막음
- id: Q8-083
  title: JS 가 조립하는 경로는 파이썬이 넘긴 값만
  rule: 런타임에 JS 가 만드는 링크는 어느 링크 체커에도 걸리지 않으므로, JS 가 경로를 조립하면 그 값은 파이썬이 주입한 것(window.PORTAL_URLS 등)이어야 하고 JS 가 스스로 경로를 알면 안 된다.
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-release-toclinks
    level: 막음
- id: Q8-084
  title: PDF 는 편 웹북 HTML 을 그대로 읽는다
  rule: PDF 는 웹북 HTML 을 그대로 읽고 변환기를 다시 돌리지 않아 화면판과 인쇄판이 갈리지 않게 하며, 본문 글자 크기를 실측해 값 tok.print.size.body 가 아니면 경고한다.
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-release-moved
    level: 막음
  - gate: AT-pdf-bodypt
    level: 경고
  edition: 플러그인 판 문구
- id: Q8-085
  title: 별첨 엑셀 서식은 묶음에 포함하고 개수를 대조
  rule: 별첨 내려받기 엑셀 서식은 묶음에 포함하고, 편마다 원본과 개수를 맞춰 다르면 실패하며 수집 원장과 안내문에 건수를 찍는다.
  core:
  - 품질
  - 일관성
  area: Q8
  layer: 본체
  status: 적용됨
  enforce:
  - gate: AT-bundle_xlsx
    level: 막음
- id: Q8-090
  title: 카드 완결성 검증 시점과 판정
  rule: '본문 호출 한 건이 끝난 직후·세션 시작 때·카테고리 검토 직전에 verify_cards.py 로 카드 완결성을 재고, 사이즈별 본문 글자 하한(값: tok.plugin.card_min_chars)과 종결부로 판정한다. WARN 은 위양성이 많아 의심 카드 상세를 보고 정한다.'
  core:
  - 품질
  area: Q8
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-001
  title: 글꼴은 시리즈 한 벌
  rule: 웹북·PDF·표지·발표자료는 같은 글꼴 한 벌을 쓴다 — 본문·한글 tok.font.body, 라틴 장식 tok.font.latin_display, 고정폭은 코드에만, 발표자료 기호만 tok.font.deck_symbol. 정본은 디자인 원본이고 편에서 덮어쓰지 않으며 크기 체계도 원본을 따른다.
  core:
  - 품질
  - 일관성
  area: Q9
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q9-008
  title: 편집 가능성 — 결과로 규정(개정)
  rule: '도판은 editable: true 로 도형 그룹·글자 상자, 수치 차트는 네이티브 차트(T8), 표는 네이티브 표, 노드는 그룹 깊이 1로 넣는다. 색 원본은 팔레트이며 바꾸려면 팔레트를 고쳐 다시 빌드한다. 마스터 일괄 이동 요구는 폐지한다.'
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-012
  title: 화면에 큰 빈 곳을 남기지 않는다
  rule: 도식이 화면을 채우지 못하면 아래 띠(foot)에 원고의 요지·원형을 받치고, 수치 카드 아래엔 그 계산을, 좌우 분할의 빈 쪽엔 요구·정의 상자를 둔다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-014
  title: 칸 디자인 — 흰 바탕·얇은 선·편 색 띠
  rule: 칸은 흰 바탕·얇은 선·편 색 띠(위 또는 왼쪽)로 그리고 굵은 테두리·베이지 덩어리 칸을 쓰지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-015
  title: 장마다 시선이 먼저 가는 중심 하나
  rule: 장마다 짙은 띠·큰 아이콘·픽토그램·시간축·큰 숫자 가운데 하나를 중심으로 두고, 상자·격자·아래 띠만 반복하는 문서형 화면을 만들지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-018
  title: 화면에 「교육 자료」 표지를 드러내지 않는다
  rule: 대상·선수 지식·차시·분·학습목표 번호는 노트와 숨김 강사 안내 장에만 두고, 화면 학습목표는 「이 시간에 답할 질문」(물음표), 확인 문항은 「함께 짚어 보기」(답 칸 없음), 바닥글·표지 이름표는 「발표자료」로 한다(「교육용」은 파일 이름에만).
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-edu-E1
    level: 막음
  - gate: DECK-edu-E8
    level: 막음
- id: Q9-022
  title: 의미색은 편 색과 함께 돌리지 않음
  rule: 의미색(위험 tok.color.semantic.risk · 주의 tok.color.semantic.caution · 보조 회색 tok.color.semantic.sub)은 편 색과 함께 돌리지 않는 고정값이고, 적색은 위험에만 쓴다.
  core:
  - 품질
  - 일관성
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-025
  title: 강조색은 결론 띠가 지목할 때만
  rule: 여럿 가운데 하나만 다른 색(hi·채운 칸·진한 칸)은 결론 띠가 그 블록을 지목할 때만 쓰고, 나란한 항목은 모두 같은 색으로 한다. 결론과 어긋나는 강조는 쓰지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-quality-Q7
    level: 경고
- id: Q9-026
  title: 구분용 색 나눔은 허용
  rule: 층마다 다른 색·계단 단계색·위험색처럼 항목마다 색이 다른 구분용 색은 괜찮다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-027
  title: 대등 비교는 양쪽 모두 편 색
  rule: 'VERSUS 에서 강조하지 않은 쪽은 회색이라 열등으로 읽히므로 한쪽을 권하는 비교만 한쪽 hi, 대등한 비교는 양쪽 모두 hi: true 로 하고 양쪽 다 회색으로 두지 않는다.'
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-030
  title: 사람 기준 — 접촉 시트로 장마다
  rule: 접촉 시트로 장마다 그림 중심 하나·이해할 것 하나·빈 공간·잘림·겹침 없음·같은 사례 같은 그림·값의 단위·기준·근거를 본다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-032
  title: 글자 색·면 색 2층과 대비 기준
  rule: 글자 전용 색(-ink)은 실제 바탕과 tok.contrast.text_deck 이상, 면·선 전용 색(-mark)은 tok.contrast.graphic_min 이상으로 하고, -mark 색은 글자에 쓰지 않으며 -ink 색으로 범주를 나누지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 일부
  enforce: []
- id: Q9-033
  title: 색 쌍 게이트 ΔE_ok ≥0.20·ΔL ≥0.10
  rule: 같은 화면에 다른 뜻으로 함께 놓이는 두 색은 tok.color.deltaE.semantic_pair 와 tok.color.deltaL.min 을 넘어야 하며, 범주 3개 이하는 의미색 / 4~6개는 한 색 명도 계단 / 7개 이상은 색으로 나누지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q9-038
  title: 하지 않는 것 목록
  rule: 클립아트·사진 배경 위 글자·3D 차트·원형 차트·이탤릭·말풍선·손글씨체·그림자·이모지·장마다 다른 배경색·애니메이션 전제 레이아웃·도형으로 그린 가짜 막대를 쓰지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q9-039
  title: 색만으로 나누지 않음 — 흑백에서도 남게
  rule: 범주·위계는 색만으로 나누지 않고 위치·형태·기호·명도를 먼저 쓴다. 흑백으로 찍어도 갈리게(명도 차 tok.color.deltaL.min) 하고 글자 대비는 작은 글 tok.contrast.text_min · 제목급 tok.contrast.large_min 이상으로 한다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q9-041
  title: VERSUS 틀 제약
  rule: 가운데 원 mid 는 두 글자까지, scene+foot+글머리 넷이면 넘쳐 경고 — 경고가 나면 글머리 셋 이하·scene 또는 foot 빼기.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-043
  title: 도판 색 이름 체계
  rule: '도판 색은 이름으로 부른다 — 편 700=main·900=dark·500=mid·300=accent·옅은 main=light/pale, 고정 sub·risk·series. YAML 에는 이 이름이나 #RRGGBB 만 쓰고 편 색을 코드에 적지 않는다.'
  core:
  - 품질
  - 일관성
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-044
  title: 구조 범주는 편 주색 하나, 구분은 번호·이름
  rule: 구조 범주는 편 주색 하나로 칠하고 구분은 번호·이름으로 하며, 병렬 칸 구분이 꼭 필요할 때만 명도 단계(ramp)를 쓴다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-047
  title: 넘치면 나눈다
  rule: 용량 상한을 넘거나 정밀함과 화면 밀도가 부딪히면 글씨를 줄이지 말고 헤드라인이 다른 두 장으로 나눈다. 「(이어서)」 장은 쓰지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-050
  title: 표지는 편마다 자유 디자인 — 내용에서 나온 시각 개념
  rule: 인쇄본 앞표지와 발표자료 표지는 편 내용에 맞춰 편마다 자유롭게 디자인하되 장식이 아니라 원고에서 나온 시각 개념이어야 하며, 디자이너와 독립된 검토자가 기준표로 검토한다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-055
  title: 표지 SVG 기술 제약
  rule: SVG 하나로 완결(외부 URL·스크립트 금지), 그림은 벡터 도형으로 직접(사진·AI 생성 이미지·남의 일러스트 금지), 글은 <text>(외곽선 변환 금지), 글꼴 Pretendard·Poppins, 필터(블러·그림자)는 아껴 쓴다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-058
  title: 서가 구별은 색상으로 — 넓은 면은 700·500
  rule: 편 색은 같은 명도·채도 대역에서 색상만 돌므로 표지 면적의 상당 부분을 700·500 단으로 칠해 서가에서 색상으로 구별되게 한다. 300 단은 밝아질수록 이웃 편 쪽으로 기울어 넓은 면에 쓰지 않고 작은 강조에만 쓴다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-061
  title: 반복 요소는 바코드·막대그래프로 읽힌다
  rule: 같은 요소를 여럿 늘어놓을 때 요소마다 흰 테를 두르거나 높이를 뜻 없이 다르게 하지 않는다 — 덩어리 바깥 테 하나로.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-062
  title: 편 ID 는 제목보다 작게
  rule: 크고 채도 있는 ID 는 첫 시선을 뺏으므로 위계를 제목 → 부제 → ID·시리즈로 한다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-063
  title: 그래픽 대비 3:1 — 정보 칸·면의 모든 변
  rule: 정보를 담은 칸·면과 그림 속 정보 요소(빗금·영역)는 정보 그래픽이므로 모든 변에서 바탕과 tok.contrast.graphic_min 을 넘게 한다. 판을 나누는 바탕끼리의 경계에는 걸지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-069
  title: 인쇄 디자인에서 피할 것 — 웹 화면 문법
  rule: 둥근 카드·그림자·과한 색 띠 같은 웹 화면 문법, 쪽마다 다른 장식, 면마다 강조색 남발, 글보다 무거운 괘선, AI 슬롭을 피한다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-070
  title: 본문 쪽 콘셉트 — 먹 한 벌, 편 색 한 줄
  rule: 글은 먹으로, 편 색(700/900 한 계열)은 구조를 가리키는 가는 선과 번호에만 쓰고, 위계는 색 칸·둥근 상자·그림자 없이 크기·굵기·여백·괘선 굵기로 세운다 — 흑백으로 찍어도 같은 책.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-080
  title: 차트 계열색은 편 색 회전에서 뺀다
  rule: 본문 데이터 의미색과 부딪히지 않게 차트 계열색(--chart-1~6)은 편 색으로 바꾸지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-081
  title: 인접 편 구별은 색만이 아니라 ID 칩으로
  rule: 사이클 순 배정은 인접 편 색이 가까우므로 시리즈 바·사이드바 ID 칩이 문자로 확정하고, 색만으로 두 편을 변별해야 하는 화면은 만들지 않는다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-085
  title: 시리즈 안내는 독자가 다른 편으로 건너가게 하는 것
  rule: 내부용 배포에서는 웹북(포털 + 편 마지막 쪽)에 시리즈 안내를 본체로 두고, 인쇄 PDF 는 쪽을 더하지 않고 뒷표지 자체를 시리즈 일람으로 한다(지금 책 강조).
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q9-087
  title: 디자인 토큰·표지 정보 대조 게이트(새로 만들 것)
  rule: 웹북 CSS·PDF·발표자료가 시리즈 토큰 값만 쓰는지, 표지의 편 이름·코드·표제 물음이 등록표와 같은지 기계로 대조한다.
  core:
  - 품질
  area: Q9
  layer: 본체
  status: 대기
  enforce: []
- id: W-002
  title: 완료 판정 — 렌더 먼저, 그 뒤 게이트 전부 0
  rule: '렌더를 먼저 돌린 뒤 게이트(값: tok.gate_range)를 돌려 전부 0 이어야 끝이다. 착수 전 규모는 옛 판을 기준선으로 잰다.'
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-003
  title: 옛 판 동결, 개정은 새 출력 폴더에서
  rule: 개정 시작 전에 옛 판을 태그로 동결하고 개정은 새 출력 폴더에서만 한다. 렌더·웹북 스크립트는 대상이 동결본이면 실행을 거부한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-004
  title: 생성물은 손으로 고치지 않는다 — 원천을 고쳐 다시 만든다
  rule: 카드·spec·팔레트 원본 같은 원천이 정본이다. 렌더·웹북·덱 PPTX·팔레트 파일 같은 생성물은 직접 고치지 않고 원천을 고쳐 다시 만든다(손으로 고친 것은 다음 빌드에서 사라진다).
  core:
  - 일관성
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-005
  title: REF ID 를 다시 매기지 않는다
  rule: REF ID 를 다시 매기지 않으며(인용이 깨진다), 줄일 때는 인용 기반으로 걷는다. 편을 나눠도 REF 번호는 물려받는다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-006
  title: 규칙이 안 맞으면 편이 아니라 규칙을 고친다
  rule: 전 편에 같은 기준과 임계를 쓴다. 규칙이 어느 편에 맞지 않으면 그 편에서 바꾸지 말고 규칙(과 절차서·프롬프트)을 고친다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-008
  title: 조사·어미 판단은 기계로 고치지 않음
  rule: 조사와 어미를 갈라야 하는 교정은 정규식으로 하지 않는다. 문체 리포트는 밀도만 재고 고치는 것은 사람이다.
  core:
  - 쉬운 말
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-010
  title: 목차 정규화 전후 대조표를 남김
  rule: 편마다 목차 정규화 전후 대조표와 판 이력의 별도 줄을 남긴다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: W-018
  title: 역할 설명 게이트(V67)는 사람 판정
  rule: V67 은 꼴을 잡아 사람이 판정하며 0 이 목표가 아니다. 남긴 곳은 까닭을 편 기록에 적고, 지운 자리 앞뒤 연결과 번호 목록을 다시 본다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V67
    level: 막음
- id: W-021
  title: 표현 다듬기는 값·출처·뜻 불변, 문장 대장
  rule: 표현을 다듬을 때 값·단위·출처 표시·도표 번호·뜻은 바꾸지 않고 기계로 전후 대조하며, 문장마다 전→후 대장을 남긴다. 서브에이전트에 맡길 때는 「값·근거 보존」과 「새 내용 문장 금지」를 함께 준다.
  core:
  - 품질
  - 쉬운 말
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-028
  title: 절 번호 대응표와 편 사이 호출
  rule: 절이 합쳐지거나 나뉘면 절 번호를 다시 매기고 옛→새 대응표를 남기며, 편 안 호출과 다른 편이 부르는 곳을 함께 고친다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 일부
  enforce:
  - gate: V2
    level: 막음
  - gate: V12
    level: 막음
- id: W-030
  title: 문체를 되돌릴 때의 차례
  rule: 문체를 되돌릴 때는 바꾸기 전 문장을 먼저 되살리고, 그 뒤 손질된 문장의 끝맺음만 고치며 뜻·값·문장 수는 바꾸지 않는다.
  core:
  - 쉬운 말
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-031
  title: 편 코드가 바뀌기 전 기록은 옛 코드 그대로
  rule: 편 코드가 바뀌기 전에 쓴 기록(진행·일일로그·검증·대장·확인 목록)의 옛 코드는 고치지 않는다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: W-033
  title: 이 절만 읽고 판단할 수 있는가
  rule: 절마다 그 절만 읽고 그 판단을 내릴 수 있는지 보고, 모자라면 그 자리에서 보강한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 대기
  enforce: []
- id: W-033b
  title: 전문가 검토는 두 관점 — 지우면 안 되는 것·설명이 끊긴 곳
  rule: 줄이는 작업의 전문가 검토는 분야 전문가(지우면 안 되는 것)와 독자(설명이 끊긴 곳) 두 관점으로 한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 대기
  enforce: []
- id: W-034
  title: 옮길 때는 받는 자리에서 쓰는 것만
  rule: 내용을 옮길 때는 받는 자리에서 독자가 쓰는 것만 옮기고, 쓰이지 않는 것은 되살림 자료에만 남긴다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-035
  title: AI 전문가 검토는 실제 검토를 대신하지 않음
  rule: Claude 작업자의 전문가 관점 검토는 실제 전문가 검토를 대신하지 않으며, 그렇다고 작업을 멈추지 않고 실제 전문가·현장 검증은 발간 뒤 과제로 문서 한계에 밝힌다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 대기
  enforce: []
- id: W-039
  title: 수정 지시는 그 자리에서 시리즈 규칙으로
  rule: 사용자가 한 편에 내린 수정 지시는 그 편에 적용한 뒤 규칙 대장에 번호를 달아 올리고, 기계로 잡을 수 있으면 게이트 정본에 자기검사와 함께 세우며, 롤아웃 대장에 전 편 적용 행을 더한다. 과거 지시도 같다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-041
  title: 게이트가 실제로 대상을 보았는지 확인
  rule: 게이트는 대상 판을 환경변수로 고르고, 실제로 대상 파일을 읽었는지 확인한다. 대상을 하나도 읽지 못한 0건은 통과가 아니다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-042
  title: --apply 도구는 dry-run 먼저
  rule: 고치는 도구는 인자 없이 돌리면 dry-run 이며, 항상 dry-run 으로 범위를 본 뒤 적용한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-043
  title: 정규식·패치는 파일로 쓰고 자기검사
  rule: 일괄 치환 정규식과 소스 패치는 셸 히어독에 쓰지 않고 스크립트 파일로 저장해 돌리며, 채택 전에 잡을 것·잡지 않을 것을 넣어 자기검사한다. 한글 뒤에 단어 경계를 두지 않고, 소스를 고친 뒤에는 구문 검사를 한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-044
  title: 게이트 0 이 다 된 것이 아님
  rule: 게이트는 금지어가 있는지를, 리뷰는 그 말이 맞는지를 본다. 게이트가 0 이어도 전문가 리뷰를 거친다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-045
  title: 사람 눈으로 잡은 결함 유형은 게이트로 승격
  rule: 사람 눈으로 잡은 결함 유형은 게이트 정본에 기계 검사로 승격해야 닫히고, 검사를 못 만들면 절차 규정으로 남기며 둘 다 못 하면 「미해결」로 둔다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-046
  title: 지적은 원문·실측으로 다시 확인한 뒤 반영·보류·기각
  rule: 검토 보고를 그대로 받아 적지 않는다. 지적받은 자리를 하나씩 원문·실측으로 다시 확인한 뒤 반영하고, 범위 밖은 보류, 틀렸으면 기각하며 무엇을 어떻게 확인했는지 적는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-047
  title: 편 작업을 마치면 기록을 갱신
  rule: 편 작업을 마치면 의미 단위로 커밋하고, 편 진행 기록·레지스트리·진행 현황 집계·일일로그를 갱신하며, 발견한 도구 개선점은 도구 발견 대장에 한 줄로 올린다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-048
  title: 브리프·검토 기준에 판단 기준을 늘 넣음
  rule: 서브에이전트 브리프와 검토 기준에는 핵심 규칙 셋(네 원칙)·세 물음·한계 명시를 늘 넣는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-052
  title: 이미 규칙이 된 판단은 묻지 않고, 맞지 않는 경우는 묻는다
  rule: 이미 규칙이 된 판단은 사용자에게 다시 묻지 않는다. 규칙이 그 편에 맞지 않으면 편에서 바꾸지 말고 사용자에게 물어 규칙을 고친다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-053
  title: 재기획은 층마다 사용자 확인 뒤 다음 층(D1)
  rule: 편을 다시 기획·구성할 때 1층 골격 → 2층 절 설계 → 3층 원고 → 검토 차례를 밟고, 앞 층을 사용자가 확인하기 전에 뒤 층으로 넘어가지 않는다. 층 사이 승인에는 승인자·날짜를 남긴다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-054
  title: 1층 문서 골격에서 정할 것
  rule: 1층에서는 문서·부·장의 목표와 핵심 질문, 절 목록, 개념의 정의 자리(한 곳), 부 이름, 구조 표준, 용어 대장(핵심어·뜻·정의 자리·버린 동의어)을 정하고, 용어는 기준 편 확정 말과 맞춘다.
  core:
  - 품질
  - 일관성
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-055
  title: 2층 절 설계 — 목표·질문 대조와 웹 검토
  rule: 2층에서는 절마다 목표·핵심 질문·항 구성·결론을 정하고 「목표·질문 ↔ 지금 항」 대조표(맞음/항 재구성/절 합침/절 나눔/옮김)로 절을 다시 짠다. 초안은 작업자가 뽑되 절마다 지금/제안을 웹 검토 페이지로 보여 사용자가 수락·거절한 뒤 원고로 넘어간다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-056
  title: 3층 원고 — 설계대로, 새 사실 금지
  rule: 원고는 설계대로 다시 쓰고 새 사실·새 수치를 쓰지 않으며 값·REF 를 원문과 대조한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-057
  title: 검토 단계 차례
  rule: 재기획 원고의 검토는 게이트 전부 0 → 중복 검토·제거 → 표 읽어 주기·L 표기 → 편별 일관성(기준 편 확정 말) → 웹북 사용자 검토 차례로 한다.
  core:
  - 품질
  - 일관성
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-058
  title: 새 규칙은 전 편 적용까지 롤아웃 대장에서 추적
  rule: 새 규칙이 생기면 전 편에 적용될 때까지 롤아웃 대장에서 완료·진행·대기·해당 없음으로 추적하고, 수치는 게이트 위반 건수다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-060
  title: (v2.2) 편 하나를 적용하는 차례
  rule: 태그 → 렌더·게이트 기준선 → 문장 규칙 → 구조 규칙 → 잔여 → 렌더·웹북·게이트 0·대장 완료 → 기록 갱신·커밋 차례로 한 편을 적용한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-062
  title: 뜻이 달라질 수 있는 자리는 사용자가 봄
  rule: 다듬기로 뜻이 미세하게 달라질 수 있는 자리는 분야 관점으로 표시해 사용자가 본다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-063
  title: 문장 검토는 문장 단위 제안·기계 확인·수락분만
  rule: 문장 검토는 문장 단위 제안(old → new)·관점·까닭으로 내고, 원문 일치·숫자·REF 불변·제안 겹침 없음을 기계로 확인한 뒤 웹 검토 페이지에서 수락된 것만 반영한다. 독자가 먼저 읽는 자리를 먼저 본다.
  core:
  - 쉬운 말
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-067
  title: 결함 수정이 먼저, 가독성 보강은 뒤
  rule: 표·수식·도해가 깨져 있으면 결함 수정 절차를 먼저 하고, 내용은 멀쩡한데 읽기 어려우면 가독성 보강(구조 재배치)을 뒤에 한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-068
  title: 면제는 의례문만, 면제해도 무시각런은 지킴
  rule: 시각요소가 부자연스러운 의례문(발간사 등)만 시각요소 기준에서 면제하고 사유를 남기며, 면제해도 무시각런 상한은 지킨다. 본문 절·별첨은 면제하지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-069
  title: 정리 착수 전 스냅샷과 기준 검증
  rule: 정리 작업 착수 전에 커밋으로 스냅샷을 만들고 카드 검증 FAIL 0 을 확인하며 대상 현황을 파악한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-071
  title: 정리 검증 묶음과 로컬 서버 정리
  rule: 정리 뒤 카드 검증 FAIL 0·mermaid 파싱 실패 0·제어문자 0·판본 잔재 0·브라우저 실측을 통과하고, 띄운 로컬 서버는 끝나면 반드시 정리한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-073
  title: 개정 검증은 네 가지, 서로 대체되지 않음
  rule: 개정 검증은 ① 명세 일치 ② 규약 준수 ③ 무결성 ④ 회귀 없음을 보며, 넷은 서로 대체되지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-075
  title: 게이트 설정 규율 — 임계는 공통, 면제는 항목별
  rule: 통과시키려고 임계를 낮추지 않는다. 임계는 시리즈 공통으로 두고, 사전(잔재·폐기어·누출 등)과 면제는 편 설정 파일에 항목별로 사유와 함께 적으며, 게이트를 끄는 것도 그 파일로만 한다.
  core:
  - 일관성
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V1
    level: 막음
  - gate: V5
    level: 막음
- id: W-076
  title: 검증 4계층 — 카드 1건 검사를 건너뛰지 않음
  rule: 저장 직후·카드 1건 완료 직후·장 묶음·릴리스 전의 네 계층으로 검증하고, 가장 싼 카드 1건 검사를 건너뛰지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-077
  title: 공용 수정기를 검사기로 게이트에 물림
  rule: 공용 수정 스크립트는 기본 dry-run 이라 그대로 검사기로 쓰며, 표·링크·디자인 드리프트·mermaid 파싱 검사(T1~T8)를 게이트로 돌리고 「건너뜀」도 실패로 센다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-080
  title: 개정 명세서는 살아 있는 계약
  rule: 실제 카드 상태가 개정 명세서의 처분과 일치해야 하며, 옮길 것을 스크립트에 다시 적지 않고 명세서를 읽게 한다. 명세서가 틀렸으면 명세서를 고친다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V9
    level: 막음
- id: W-081
  title: 새 게이트는 위반 사례를 넣어 확인
  rule: 새 게이트를 만들면 일부러 위반 사례를 넣어 실제로 잡히는지 확인하고, 판정이 어려운 것은 실제로 고친 표현의 확정 목록으로 만든다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-082
  title: 카드 생성 호출 동시성 상한
  rule: '카드 생성·재작성 호출은 동시성 상한(값: tok.card_call_concurrency_max)을 넘지 않는다.'
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-085
  title: 검증용 임시 복사본은 저장소에 남기지 않음
  rule: 검증용 임시 복사본은 확인 뒤 지우고 무시 목록으로 막는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-087
  title: 구조를 지우는 치환은 매치 목록·불변량 확인
  rule: 캡션·표·펜스처럼 문서 뼈대를 지우는 치환은 적용 전에 매치 목록을 출력하고, 전후로 불변량(캡션 수 등)을 세어 달라지면 그 파일을 건너뛴다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-088
  title: 치환기는 mermaid 노드를 건드리지 않음
  rule: 식별자를 서술 참조로 바꾸는 치환기는 mermaid 노드 ID 를 건드리지 않게 가드를 두고, 도해 라벨에는 약칭만 쓴다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-091
  title: 캡션 표기는 통일부터 하고 센다
  rule: 캡션 표기가 갈려 있으면 한 꼴로 통일부터 하고 게이트로 센다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V6
    level: 막음
- id: W-095
  title: 공용 개정 도구는 정본 한 벌
  rule: 공용 개정 도구는 한 곳을 정본으로 두고 편에서 고쳤으면 거기로 올린다. 편에는 렌더·웹북·편집 도구와 일회성 교정기만 두고 특정 카드·REF 가 박힌 도구를 물려받지 않는다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-096
  title: 새 편에 절차서를 적용할 때
  rule: 새 편에 절차서를 적용할 때는 회귀 목록을 먼저 읽고, 그 편의 수정 커밋·일회성 수정기에서 회귀를 캐며, 수정기는 있는데 검사기가 없는 항목을 특히 찾는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-103
  title: 항 구성 보완은 제안만, 고른 것만 반영
  rule: 목표·결론 다시 쓰기와 달리 항 구성 보완(차례·나누기·합치기·빠진 설명)은 제안만 하고 사용자가 고른 것만 반영하며, 새 근거가 필요한 보강은 원고 밖 「조사 필요」 목록으로 둔다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-107
  title: 규칙 이탈은 편별 기획서에 표로
  rule: 어느 조항을 왜 벗어나는지 편별 기획서에 근거와 함께 표로 적는다. 적지 않은 이탈은 위반이며, 예외 사유는 「지키기 어려움」이 아니라 「그 조항이 이 편에서 상황을 나쁘게 함」이어야 한다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-108
  title: PowerPoint 에서 바꾼 장은 spec 에 되돌려 반영
  rule: 사용자가 PowerPoint 에서 장을 지우거나 옮기면 spec 에 되돌려 반영한다 — 반영하지 않으면 다음 빌드에서 되살아난다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-109
  title: 편별 템플릿·shape 이름 규약 폐지
  rule: 생성기가 레이아웃을 소유하므로 편별 template·레이아웃 마스터를 만들지 않고, shape 이름 규약과 그에 기댄 검사는 쓰지 않는다(검사는 spec 단계로).
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-110
  title: 도판은 공통 틀 + 편 데이터, 고유 부품은 공통 부품으로 먼저
  rule: 도판은 공통 틀과 편 데이터 YAML 로 찍고, 편 고유 부품이 필요하면 공통 부품으로 먼저 만든 뒤 그것으로 찍는다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-111
  title: 도판은 병렬 에이전트에게 맡기지 않는다
  rule: 도판은 조정자가 직접 만들거나 장마다 직접 검수한다 — 절별 병렬 에이전트 도판이 빈약해 대량 폐기한 사고가 근거다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-112
  title: 파생 덱은 전체본에서 만들고 같은 버전으로 동시에 빌드
  rule: 요약·교육용 덱은 손으로 따로 쓰지 않고 전체본 spec 에서 장을 골라 파생하며, 전체본과 같은 배포 버전으로 동시에 빌드한다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-114
  title: 덱에서 원고 오류를 고치지 않는다 — 원고 확인사항
  rule: 덱을 만들다 찾은 원고 오류는 덱에서 고치지 않고 편 덱 폴더 원고 확인사항에 적어 원고에서 고친 뒤 다시 빌드한다.
  core:
  - 품질
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-115
  title: 덱 디자인 검토 세 시점
  rule: 덱 디자인 검토는 시안(유형마다 한 장)·전량 빌드 뒤·배포 전 세 시점에 하며 앞의 둘을 건너뛰지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-116
  title: 덱 규칙은 기준 편에서 확정한 뒤 확장
  rule: 덱 규칙 판은 기준 편 전체본 첫 장까지 만들어 보고 확정하며, 그때 받은 지시는 조항으로 올려 이후 편에 적용한다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-117
  title: 디자인 검토 세 관점을 따로
  rule: 디자인 시스템·정보시각화·제작 실행성 세 관점을 각각 따로 돌린다 — 한 검토자가 겸하면 형식에 눈이 가 내용을 놓친다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-119
  title: 검토 기록 누적 → 되풀이되면 규칙 후보
  rule: 덱 디자인 검토의 지적·판정·근거를 편별 검토 기록에 누적하고, 같은 지적이 다음 편에서 되풀이되면 규칙 문서로 올릴 후보로 본다.
  core:
  - 품질
  - 일관성
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-120
  title: 같은 경고가 여러 편 되풀이되면 막음 또는 규칙 수정
  rule: '경고는 배포를 막지 않되 기록에 남기고, 같은 경고가 여러 편(값: tok.warning_promote_repeat)에서 되풀이되면 막음으로 올리거나 규칙을 고친다.'
  core:
  - 품질
  area: W
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: W-121
  title: 편별 지시서를 새로 쓰지 않고 절차서 하나
  rule: 덱 제작의 차례·함정·지시 틀은 제작 절차서 하나에 모으고, 뒤집힌 조항이 섞인 옛 편별 지시서는 새 편에서 읽지 않는다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-122
  title: 덱 설정은 본보기 복사
  rule: 덱 설정 파일은 본보기 편 것을 복사해 표지·파일 이름·spec·원고 경로만 고친다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-123
  title: 덱 원고 기준 스냅숏과 기준 커밋
  rule: 편 렌더 원고를 덱 폴더에 기준 원고로 복사하고 덱 설정에 원고 커밋을 적는다. 검사는 이 파일을 보며, 원고가 바뀌면 다시 떠서 어긋난 곳만 고친다.
  core:
  - 일관성
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-125
  title: PowerPoint 렌더는 장별로 하나씩
  rule: PowerPoint 렌더는 한 번에 하나만 하고, 큰 전체본은 메모리가 모자라므로 장별로 렌더한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-126
  title: 열린 출력 파일은 사용자에게 닫아 달라고 한다
  rule: 출력 PPTX 가 PowerPoint 에 열려 있으면 덮어쓰지 못하므로 사용자에게 닫아 달라고 한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-128
  title: YAML 흐름 목록 글의 쉼표·쌍점은 큰따옴표
  rule: 흐름 목록 안 글에 쉼표·쌍점·물음표나 숫자 쉼표가 있으면 큰따옴표로 감싼다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-129
  title: 덱 에이전트 지시에 넣을 것
  rule: 덱 장 에이전트 지시에는 절차서 경로·본보기 장·이해할 것 후보·앞 장 틀 한계·「다른 장 파일 금지」·끝 기준(검사 0·렌더 넘침 0·접촉 시트)·「커밋·일일로그는 조정자」를 넣는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-130
  title: 덱 에이전트 보고 꼴
  rule: 덱 에이전트 보고에는 장 수·항 대응, 틀 분포, 도판 글자 중앙값, 검사 결과, 표로 남긴 장과 까닭, 결론 띠를 고친 장, 틀 한계, 원고 확인사항 건수를 싣는다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-131
  title: 조정자는 접촉 시트를 직접 보고 새 값은 원고와 대조
  rule: 조정자는 장마다 접촉 시트를 직접 보고, 원고에 없는 새 값·새 결론·한정어는 원고와 대조한 뒤 커밋한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-132
  title: 덱 내용은 편이, 틀·도구는 통합 저장소가 소유
  rule: 덱 내용(spec·도판 데이터)은 각 편 덱 폴더가 소유하고, 틀·도구·규격은 통합 저장소 디자인 폴더에 둔다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-133
  title: 검사 미통과는 보고, 배포 빌드는 엄격 모드로 멈춤
  rule: 덱 빌드는 검사를 모두 돌려 미통과를 보고만 하고 이어 가며, 배포 빌드는 엄격 모드로 멈춘다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-134
  title: 다른 프로젝트 고유 규칙은 공통 도구로 옮기지 않는다
  rule: 공통 도구로 범용화할 때 원 프로젝트 고유 협의 규칙은 빼고 인자로 바꾼다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-135
  title: 프로젝트 문체·기밀 규칙이 스킬보다 앞섬
  rule: 프로젝트의 문체·기밀 규칙이 범용 스킬보다 앞서고, 원고가 기밀이면 외부 서비스에 올리지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-136
  title: 목적 진단과 시안 먼저
  rule: 원고 분량·독자·목적을 진단해 불분명하면 묻고, 유형별 시안을 먼저 보여 디자인·밀도를 확정한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-138
  title: 테마 글꼴 파일이 없으면 줄 계산이 틀어진다
  rule: 새 테마는 기본 테마를 복사해 고치고, 글꼴 파일이 있는지 환경 점검으로 확인한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-139
  title: 디자인 작업은 콘셉트 먼저, 결과물을 직접 보고, 반영을 기록
  rule: 표지·인쇄 디자인은 그리기 전에 콘셉트 문서(콘셉트·참고 기준·결정과 까닭)를 쓰고, 렌더 PNG·실제 크기 펼침면을 직접 열어 겹침·잘림·대비·여백을 본 뒤 고치며, 검토 지적마다 「고침 / 고치지 않음 + 이유」를 기록한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-140
  title: 표지 SVG 는 생성 스크립트로, 제목 길이에 견디게
  rule: 표지 SVG 는 생성 스크립트로 만들고 사실 파일의 제목을 읽어 줄 수에 따라 배치를 바꾸게 한다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-142
  title: 간격·겹침 주장은 렌더 픽셀로 잰 값만
  rule: 콘셉트 문서의 「겹침 없음」·간격 같은 주장은 렌더 픽셀로 잰 값만 적는다 — 어림값은 검토에서 뒤집혔다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-143
  title: 검토자는 만든 사람이 아니고, 설명보다 결과물을 먼저 본다
  rule: 디자인 검토자는 만든 사람이 아니며, 작성자 설명(concept)을 읽기 전에 결과물(렌더·실제 크기 펼침면)·원고·브리프만 보고 먼저 채점한 뒤 설명과 실제가 맞는지 덧붙인다. 축소 접촉 시트만으로 판정하지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-144
  title: 디자인 검토 통과 기준
  rule: '평균이 기준(값: tok.review_pass_mean) 이상이고 하한(값: tok.review_item_floor) 이하 항목이 없으면 통과, 그 밖은 수정 필요이며 고칠 것을 무엇을·어디서·어떻게 우선순위 순으로 적는다. 내용·사실 오류는 점수와 무관하게 수정 필요다.'
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-145
  title: 디자인 검토 결과 기록 꼴
  rule: 검토 결과는 회차마다 점수표·평균·판정·수정 목록·「설명과 실제」 한 단락·잘된 점 둘로 남긴다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-146
  title: 인쇄 디자이너가 고치는 곳은 정해진 파일만
  rule: 인쇄 디자인은 인쇄 CSS·쪽 머리 설정·앞뒤 붙이 구조 함수만 고치고, 쪽 지도·빈 면·찍기 함수와 편 웹북 CSS·편 저장소·원고는 건드리지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-147
  title: 기준 편으로 시작해 성격이 다른 편에서 깨지지 않는지
  rule: 인쇄 디자인 묶음은 기준 편으로 빠르게 확인하고, 통과 직전 성격이 다른 견본 편(표·도형 최다·장 없는 대형·여러 권·찾아보기)에서 깨지지 않는지 본다. 큰 빌드는 하나씩 돌린다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-152
  title: 원고 확정을 기다리지 않는다
  rule: 산출 단계의 끝은 내용 확정이 아니라 파이프라인 완성이며, 언제든 그 시점 원고로 다시 만든다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-153
  title: 배포는 그 시점의 스냅샷
  rule: 배포할 때 그 시점 편 원고 커밋을 고정(목록)하고 그것으로 전부 만들며, 그 뒤 바뀐 원고는 다음 배포에 들어간다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-154
  title: 다시 만드는 방식은 비용에 따라
  rule: 자동으로 만드는 웹북·PDF 는 배포마다 전부 다시 만들고, 사람 손이 드는 덱은 바뀐 항의 장만 고친다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-155
  title: 항 단위 원고 변경 감지
  rule: 원고를 항 단위(식별자·제목·원문 해시)로 찍어 두 시점을 비교해 추가·삭제·수정·이동을 내고, 배포 보고·덱 영향·교육용 근거 대조가 모두 이것을 쓴다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 대기
  enforce: []
- id: W-156
  title: 사람 손이 간 산출물은 기준 원고를 적고 배포 때 보고
  rule: 덱마다 기준 원고 커밋을 적고, 배포 때 그 뒤 바뀐 항과 장 목록을 보고해 사용자가 「고치고 배포 / 그대로 싣기」를 정한다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-157
  title: 통합 쪽은 편 원고·편 웹북을 고치지 않는다
  rule: 편 웹북이 원고보다 오래됐으면 통합 쪽은 알리기만 하고 재빌드는 그 편 세션이 한다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-158
  title: 산출물 순서 — 웹북 → PDF → 발표자료
  rule: PDF 는 웹북 HTML 을 읽고 덱은 원고 본문을 동결점으로 삼으므로 웹북 → PDF → 발표자료 순으로 완성한다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-159
  title: 덱은 편 하나씩, 장 단위로 차례대로
  rule: 덱은 여러 편을 한꺼번에 만들지 않고 한 편을 끝까지 마친 뒤 다음 편으로 가며, 편 안에서도 한 에이전트가 한 장(章)을 차례대로 맡는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-160
  title: 덱 착수 조건 — 구조가 서 있으면 착수
  rule: 덱은 내용 규칙 완료를 기다리지 않고, 구조(장·절·항 목록)가 진행 중인 개편 없이 서 있으면 착수하며 이후 내용 수정은 영향 보고로 따라간다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-161
  title: 배포 버전은 한 파일에서 — 모든 산출물이 읽는다
  rule: 웹북·PDF·덱·표지는 한 파일(release.yaml)의 같은 배포 버전을 읽어 다시 만들며, 번호를 손으로 박지 않는다. 버전을 올릴 때는 그 파일만 고친다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-162
  title: 배포 번호 — draft → rc → released
  rule: 작성 중 vX.Y-draft(시험 빌드만) → 배포 후보 vX.Y-rcN(검토에 넘길 때마다 +1) → 확정 vX.Y(release 폴더·ZIP·태그) → 오탈자 vX.Y.Z · 내용 보강 vX.(Y+1).
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-163
  title: 덱 단건 수정은 번호를 올리지 않는다
  rule: 편별 덱 수정은 커밋으로만 남기고, 시리즈 번호는 묶음 전체를 다시 낼 때만 올린다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-164
  title: 배포 번호와 원고 판을 가르고 태그 이름도 가른다
  rule: 배포 번호는 스냅샷 이름이고 편별 원고 판은 각 편 변경 이력이 소유한다. 태그는 통합 저장소 vX.Y, 편 저장소 series-vX.Y 로 원고 판 태그와 겹치지 않게 한다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-165
  title: 표지에서 편별 원고 판 표기를 뺀다
  rule: 앞표지·PDF 에는 배포 번호만 싣고 편별 원고 판 표기는 표지에서 뺀다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-166
  title: 배포 묶음 — 웹북 ZIP + 판 폴더
  rule: 배포는 웹북 ZIP 과 판 폴더(PDF·덱 PPTX+PDF)로 내고 포털 카드에 내려받기 링크를 둔다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-168
  title: 각 편의 독립성을 깨지 않는다
  rule: 통합 웹북은 포털 + 편 개별 유지이며, 각 편은 단독 빌드·단독 배포가 계속 가능해야 하고 포털은 그 위에 얹히기만 한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-172
  title: 낡은 산출물은 수집하지 않는다
  rule: 카드가 웹북보다 새것이거나 디자인 드리프트·변경이력 불일치가 있는 편은 자동 수집을 막고, 통과한 편만 수집해 수집 원장(편별 판·해시)을 남긴다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 대기
  enforce: []
- id: W-173
  title: 정책 문서를 한 곳으로, 정책 지도와 문서 검사기
  rule: 시리즈 전용 정책을 정책 폴더로 옮기고 원위치엔 포인터 한 줄을 두며, 정책 지도와 문서 검사기를 둔다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 대기
  enforce: []
- id: W-174
  title: 통합 도구 저장소는 편을 대신하지 않는다
  rule: 통합 도구 저장소는 저작물이 아니라 포털·디자인 원본·배포·횡단 도구만 맡고 카드·조사·본문 작업을 하지 않는다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-176
  title: 공유 템플릿을 쓰면 정체성 값을 덮어쓴다
  rule: 공유 템플릿을 쓰는 포털은 편 정체성 값(ID·색·약칭·시리즈 바)을 덮어써 특정 편의 정체성을 물려받지 않게 한다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-177
  title: Windows 경로 길이 한계 대비
  rule: 상대경로는 resolve() 한 뒤 exists() 를 묻고, ZIP 은 긴 경로에 풀면 실패할 수 있음을 고려한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-178
  title: git add -u 는 경로를 따로
  rule: git add -u 는 경로 중 하나라도 추적 파일이 없으면 전부 실패하므로 여러 경로를 한 번에 넘기지 않고 따로 add 한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-179
  title: 조립 도중 편 재빌드 — 실패로 잡고 다시 돌린다
  rule: 개정판 폴더가 있는데 옛 판으로 내려오거나 조립 앞뒤 편 웹북이 다르면 실패로 잡고, 편 재빌드가 끝난 뒤 다시 돌린다. 손으로 고치지 않는다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-180
  title: 개정판 판정·폴백은 한 곳만
  rule: 개정판 폴더가 있으면 그것을 보고 없는 편만 옛 판으로 내려오며, 판정과 폴백은 한 모듈만 안다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-181
  title: 링크형은 배포 불가, 복사형이 배포용
  rule: 링크형 포털은 형제 원본을 상대경로로 가리켜 배포할 수 없고 포털→편 단방향이며, 양방향·배포가 필요하면 각 편 폴더가 자족적인 복사형을 쓴다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-182
  title: PDF 파일 이름 규칙
  rule: 편별 PDF 는 <ID>_<약칭>_<본문|별첨>_<버전>.pdf 로 내고 앞표지는 개정판 표지를 쓴다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-185
  title: 앞표지 SVG 를 고치면 렌더를 먼저
  rule: 포털 썸네일은 렌더한 표지 PNG 를 쓰므로 앞표지 SVG 를 고치면 그 편 렌더를 먼저 돌린다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-186
  title: 점검 방법 A·B·C 의 통과 기준
  rule: 자동 게이트(A)는 0 이어야 다음 단계로 가고, 전문가 검토(B)는 통과·실패를 가르지 않고 제안마다 결정하며, 결과물 실측(C)은 설정값을 믿지 않고 렌더를 캡처해 결함 0 을 본다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-187
  title: 전문가 검토 관점별 담당 영역
  rule: 분야(Q1·Q2·Q3)·현장(Q2·Q5)·정책·사업(Q2)·문장(Q5·Q4)·디자인(Q9·Q7·Q8)·일관성(Q3·Q4 편 사이)으로 관점을 나눠 따로 읽게 한다.
  core:
  - 품질
  - 일관성
  - 쉬운 말
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-188
  title: '편 하나의 점검 시점(값: tok.qc_points)'
  rule: 골격 확인 → 절 설계 확인 → 원고 직후 게이트 0 → 웹북 뒤 검토+실측 → 사용자 검토 → 차수 끝 편 사이 → 시리즈 마무리 전 전체 → PDF 뒤 → 발표자료 뒤 차례로 점검한다.
  core:
  - 품질
  - 일관성
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-189
  title: 결함 분류·재점검·승격
  rule: '결함을 등급(값: D2 결정 — 지금 막음/고침/제안)으로 나누고, 고친 뒤 같은 방법으로 다시 점검하며, 기계로 잡히면 게이트로 올리고 다른 문서에도 쓰일 유형이면 도구 발견 대장에 한 줄 올린다.'
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-190
  title: 점검 기록 꼴과 대장 생성
  rule: 편마다 점검 기록을 시점·날짜 이름의 JSON 하나에 정해진 꼴로 남기고, 시리즈 대장은 편별 기록에서 스크립트로 만들며 손으로 고치지 않는다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-192
  title: 규칙 항목의 꼴
  rule: 규칙 항목은 번호·제목·내용·범위·게이트·근거·날짜를 갖는 꼴로, 일반 규칙 묶음과 프로젝트 규칙 묶음으로 나눠 둔다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-193
  title: 도구 개선은 별도 세션, 본 작업을 멈추지 않는다
  rule: 도구(플러그인) 수정은 별도 세션에서 하고 자식 프로젝트 세션은 발견·정리까지만 하며, 원고 작업을 멈추지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-195
  title: 발표자료 생성기는 전역 스킬, 토큰만 공유
  rule: 덱은 기술 문서 밖에서도 쓰이므로 생성기는 전역 스킬로 두고 디자인 토큰만 공유한다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 대기
  enforce: []
- id: W-197
  title: 발견은 한 줄 기록, 본문 작업을 막지 않는다
  rule: 작업 중 발견한 도구 개선 후보는 발견 대장에 프로젝트 태그를 단 한 줄로만 적고, 작업 흐름에 도구 수정을 끼워 넣지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-198
  title: 발견 대장은 유일 정본, 상태는 스크립트가 표시
  rule: 발견 대장이 finding 상태의 유일 정본이고, 상태는 손으로 고치지 않고 릴리스 세션 마지막에 동기화 스크립트가 변경 기록 표시를 읽어 고친다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-199
  title: 자식 세션 시작 게이트 — 발견 대장 동기화 검사
  rule: 자식 세션은 도구 갱신 뒤 발견 대장 동기화 검사를 돌려 FAIL 이면 본문 작업을 막고, 큰 변경이 들어오면 기존 산출물 호환을 카드 검증으로 먼저 확인한다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 일부
  enforce: []
- id: W-200
  title: Windows 에서 파이썬 출력 인코딩을 utf-8 로
  rule: Windows 콘솔에서 한국어 출력이 깨지지 않게 파이썬 명령에는 PYTHONIOENCODING=utf-8 을 늘 지정한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-201
  title: 도구 갱신은 사용자 승인 후
  rule: 도구 갱신은 백업·롤백이 없으므로 확인 모드로 본 뒤 사용자 승인을 받고 적용한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-202
  title: fixture 적출은 데이터모델·스키마 사안만
  rule: 발견을 도구 회귀 시험 자료로 적출하는 것은 데이터모델·스키마 사안에만 한다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-205
  title: 정규판 원고 동결 — 수정 요청은 다음 판 목록으로
  rule: 정규판 원고는 동결하고 원고 수정 요청은 다음 판 수정요청 목록으로 모으며, 인쇄본·덱은 동결 원고에 맞춘다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-206
  title: 태그는 판 산출물이 다 들어온 뒤 한 번
  rule: 배포는 웹북 먼저, PDF·덱은 차례로 판 폴더에 더하고 태그는 다 들어온 뒤 한 번만 단다.
  core:
  - 일관성
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-207
  title: 중간판 정리는 목록을 다시 재 사용자에게 보인 뒤
  rule: 정규판 확정 뒤 이전 중간판·관련 파일 정리는 정리 목록을 실행 직전에 다시 재고 사용자에게 보인 뒤 지운다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 대기
  enforce: []
- id: W-208
  title: 인쇄 디자인 나머지 묶음은 검토 통과로 조정자가 확정(위임)
  rule: 사용자가 앞 묶음(D4·D3)을 확정한 뒤, 같은 절차의 나머지 묶음(D1·D2·D5·표지 보완)은 독립 검토 통과와 조정자의 펼침면 확인으로 확정하며 확인 질문을 하지 않는다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-209
  title: 멈춘 창 없는 PowerPoint 는 묻지 않고 끄고 다시 렌더
  rule: 렌더 검사가 띄운 창 제목 없는 PowerPoint 가 닫는 단계에서 멈추면 그 프로세스만 끄고 다시 렌더하며, 창 제목이 있는 PowerPoint(사용자 문서)는 끄지 않는다. 에이전트는 PID 를 보고하고 조정자가 끈다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: W-210
  title: 덱 콘티를 만들지 않는다
  rule: 발표자료는 콘티 파일·콘티 조각 에이전트·합치기를 건너뛰고, 장 에이전트가 원고 항을 직접 읽어 틀·도판·문장을 정하며, 고정 아이콘·정본 그림·약어 방침·틀 분포 상한은 편 장 노트에 짧게 둔다.
  core:
  - 품질
  area: W
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q1-078
  title: 문서가 스스로 내놓는 제안은 싣지 않는다
  rule: 공공 설계 제안·로드맵·기간 전망·미정 협력 후보·정책 권고처럼 문서가 스스로 내놓는 제안은 지운다. 회사·기관·지자체가 공식 발표한 목표·계획은 「발표 주체·연도」를 붙여 남긴다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 보류
  enforce: []
- id: Q6-095
  title: 편은 여러 권으로 나눌 수 있다
  rule: 한 편을 여러 권으로 나눌 수 있다. 권은 개요·부·장·절·별첨·부록을 저마다 갖추고, 편 수·0.3 표·표지 그림과 색은 편 단위다 — 권은 같은 그림·같은 편 색을 쓰고, 크게 쓴 권 번호와 권 이름으로 가른다. 권 사이 부르기는 「제Ⅲ권 1.2」 꼴로 쓴다.
  core:
  - 품질
  - 일관성
  area: Q6
  layer: 본체
  status: 보류
  enforce: []
- id: Q8-091
  title: 정식판 PDF는 원본과 배포본 두 벌로 낸다(TechDoc 모든 문서)
  rule: TechDoc 플러그인으로 만드는 모든 문서(편·시리즈·분야를 가리지 않음)의 정식판 PDF는 원본과 배포본을 따로 만든다. 원본은 빌드가 내놓은 그대로의 보관본이다 — 보호를 걸지 않고, 고침과 다음 판의 출발점으로 쓰며, 밖으로 내보내지 않는다. 배포본은 원본에서 만들고 내용(쪽 수·책갈피·링크)은 원본과 같다. 배포본에는 권한 암호를 걸어 편집·글 복사·주석과 양식 고치기·쪽 조립을 막고, 인쇄(고품질)는 허용한다. 열기 암호는 걸지 않고, 화면 낭독기를 위한 글 읽기(접근성 추출)는 허용한다. 두 벌은 그 문서 배포 폴더 아래 원본/·배포본/ 으로 나눈다. 밖으로 내보내는 묶음(ZIP)에는 배포본만 넣는다. 워터마크는 기본으로 넣지 않는다 — 사용자가 요청한 판에만 배포본에 넣는다(문구·자리는 요청 때 정함). 권한 암호는 원고·저장소·배포 기록에 적지 않는다.
  core:
