# 본체 규칙 묶음(공개판) — 생성물, 손으로 고치지 않는다 (v1.11-c, E15).
# 시리즈 규칙 대장의 본체 규칙에서 문서 종류·분야·시리즈 관례를 아래 층으로 옮기고
# 분야 낱말을 걷은 플러그인 판 문구(edition)로 냈다. 생성: scripts.bundle_split --public-map
- id: P-002
  title: 중복성 배제 — 품질의 한 갈래
  rule: 같은 내용은 정의 자리 한 곳에만 두고 나머지는 부른다. 절 안에서 같은 말을 하는 문단·상자·표·그림과 대상·문서마다 되풀이되는 틀을 걷는다.
  core:
  - 품질
  area: P
  layer: 본체
  status: 알 수 없음
  enforce: []
  edition: 플러그인 판 문구
- id: P-003
  title: 일관성 유지 — 한 말 한 뜻, 같은 것은 같은 이름·꼴·값
  rule: 한 말에는 한 뜻을, 같은 것에는 같은 이름·꼴·값을 문서 안·문서 사이·출력물 사이에서 맞춘다.
  core:
  - 일관성
  area: P
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: P-004
  title: 품질 우선 — 판단에 필요한 설명은 쪽수보다 앞섬
  rule: 판단에 필요한 설명과 근거는 그 자리에서 완결되게 남기고, 쪽수 목표를 넘더라도 지킨다. 줄이는 것은 되풀이뿐이며 다른 문서 안내로 설명을 대신하지 않는다.
  core:
  - 품질
  area: P
  layer: 본체
  status: 알 수 없음
  enforce: []
  edition: 플러그인 판 문구
- id: P-005
  title: 쉬운 말 — 흔한 말로 뜻이 분명하게
  rule: 일반적으로 쓰는 말로 뜻이 분명하고 읽기 쉽게 쓴다. 번역투·외국식 표현을 쓰지 않고, 전문 용어는 분야에서 실제로 쓰는 말을 첫 자리에서 풀이한다.
  core:
  - 쉬운 말
  area: P
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V35
    level: 막음
- id: P-006
  title: 필요한 것만 넣는다
  rule: 독자가 그 자리에서 쓰지 않는 내용(형식을 채우는 규범 설명·일반론·나열)은 부족해 보여도 넣지 않고 되살림 자료에만 남긴다. 「값·REF 손실 0」은 쓰는 값이 사라지지 않게 하라는 뜻이다.
  core:
  - 품질
  area: P
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: P-010
  title: 핵심 규칙 셋과 순위 — 부딪히면 품질
  rule: 모든 문서는 품질(중복성 배제 포함)·일관성·쉬운 말 셋을 지킨다. 셋이 부딪히면 품질이 앞서고, 되풀이를 걷어 설명이 끊기거나 이름을 맞춰 뜻이 틀어지면 하지 않고 사용자에게 묻는다.
  core:
  - 품질
  - 일관성
  - 쉬운 말
  area: P
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: P-014
  title: 확산은 글이 아니라 코드로
  rule: 규칙·값을 여러 곳에 퍼뜨릴 때는 문서 안내가 아니라 생성·동기화 스크립트로 한다.
  core:
  - 일관성
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-015
  title: 검사는 산출물의 마지막 형태에서 한다
  rule: 검사는 조립 전 중간물이 아니라 표지까지 붙인 최종 산출물에서 다시 잰다.
  core:
  - 품질
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-016
  title: 품질점검은 영역 × 방법 × 시점, 한 항목 한 자리
  rule: 품질점검은 무엇을(영역 Q1~Q9) × 어떻게(방법 A·B·C) × 언제(시점) 세 축으로 짜고, 한 항목은 세 축 위에 한 자리만 갖는다.
  core:
  - 품질
  - 일관성
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-017b
  title: 한계는 밝히고 나아간다
  rule: 근거·검증이 모자란 자리는 감추지 않고 문서의 「한계」에 밝힌 채 나아가며, 검증은 판을 거듭하며 쌓는다.
  core:
  - 품질
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-018
  title: 기계로 잡을 것은 게이트, 판단은 검토, 화면 전용은 실측
  rule: 기계로 잡을 수 있는 것은 게이트로, 사람의 판단이 필요한 것은 전문가 검토로, 화면·PDF 에서만 보이는 것은 결과물 실측으로 잡는다.
  core:
  - 품질
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-019
  title: 자산은 네 층 — 본체·문서 종류·분야·시리즈
  rule: 규칙·도구 자산을 본체 / 문서 종류 / 분야 / 시리즈의 네 층으로 나눈다.
  core:
  - 일관성
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-020
  title: 일반과 특수를 가르고 본체가 묶음을 읽는다
  rule: 모든 기술 문서에 맞는 것은 본체로, 특정 시리즈에만 맞는 값(대표 사례·편 코드·표지 값)은 프로젝트 묶음으로 두고 본체가 그 묶음을 읽어 쓴다.
  core:
  - 일관성
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
  edition: 플러그인 판 문구
- id: P-021
  title: 규칙은 데이터로, 검사는 규칙 번호를 단다
  rule: 규칙은 사람이 읽는 문서이면서 기계가 읽는 목록(번호·적용 범위·게이트·근거)이어야 하고, 게이트는 규칙 번호를 단다.
  core:
  - 일관성
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-022
  title: 한 자산, 한 자리
  rule: 같은 기준이 문서·스크립트·프롬프트에 따로 쓰여 있으면 하나를 정본으로 하고 나머지는 거기서 만든다.
  core:
  - 일관성
  area: P
  layer: 본체
  status: 적용됨
  enforce: []
- id: P-023
  title: 확정된 판단을 회귀 시험 자료로
  rule: 원고·게이트 결과·사용자 결정을 시험 자료로 삼아, 도구를 고쳐도 이미 확정된 판단이 깨지지 않게 한다.
  core:
  - 품질
  - 일관성
  area: P
  layer: 본체
  status: 대기
  enforce: []
- id: Q1-001
  title: 개정 때 쓰는 값·출처는 잃지 않음
  rule: 고칠 때 쓰는 근거·수치·출처는 하나도 잃지 않는다(값·REF 손실 0). 지우는 것은 되풀이와 쓰지 않는 내용뿐이며, 그때도 값·REF 가 문서 어딘가에 남는지 대조한다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: REV-preserve_baseline
    level: 기록만
- id: Q1-002
  title: 요약은 본문에 없는 것을 말하지 않음
  rule: 요약·결론은 본문에 없는 이름·수치를 말하지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V14
    level: 막음
  - gate: V57
    level: 막음
- id: Q1-003
  title: 죽은 참조·고아 REF 0
  rule: 죽은 상호참조 0, 고아 REF 0, 인용됐는데 목록에 없는 REF 0.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V2
    level: 막음
  - gate: V8
    level: 막음
  - gate: V30
    level: 막음
- id: Q1-004
  title: 백과사전을 원전 자리에 두지 않음
  rule: 백과사전·위키는 원전 자리에 두지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V13
    level: 막음
- id: Q1-005
  title: 같은 문헌의 중복 등록은 병합
  rule: 같은 문헌을 두 ID 로 등록했으면 하나로 합친다.
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V13
    level: 막음
- id: Q1-006
  title: 출처를 지어내지 않음
  rule: 참고문헌 항목(REF)과 서지를 지어내지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q1-007
  title: 순서형 척도는 평균 내지 않음
  rule: 순서형 척도(BBCH 등)는 등간이 아니므로 평균 내지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q1-008
  title: R²·정확도에는 조건 라벨
  rule: R²·정확도 같은 성능 값은 대상·시기·모형에 따라 달라지므로 조건 라벨을 붙인다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce: []
  edition: 플러그인 판 문구
- id: Q1-009
  title: 계통오차는 융합으로 줄지 않음
  rule: 여러 자료를 융합해 줄어드는 것은 우연오차이며 계통오차(편의)는 줄지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q1-010
  title: 등급·수준은 우열이 아니라 목적별 적정
  rule: 적합성 등급·도입 수준처럼 높을수록 좋다고 읽히기 쉬운 척도는 우열이 아니라 목적에 맞는 수준으로 쓴다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q1-011
  title: 절에는 사례가 하나 이상
  rule: 절마다 수치·조건값·판정 결과 가운데 하나 이상의 사례를 둔다.
  core: &id001
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V32
    level: 막음
- id: Q1-011b
  title: 사례가 없는 절은 「(자료 보완 필요)」
  rule: 사례(수치·조건값·판정 결과)를 구하지 못한 절은 「(자료 보완 필요)」로 적는다.
  core: *id001
  area: Q1
  layer: 본체
  status: 일부
  enforce: []
- id: Q1-020
  title: 성과는 같은 해 대조와의 차이
  rule: 성과는 같은 해 대조와의 차이로 보고, 도입 전후 단순 비교는 해 효과가 섞인다는 표지 없이 쓰지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-022
  title: 근거가 없는 내용은 싣지 않음
  rule: 수치·성과·사실 주장은 달린 출처가 실제로 뒷받침할 때만 싣고, 그렇지 않은 값·일반론 수치·근거 없는 전망은 지운다. 「확인되지 않았다」로 바꿔 남기거나 새 사실로 메우지 않는다(교과서로 검증되는 절차·원리는 둔다).
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-claim_screen
    level: 기록만
- id: Q1-023
  title: 원 자료를 찾지 못한 값은 뺀다
  rule: 원문·1차 자료를 찾지 못하고 2차 인용에서만 확인되는 값·주장은 지운다. 웹이 막혀 확인 못 한 것도 찾지 못한 것으로 보되, 대조하지 않은 범위는 지우지 않고 대장에 밝힌다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-claim_screen
    level: 기록만
- id: Q1-024
  title: 언론 기사에만 있는 값은 지움
  rule: 1차 자료는 기관·기업이 직접 낸 원문이며(보도자료 전문 재게재본 포함), 언론 기사에만 있는 값은 1차 자료로 바꾸거나 지운다. 본문에 「보도 기준」 표기를 남기지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-025
  title: 초록만으로 대조한 값
  rule: 초록에 값이 그대로 있으면 인정하고 근거 상자에 「초록 확인」이라 적으며, 초록에 없으면 원문 미확인으로 보아 지운다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-028
  title: 값에는 산출 근거(계산·인용·가정)를 붙임
  rule: 값에는 어떻게 얻었는지를 본문과 구분해 붙인다 — 계산값은 수식(계산 차례·단위 환산·반올림), 인용값은 근거(출처·기준 연도·대상·분모·방법), 정한 값은 가정(값과 까닭).
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-029
  title: 상자에는 확인한 것만
  rule: 상자에는 확인한 것만 쓴다. 확인 못 한 분모·연도는 「○○」로 두지 않고 빼며, 출처와 어긋난 값은 고치고 검산이 어긋나면 출처 정의를 확인하거나 계산값을 수식 상자로 보이고 본문 값을 뺀다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-claim_screen
    level: 기록만
- id: Q1-030
  title: 원문 대조는 반드시
  rule: 근거 상자는 원문(보고서·논문·통계·법령 또는 출판사·DOI·기관 저장소 공식 사본)을 열어 확인한 값에만 달고 KeyRef 요약·2차 기사·검색 요약만으로 달지 않는다. 막히면 DOI·출판사·PMC·저장소·웹 보관본·저자 사본을 차례로 찾고, 끝내 못 열면 Q1-031 을 따른다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-claim_screen
    level: 기록만
- id: Q1-031
  title: 원문 미확인 남기는 값은 「작업 가정」
  rule: 원문을 확인하지 못했지만 남기는 값은 문서가 판단·계산을 위해 정한 값으로 쓰고(「~로 둔다」), 첫 등장에 가정 상자(값·단위, 까닭, 미확인 사실과 찾은 범위, 바뀌면 달라지는 것, 바꾸는 절차)를 둔다. 인용 번호는 뒷받침 출처로 달지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-claim_screen
    level: 기록만
  edition: 플러그인 판 문구
- id: Q1-032
  title: 가정이 판단 기준에 들면 표에도 표시
  rule: 가정이 표준표·규칙·임계값에 들어가면 그 표·규칙에도 「작업 가정」 표시를 달고, 까닭을 하나도 댈 수 없는 값은 지운다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-033
  title: 작업 가정은 판단·계산 값만
  rule: 작업 가정은 판단·계산에 쓰는 값만 둔다. 원문을 못 연 남의 연구·실험·통계 결과값은 가정으로 돌리지 않고 지우며 그 칸은 확인한 다른 값으로 채우거나 비운다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-034
  title: 건강하지 않은 출처의 값은 지움
  rule: 주제가 다른 자료, 원 연구를 밝히지 않은 2차 수치, 실체를 확인할 수 없는 출처, 원문과 다른 뜻으로 옮긴 출처에만 기댄 값·주장·그림은 지운다(건강한 다른 출처가 있으면 옮김). 끊긴 KeyRef 는 _pruned_keyref/ 로, 까닭은 대장에 남기고 작업 가정으로 돌리지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-claim_screen
    level: 기록만
- id: Q1-035
  title: 별첨 도구 값은 본문 근거만
  rule: 도구의 값과 항목은 본문에 근거가 있는 것만 쓰고 별첨에서 새 값을 만들지 않으며, 근거 값이 없는 칸은 「현장 기입」으로 비우고 「본문 보강 필요」로 넘긴다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q1-036
  title: 내부 작업 파일을 인용하지 않음
  rule: 프로젝트 기획·목차·다른 문서의 작업 파일을 참고문헌으로 인용하지 않는다. 고칠 때 KeyRef 는 _pruned_keyref/ 로 옮기고 인용 표시만 지우며 문장은 남긴다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 일부
  enforce:
  - gate: V68
    level: 막음
  edition: 플러그인 판 문구
- id: Q1-037
  title: 지은이 자리표시 금지, 서지는 원문대로
  rule: 지은이 자리표시(「et al.」만·지어낸 지은이·「Various」·빈칸)를 쓰지 않고 원문(DOI·출판사·Crossref)에서 지은이 전원과 실제 학술지·출판사를 확인해 참고문헌 양식(tok.ref.style)대로 적는다. 자리표시가 있던 항목은 다른 서지 값도 원문으로 대조한다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 일부
  enforce:
  - gate: V68
    level: 막음
- id: Q1-039
  title: 다시 쓰기에서 새 사실·새 수치 금지
  rule: 원고를 다시 짜거나 다듬을 때(3층 원고·표현 다듬기·검토 반영) 새 사실·새 수치를 넣지 않고 앞 판과 같은 값·REF 로만 엮는다. 바뀐 절의 목표·결론은 다시 쓴다.
  core: &id002
  - 품질
  area: Q1
  layer: 본체
  status: 일부
  enforce:
  - gate: REV-check_expert_sugg
    level: 막음
- id: Q1-040
  title: 국내 근거가 없으면 국외 값을 밝혀 씀
  rule: 국내 근거가 없는 값은 출처가 확인된 국외 값을 쓰고 그 사실을 그 자리에 밝힌다. 가정한 값은 가정이라 밝히고 근거를 달며, 지어내거나 자리표시를 두지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 대기
  enforce: []
- id: Q1-047
  title: 이미지는 라이선스 대장에 행이 있어야
  rule: 모든 이미지는 라이선스 대장에 행이 있어야 하며, 새 이미지는 자체 제작 SVG 를 기본으로 허용 라이선스 유형(값 tok.license.kogl_types)만 쓴다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V7
    level: 막음
  edition: 플러그인 판 문구
- id: Q1-049
  title: 연계 문장은 원문장의 내용을 옮겨 담음
  rule: 도표를 번호로 부르는 연계 문장을 쓸 때 앞 문장을 갈아 끼우지 말고 원문장의 내용을 옮겨 담는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q1-050
  title: 제사는 출처가 확인되는 글만
  rule: 명언은 지은이가 잘못 붙은 것이 많으므로 원전(책·연설·편지, 연도, 쪽)을 확인해 대장에 남기고 확인 못 한 글은 쓰지 않는다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 일부
  enforce: []
- id: Q1-051
  title: 제사의 저작권과 번역자 표시
  rule: 제사는 지은이 사후 공유 저작물(tok.copyright.public_domain_years)을 먼저 쓰고 현대 저자의 짧은 인용은 출판 단계에서 허락을 본다. 기존 번역본은 번역자를 밝히고 직접 옮기면 「(엮은이 옮김)」.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 일부
  enforce: []
- id: Q1-065
  title: 수치 대조는 붙은 꼴로 통과시키지 않는다
  rule: 수치 대조는 원고의 공백을 지우지 않고(천 단위 쉼표만 걷음) 숫자로 끝나는 말 바로 뒤 숫자도 찾되 붙은 꼴(「0.595」)로는 통과시키지 않는다. 「12 %」와 「12%」는 같은 값이다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 적용됨
  enforce:
  - gate: DECK-fignums
    level: 막음
- id: Q1-072
  title: 그림의 비례는 원고 수치에 맞춘다
  rule: 그림 면적·폭·길이가 원고 예시와 다르면 원고의 우선순위가 그림에서 뒤집히므로 원고 수치에 비례를 맞춘다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q1-074b
  title: 웹 전용 문구는 인쇄 처리에서만 바꿈
  rule: 웹 전용 문구(클릭·내려받기·검색)는 원고·웹북을 고치지 않고 인쇄 처리(build_pdf)에서 화면 동사만 바꾼다.
  core:
  - 품질
  - 일관성
  area: Q1
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q1-077
  title: 점검 주체의 한계를 문서에 밝힌다
  rule: 점검은 모두 Claude 작업자가 하며, 실제 전문가·현장 검증은 발간 뒤 과제로 「이 문서의 한계」 항에 밝힌다.
  core:
  - 품질
  area: Q1
  layer: 본체
  status: 적용됨
  enforce: []
- id: Q2-002
  title: 뺀 자리는 구체 내용으로 채움
  rule: 관계 문장을 뺀 자리는 비워 두지 말고 내용으로 채운다(「앞의 결정이 뒤를 제약한다」에서 멈추지 말고 구체 조건과 결과까지).
  core:
  - 품질
  area: Q2
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q2-009
  title: 별첨의 필요성 판정
  rule: 별첨마다 「누가, 언제, 무엇을 하려고 펼치는가」를 한 줄로 댈 수 있어야 하며, 댈 수 없으면 두지 않고 남기는 별첨은 머리 첫 문장에 그 쓰임을 적는다.
  core:
  - 품질
  area: Q2
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q2-012
  title: 점검 항목은 섬세하게
  rule: 한 줄에 한 가지만 묻고, 충족 기준은 「○」로 적을 조건을 문장(값이 있으면 값)으로, 확인 방법은 무엇을 보고 확인하는지로, 근거는 본문 절·표와 REF 로 쓴다. 본문이 확인하지 못한 값은 확인 방법과 「이월」로 다룬다.
  core:
  - 품질
  area: Q2
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V65
    level: 막음
- id: Q2-016
  title: 설명은 그 자리에서 완결
  rule: 설명이 필요한 자리는 그 자리에서 완결하며 다른 문서·다른 절 안내는 덧붙임이지 설명을 대신하지 않는다.
  core:
  - 품질
  area: Q2
  layer: 본체
  status: 대기
  enforce: []
  edition: 플러그인 판 문구
- id: Q3-002
  title: 확정 용어·정식 명칭은 바꾸지 않음
  rule: 프로젝트 설정이 정한 확정 용어, 정식 명칭·식별자·인용 원문은 흔한 말로 바꾸지 않는다. 「자리」·「몫」처럼 평범한 쓰임이 많은 말은 사람이 문맥으로 본다.
  core:
  - 일관성
  - 쉬운 말
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce: []
  edition: 플러그인 판 문구
- id: Q3-003
  title: 정식 이름은 지키고 첫 등장에 풀이
  rule: 여러 문서가 같이 쓰는 정식 이름은 문서마다 바꾸지 않고, 처음 나오는 곳에서 한 문장으로 푼다(단위 값 tok.first_use_unit).
  core:
  - 일관성
  - 쉬운 말
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce: []
  edition: 플러그인 판 문구
- id: Q3-004
  title: 표제를 바꾸면 부르는 곳도 바꿈
  rule: 표제를 바꾸면 차례 파일·렌더 설정의 장 제목·본문의 「…」 항 참조·장 구성 표를 함께 바꾼다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V2
    level: 막음
  edition: 플러그인 판 문구
- id: Q3-005
  title: 구조 변경 뒤 번호·수 전수 확인
  rule: 구조를 바꾼 뒤에는 남은 부·장 번호, 「다섯 행」 같은 수, 옛 장 번호를 단 표를 전수 확인한다. 수식에 역참조가 박혀 있으면 치환 사고다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V2
    level: 막음
  - gate: V37
    level: 막음
- id: Q3-008
  title: 어려운 용어는 웹북 각주로 풀이
  rule: 정본은 공통 용어집 한 벌이고 카드 본문에 쓰지 않는다. 웹북이 각 절 첫 등장에 번호를 달아 풀이를 띄우고 쪽 끝 「용어 풀이」로 모으며, 제목·표·그림·요약·결론·인용·수식에는 달지 않고 절당 값 tok.footnote_terms_per_section 까지, 풀이는 출처가 뒷받침한다.
  core:
  - 쉬운 말
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V61
    level: 막음
  edition: 플러그인 판 문구
- id: Q3-009
  title: 약어는 장마다 첫 등장에 한 번 풀이
  rule: 독자는 장 단위로 읽으므로 약어는 장마다 처음 나오는 곳에서 한 번 풀고 그 뒤로는 약어만 쓴다.
  core:
  - 일관성
  - 쉬운 말
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V64
    level: 막음
  - gate: DECK-quality-Q5
    level: 막음
  edition: 플러그인 판 문구
- id: Q3-010
  title: 약어 풀이에 영문 원어까지
  rule: '꼴은 「한글 풀이(약어, 영문 원어)」 한 번, 「주:」 줄은 「주: SOP(Standard Operating Procedure): 표준 운영 절차.」이다. 원어는 낱말 첫 글자 대문자(기관·표준은 공식 표기), 원천은 문서 약어표 → 영문 원어 사전, 고유 이름(제품·규격 이름 등)에는 원어를 달지 않으며 원어는 문장 길이에 세지 않는다.'
  core:
  - 일관성
  - 쉬운 말
  area: Q3
  layer: 본체
  status: 일부
  enforce:
  - gate: V64
    level: 막음
  - gate: V27
    level: 막음
  - gate: V18
    level: 막음
  edition: 플러그인 판 문구
- id: Q3-011
  title: 표·괄호 속 약어는 「주:」 줄로
  rule: '표 안 첫 등장 약어와 괄호 속 나열 약어는 풀이를 겹쳐 넣지 않고 표나 문단 바로 아래 「주: 약어: 풀이 · 약어: 풀이.」 한 줄로 푼다(줄표 없이).'
  core:
  - 일관성
  - 쉬운 말
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V64
    level: 막음
  - gate: V28
    level: 막음
- id: Q3-012
  title: 풀지 않는 약어, 마우스 올림 풀이 없음
  rule: 서지(학술지·출판사·보고서 번호·DOI), 출처 표기 괄호, 문서 영문 이름, 표준 번호의 일부(ISO 9001)는 풀지 않는다. 웹북에 마우스 올림 풀이는 두지 않는다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce: []
  edition: 플러그인 판 문구
- id: Q3-015
  title: 어려운 전문 용어도 장 첫 등장에 풀이·원어
  rule: 약어뿐 아니라 어려운 전문 용어도 장마다 첫 등장에 우리말 풀이와 원어를 단다(광 차단(light interception)). 지표 약어(POD·FAR·CSI·HSS)를 풀이 없이 나열하지 않는다.
  core:
  - 쉬운 말
  - 일관성
  area: Q3
  layer: 본체
  status: 대기
  enforce: []
- id: Q3-019
  title: 판정 기호 여섯과 적는 규율
  rule: 판정 기호는 ○ / △ / ✕ / 해당 없음 / 이월(확인할 곳·때가 정해진 미확인) / 빈칸(미확인)의 여섯이다. 기호만 적지 않고 근거 한 줄, △ 를 ○ 로 올리지 않음, 해당 없음과 빈칸을 섞지 않음, 이월의 기한, 한 장의 단위를 사용법에 둔다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q3-023
  title: 한 표기에 두 뜻을 두지 않음
  rule: 한 표기(낱말·약어·기호)에 두 뜻을 두지 않고 「문맥으로 구분한다」는 문장도 쓰지 않는다. 두 뜻이 보이면 한쪽 이름을 바꾼다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 일부
  enforce:
  - gate: V70
    level: 막음
- id: Q3-025
  title: 외부 표준 이름은 그 이름과 함께
  rule: 외부 표준의 고유 이름(SMAP L3, GNSS L1 대역, SAE 기준 3단계, LCIM 수준)은 바꾸지 않되 늘 그 이름과 함께 쓴다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 일부
  enforce:
  - gate: V70
    level: 막음
- id: Q3-026
  title: 외부 과제 이름은 낫표로 원형대로
  rule: 외부 과제·사업의 고유 이름은 낫표로 원형대로 적는다(「레벨 4 자율주행 기술 개발」) — V70 은 이것을 식별자 검사에서 뺀다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 일부
  enforce:
  - gate: V70
    level: 막음
  edition: 플러그인 판 문구
- id: Q3-028
  title: 한 뜻에는 한 말 — 같은 것을 여러 이름으로 부르지 않음
  rule: 같은 뜻은 문서 안팎·표제·표·그림 어디서나 한 낱말로 부르고, 문맥에 따라 다른 말로 갈라 쓰지 않는다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 일부
  enforce:
  - gate: V5
    level: 막음
  - gate: REV-series_metrics
    level: 기록만
- id: Q3-057
  title: 「아니요」로 씀
  rule: 결정 트리의 갈림·판정 칸·진단 물음의 대답말은 표준어 「아니요」로 쓴다(「아니오」 아님).
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 일부
  enforce: []
- id: Q3-067
  title: 번호 다시 매기면 참조도 함께
  rule: 표 번호를 다시 매기면 같은 카드·다른 카드의 참조 문구도 함께 고치고 grep 으로 확인한다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V2
    level: 막음
  - gate: V12
    level: 막음
- id: Q3-068
  title: 도메인 표기 통일
  rule: 핵심 표기가 엇갈리면 최초 정의부에 정본 규약 1문장을 두고 나머지를 전역 치환한 뒤 잔존 0 을 확인한다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V5
    level: 막음
- id: Q3-074
  title: 약어 사전이 원고와 다르면 원고 말로 사전을 고친다
  rule: 약어 사전 풀이가 원고 약어표와 다르면 원고 말로 사전을 고친다. 서지는 그 문서의 reference_list.json 에서 가져온다.
  core:
  - 일관성
  area: Q3
  layer: 본체
  status: 적용됨
  enforce: []
  edition: 플러그인 판 문구
- id: Q5-035
  title: 절 번호·약호를 문장 성분으로 쓰지 않음
  rule: 「2부 G4는」·「차선 ①은」처럼 번호를 주어·목적어로 세우지 않고 대상은 이름으로 부르며 번호는 문장 끝 괄호에 한 번만 단다.
  core:
  - 쉬운 말
  - 일관성
  area: Q3
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-report_plain
    level: 기록만
- id: Q5-079
  title: 자주 틀리는 띄어쓰기 꼴은 목록으로 잡음
  rule: 국립국어원 기준으로 확실히 틀린 띄어쓰기 꼴은 목록에 두고 게이트로 잡으며, 목록은 코드가 아니라 설정 파일에 둔다.
  core:
  - 일관성
  - 쉬운 말
  area: Q3
  layer: 본체
  status: 대기
  enforce:
  - gate: V76
    level: 기록만
  edition: 플러그인 판 문구
- id: Q1-039b
  title: 재구성 때 설명 문단은 지우지 않고 옮김
  rule: 절을 다시 짤 때 설명 문단은 지우지 않고 옮기며, 지울 수 있는 것은 같은 내용의 되풀이뿐이다.
  core: *id002
  area: Q4
  layer: 본체
  status: 일부
  enforce:
  - gate: REV-preserve_baseline
    level: 기록만
- id: Q4-002
  title: 같은 데이터를 두 번 그리지 않음
  rule: 같은 데이터를 두 번 그리지 않는다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 알 수 없음
  enforce: []
  edition: 플러그인 판 문구
- id: Q4-004
  title: 지워도 판단이 안 바뀌는 문단은 없앰
  rule: 같은 말의 반복과 군더더기는 덜어낸다. 한 문단을 지웠을 때 독자의 판단이 달라지지 않으면 그 문단은 없어야 한다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q4-005
  title: 같은 말을 두 번 하지 않음
  rule: 한 주장은 한 자리에서만 편다. 인용구·도입 문단·표·표 해설이 같은 말을 되풀이하지 않게 하고, 정의는 한 곳에 두고 나머지는 번호로 부른다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q4-008
  title: 본문·별첨에 같은 표를 두 번 싣지 않음
  rule: 현장 도구(서식·점검표·계산표)는 별첨이 정본이고 본문은 그 도구로 무엇을 판단하는지와 근거를 설명한 뒤 안내한다. 계산 예제 풀이는 본문에 한 벌, 빈 서식은 별첨에 둔다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: REV-dup_tables
    level: 기록만
- id: Q4-009
  title: 다루지 않는 내용은 한 문단
  rule: 범위는 무엇을 다루는가 + 다루지 않는 것의 한 문단이면 되고, 제외 근거를 항목마다 대거나 넘기는 일을 표로 만들거나 다른 문서 내용을 소개하지 않는다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 전 편 완료
  enforce: []
  edition: 플러그인 판 문구
- id: Q4-010
  title: 장 사이 중복은 검토한 뒤 지움
  rule: 중복 대장(같은 내용 자리·남길 자리·지울 것)을 먼저 만들고 정의는 정의 자리 한 곳에 두고 나머지는 그 절을 부르는 한 구절로 줄인다. 되풀이한 문장만 지우고 그 자리만의 설명·예·값은 남기거나 옮기며, 지운 값·REF 가 남는지 대조한다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 대기
  enforce: []
- id: Q4-012
  title: 같은 계산은 한 곳에 상자
  rule: 같은 계산을 여러 절이 쓰면 한 곳에 상자를 두고 나머지는 그 절을 가리킨다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q4-016
  title: 한 도구는 한 묶음의 한 일
  rule: 한 도구는 한 독자 묶음의 한 일에 쓰며 다른 문서의 도구와 하는 일이 겹치면 단계를 나눠 넘긴다(예 1차 선별 도구 → 정밀 진단 도구).
  core:
  - 품질
  - 일관성
  area: Q4
  layer: 본체
  status: 전 편 완료
  enforce: []
  edition: 플러그인 판 문구
- id: Q4-020
  title: 구성 문장은 한 곳에만
  rule: 「이 문서는 N부와 결론으로 이루어진다」 같은 구성 문장은 개요 「문서의 구성」 한 곳에만 두고 일러두기에서 되풀이하지 않는다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 일부
  enforce: []
- id: Q4-022
  title: 상자는 본문을 되풀이하지 않음
  rule: 상자에는 정의·주의·수식처럼 상자에만 있는 것을 담고 본문을 되풀이하지 않는다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 대기
  enforce: []
- id: Q4-023
  title: 「종합」·「정리」 소항을 두지 않음
  rule: 종합은 절 결론의 몫이므로 「종합」·「정리」 소항을 두지 않는다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 대기
  enforce:
  - gate: V78
    level: 기록만
- id: Q4-026
  title: 달라지지 않으면 한 줄, 억지로 채우지 않음
  rule: 대상에 따라 달라지지 않는 장·단계는 「대상에 따라 달라지지 않음」 한 줄로 두고 억지로 채우지 않으며, 국내 값이 없으면 없다고 밝힌다.
  core:
  - 품질
  area: Q4
  layer: 본체
  status: 대기
  enforce: []
  edition: 플러그인 판 문구
- id: Q5-001
  title: 독자는 가장 낯선 사람 기준, 공식 문장으로 밝힘
  rule: 함께 읽는 독자 가운데 가장 낯선 사람이 따라올 수 있는 말과 구성으로 쓴다. 독자는 정해진 공식 문장 한 번으로 밝힌다(「이 문서는 … 을 대상으로 작성되었다」).
  core:
  - 쉬운 말
  - 품질
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce: []
- id: Q5-002
  title: 기획 언어를 본문에 두지 않음
  rule: REQ 번호, 과정1·2 같은 기획 구분, 판본명, 「본 문서(코드)는」 같은 자칭, 문서 코드 약칭, 저작 도구 용어(카드·SSOT·KeyRef·writer·sec4)를 본문에 두지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V3
    level: 막음
  - gate: V51
    level: 막음
  edition: 플러그인 판 문구
- id: Q5-003
  title: 한자를 쓰지 않음
  rule: 본문에 한자를 쓰지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-004
  title: 문장·문단 길이 상한
  rule: '한 문장은 값: tok.sentence_max, 한 문단은 값: tok.paragraph_max 를 넘지 않는다.'
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V27
    level: 막음
  - gate: V18
    level: 막음
- id: Q5-007
  title: 문서가 자기 이야기를 하지 않음
  rule: 「이 장은 ~에 답한다」·「다시 정의하지 않는다」·집필 규율·개정 이력·인용 건수 같은 편집 사정을 본문에 두지 않는다. 부·장 분업은 개요에 한 번만, 펼 자리를 짚는 한 줄 지시는 허용한다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V24
    level: 막음
- id: Q5-008
  title: 한 문단은 결론 하나, 앞머리에 결론
  rule: 한 문단은 결론 하나로 서며 앞머리에 결론, 뒤에 근거를 둔다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-009
  title: 자기 교정 과정을 남기지 않음
  rule: 「그런데 한 겹 더 갈라야 한다 … 정확한 결론은」 같은 자기 교정 과정은 결론만 남기고, 「곧 ~이다」·「그것이 이 장의 역할이다」로 문단을 닫지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-010
  title: 줄표는 한 문장에 한 번, 줄표로 이은 선언은 나눔
  rule: 한 문장에 줄표(—)는 한 번까지다(짝 이룬 삽입구는 한 번으로 센다). 줄표로 이은 선언·이유와 긴 삽입구는 문장을 나누거나 괄호로 내린다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V28
    level: 막음
- id: Q5-011
  title: 대구 수사를 골격으로 쓰지 않음
  rule: 「A는 ~를 묻고 B는 ~를 답한다」 같은 대구 수사를 문서의 골격으로 쓰지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-012
  title: 굵게 쓰기 밀도 상한
  rule: 굵게는 한 문단에 값 tok.bold_per_paragraph, 본문 만자당 값 tok.bold_per_10k 이하로 쓴다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V29
    level: 막음
  edition: 플러그인 판 문구
- id: Q5-013
  title: 관계가 아니라 내용을 적음
  rule: 부·장 사이의 지위·분업·역할을 설명하는 문장을 본문에 두지 않는다. 허용은 독자가 그 자리에서 펼 곳을 짚는 한 줄 지시뿐이다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 전 편 완료
  enforce:
  - gate: V33
    level: 막음
  edition: 플러그인 판 문구
- id: Q5-014
  title: 분열문을 쓰지 않음
  rule: 「~하는 것은 ~이다」 분열문 대신 주어를 실질명사로 세운 평서문으로 쓴다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: REV-report_style
    level: 기록만
- id: Q5-015
  title: 고유어 수사를 홀로 세우지 않음
  rule: 「셋이 들어간다」·「넷이다」 대신 「세 요소로 구성한다」·「네 가지다」로 쓰고, 자(者)로 기준·조건을 받지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: REV-report_style
    level: 기록만
- id: Q5-016
  title: 낫표는 절·표 표제를 부를 때만
  rule: 홑낫표는 이 문서의 절·표 표제를 부를 때만 쓴다. 사람의 말은 큰따옴표, 용어 지칭은 작은따옴표, 예문은 인용 블록이나 표 칸에 두며 문장을 통째로 감싸지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce: []
- id: Q5-017
  title: 줄표를 쓰는 자리
  rule: 줄표는 짝 이룬 삽입구와 목록 항목 머리말 뒤에만 쓴다. 정의·열거는 쌍점, 바꿔 말하기는 「곧,」·「즉,」으로 쓰고, 행 끝 줄표·주어와 서술어를 가르는 이중 줄표·캡션의 줄표는 쓰지 않는다.
  core:
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V28
    level: 막음
  - gate: V52
    level: 막음
- id: Q5-019
  title: 소표제는 명사형 러닝헤드, 마침표 없음
  rule: 문장을 굵게 감싸 표제를 대신하지 않는다. 문단 앞 짧은 명사형 러닝헤드는 마침표 없이 쓰고, 절 제목 바로 뒤 굵은 한 줄(절의 선언)은 문장이라 마침표를 단다.
  core: &id003
  - 쉬운 말
  area: Q5
  layer: 본체
  status: 알 수 없음
  enforce:
  - gate: V44
    level: 막음
- id: Q5-019b
