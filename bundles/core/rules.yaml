  area: Q5
  layer: 본체
  status: 대기
  enforce: []
- id: Q5-063
  title: 자칭은 「이 문서」
  rule: 자칭은 「이 문서」로 통일하고 「본 보고서」·「본 카드」·「본 백과」를 쓰지 않는다.
