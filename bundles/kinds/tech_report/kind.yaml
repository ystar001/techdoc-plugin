# 문서 종류 묶음 — tech_report (플러그인 기본 문서 종류, v1.11-c Task 4 · E18 1·2)
#
# 겹침: 본체 기본 → 이 파일 → 프로젝트 techdoc.project.yaml (뒤가 이김).
#   표(dict)는 키마다 재귀로 겹치고, 값·목록은 프로젝트가 적으면 통째로 교체한다.
schema: techdoc-kind/1
description: >-
  플러그인이 만드는 기술보고서 — 카드(기술 7·프로젝트 7·제품 6블록) + 별첨.
  분량은 하한만, 그것도 경고(qc 게이트 PLG-CQ-self_model_length·VC-C 수준이 경고).
gates:
  level: {}
  off: []
extra:
  # 분량 하한(경고) — 플러그인 자체 카드 규칙 prompts/card_length_rules.md의 가장 낮은 하한
  # (기술 카드 low 800자 = constants.CARD_LENGTH_BY_IMPORTANCE["low"]["tech"][0], 테스트로 고정).
  # self-model 카드 하나는 분할 조각(L1~L3)·앞붙이(P0)라도 카드 하나 이상의 분량을 기대한다.
  # 상한은 두지 않는다(E18 — 넘치면 별첨으로 옮기는 안내만).
  check_quality:
    size_thresholds: {S: 800, L1: 800, L2: 800, L3: 800, P0: 800, "?": 800}
  verify_cards:
    thresholds: {S: 800, L1: 800, L2: 800, L3: 800, P0: 800,
                 XL1: 800, XL2: 800, XL3: 800, XL4: 800, XL5: 800}
  # V88 — 플러그인 렌더러가 카드마다 내는 고정 블록 표제(constants.DEFAULT_SECTION_TITLES와 같아야
  # 함, 테스트로 고정). 프로젝트의 allow_heads와 합쳐 세지 않는다.
  repeat:
    block_heads: [정의·범위, 원리·구조, 국내외 동향, 구성요소·방법론, 한계·도전, 전망]
expects: {}
